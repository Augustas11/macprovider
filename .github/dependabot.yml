    directory: "/phase4-coordinator"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2

  - package-ecosystem: "gomod"
    directory: "/phase5-gateway"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2

  - package-ecosystem: "swift"
    directory: "/phase3-binary"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
