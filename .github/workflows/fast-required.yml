# DRAFT, NOT ENABLED. Risk-sized fast gate. It runs only by manual dispatch
# until ci-required is changed to select it (see scripts/ops/README.md,
# "Risk-sized gates"). To enable it, replace `on:` with the commented
# pull_request trigger in the same PR as the ci-required change.
#
# Budget: under 5 minutes. Every check is scoped to the diff:
#   - gofmt and go vet on the touched Go packages only, per module
#   - catalog-release.py verify when phase3-binary/catalog/ changed
#   - the scripts/ops tests when scripts/ops/ changed
#   - check_spec_pr_declaration.py
#   - bash -n on touched shell scripts (syntax only, no shellcheck)
# It also prints lane=fast|full. `fast` only when every changed path is
# Markdown at the repo root or under docs/, audits/ or beta/, or an agent rule
# under .cursor/rules/ (matched case-insensitively). Everything else, including
# specs/, fixtures, coordinator config examples, the catalog and scripts/ops,
# is `full`: those have full-CI consumers.
name: fast-required

on:
  workflow_dispatch:
    inputs:
      base:
        description: base commit (40-hex)
        required: true
        type: string
      head:
        description: head commit (40-hex)
        required: true
        type: string
  # pull_request:

permissions:
  contents: read

concurrency:
  group: fast-required-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast-required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lane: ${{ steps.diff.outputs.lane }}
    steps:
      - name: Checkout
        # Pinned to actions/checkout v6 (df4cb1c0), as in ci.yml.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      # test-runbook-commands.sh compares against origin/main.
      - name: Fetch origin/main
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Classify the diff
        id: diff
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_BASE: ${{ github.event.inputs.base }}
          INPUT_HEAD: ${{ github.event.inputs.head }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then base="$PR_BASE_SHA"; head="$PR_HEAD_SHA"; else base="$INPUT_BASE"; head="$INPUT_HEAD"; fi
          [[ "$base" =~ ^[0-9a-f]{40}$ && "$head" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::base/head must be 40-hex"; exit 1; }
          git diff --no-renames --name-only -z "$base" "$head" > "$RUNNER_TEMP/changed"
          printf 'base=%s\nhead=%s\n' "$base" "$head" >> "$GITHUB_OUTPUT"
          shopt -s nocasematch
          lane=fast
          catalog=false
          ops=false
          : > "$RUNNER_TEMP/go-files"
          : > "$RUNNER_TEMP/sh-files"
          while IFS= read -r -d '' f; do
            case "$f" in
              *.go) printf '%s\n' "$f" >> "$RUNNER_TEMP/go-files" ;;
              *.sh) printf '%s\n' "$f" >> "$RUNNER_TEMP/sh-files" ;;
            esac
            case "$f" in
              phase3-binary/catalog/*) catalog=true ;;
              scripts/ops/*) ops=true ;;
            esac
            # Fail closed: anything not on this list needs the full CI.
            case "$f" in
              */*.md) case "$f" in docs/*|audits/*|beta/*) ;; *) lane=full ;; esac ;;
              *.md) ;;
              .cursor/rules/*) ;;
              *) lane=full ;;
            esac
          done < "$RUNNER_TEMP/changed"
          printf 'lane=%s\ncatalog=%s\nops=%s\n' "$lane" "$catalog" "$ops" >> "$GITHUB_OUTPUT"
          echo "lane=$lane catalog=$catalog ops=$ops"

      - name: Set up Go
        if: hashFiles('**/go.mod') != ''
        # Pinned to actions/setup-go v7.0.0, as in ci.yml.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: phase4-coordinator/go.mod
          cache: false

      - name: gofmt and go vet on touched packages
        shell: bash
        run: |
          set -euo pipefail
          [ -s "$RUNNER_TEMP/go-files" ] || { echo "no Go changes"; exit 0; }
          existing=()
          while IFS= read -r f; do [ -f "$f" ] && existing+=("$f"); done < "$RUNNER_TEMP/go-files"
          [ "${#existing[@]}" -gt 0 ] || { echo "only deleted Go files"; exit 0; }
          unformatted="$(gofmt -l "${existing[@]}")"
          [ -z "$unformatted" ] || { echo "::error::gofmt needed:"; echo "$unformatted"; exit 1; }
          for module in phase4-coordinator phase5-gateway phase7-verify test/integration; do
            pkgs=()
            while IFS= read -r d; do [ -n "$d" ] && pkgs+=("$d"); done < <(printf '%s\n' "${existing[@]}" |
              awk -v m="$module/" 'index($0, m) == 1 { sub(m, ""); n = split($0, p, "/"); d = "."; for (i = 1; i < n; i++) d = d "/" p[i]; print d }' | sort -u)
            [ "${#pkgs[@]}" -gt 0 ] || continue
            echo "go vet in $module: ${pkgs[*]}"
            (cd "$module" && go vet "${pkgs[@]}")
          done

      - name: Verify the catalog release
        if: steps.diff.outputs.catalog == 'true'
        run: python3 scripts/catalog-release.py verify

      - name: scripts/ops tests
        if: steps.diff.outputs.ops == 'true'
        run: |
          bash scripts/ops/test-ops-guard.sh
          bash scripts/ops/test-live-lock.sh
          bash scripts/ops/test-runbook-commands.sh
          bash scripts/ops/test-entrypoints.sh
          bash scripts/ops/test-fast-required.sh

      - name: Require the behavior-change declaration
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_spec_pr_declaration.py --event "$GITHUB_EVENT_PATH" --base "${{ steps.diff.outputs.base }}" --head "${{ steps.diff.outputs.head }}"

      - name: Shell syntax on touched scripts
        shell: bash
        run: |
          set -euo pipefail
          status=0
          while read -r f; do
            [ -f "$f" ] || continue
            bash -n "$f" || status=1
          done < "$RUNNER_TEMP/sh-files"
          exit "$status"

      - name: Report the lane
        shell: bash
        run: |
          echo "lane=${{ steps.diff.outputs.lane }}" >> "$GITHUB_STEP_SUMMARY"
          echo "lane=${{ steps.diff.outputs.lane }}"
