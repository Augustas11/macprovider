name: Publish native-MTP revocation slots

# Keeps the SPEC-023 §12.5 native-MTP emergency-revocation feed published.
# Providers accept a revocation body only while it is current (one-hour
# bodies, pre-signed in 14-day batches), so this is the one scheduled signer
# left after #1938 removed the calendar renewals of the static feeds and the
# discovery head. It signs a fresh batch off-host with the static-feed key,
# verifies it, and atomically retargets Pearl's revocation `current` link. It
# does not restamp, re-sign or SIGHUP any feed.
#
# The key MUST NOT live on Pearl. It is the autotune-feed-renewal secret
# (AUTOTUNE_STATIC_V4_PRIVATE_KEY_BASE64). This environment has no reviewer
# gate so the weekly batch can run unattended. An emergency revocation is the
# same script run from an operator Mac (see the script header).

on:
  workflow_dispatch:
  schedule:
    # Wednesday 16:00 UTC; a 14-day batch survives one missed run.
    - cron: "0 16 * * 3"

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  publish:
    name: Sign and publish a 14-day revocation batch
    runs-on: macos-15-intel
    environment: autotune-feed-renewal
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout reviewed publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify protected GitHub release posture
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_POSTURE_TOKEN }}
        run: POSTURE_PROFILE=unattended bash scripts/verify-github-release-posture.sh "$GITHUB_REPOSITORY" autotune-feed-renewal 28995904

      - name: Seal reviewed OpenSSL 3
        id: protected_openssl
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          sealed_bin="$(
            bash scripts/install-sealed-release-openssl.sh \
              /private/var/macprovider-openssl-native-mtp-revocations
          )"
          "$sealed_bin" version | grep -E '^OpenSSL 3\.'
          printf 'bin=%s\n' "$sealed_bin" >> "$GITHUB_OUTPUT"

      - name: Sign, verify and publish the batch to Pearl
        shell: bash
        env:
          OPENSSL_BIN: ${{ steps.protected_openssl.outputs.bin }}
          AUTOTUNE_STATIC_V4_PRIVATE_KEY_BASE64: ${{ secrets.AUTOTUNE_STATIC_V4_PRIVATE_KEY_BASE64 }}
          PEARL_AUTOTUNE_DEPLOY_SSH_KEY: ${{ secrets.PEARL_AUTOTUNE_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          [ -x "$OPENSSL_BIN" ] || {
            echo "::error::sealed OPENSSL_BIN is required" >&2
            exit 1
          }
          "$OPENSSL_BIN" version | grep -E '^OpenSSL 3\.'
          [ -n "$AUTOTUNE_STATIC_V4_PRIVATE_KEY_BASE64" ] || {
            echo "::error::AUTOTUNE_STATIC_V4_PRIVATE_KEY_BASE64 is required (autotune-feed-renewal secret)" >&2
            exit 1
          }
          [ -n "$PEARL_AUTOTUNE_DEPLOY_SSH_KEY" ] || {
            echo "::error::PEARL_AUTOTUNE_DEPLOY_SSH_KEY is required (autotune-feed-renewal secret)" >&2
            exit 1
          }
          key="$(mktemp "$RUNNER_TEMP/autotune-static.XXXXXX.b64")"
          ssh_key="$(mktemp "$RUNNER_TEMP/pearl-autotune-deploy.XXXXXX")"
          trap 'rm -f "$key" "$ssh_key"' EXIT
          umask 077
          printf '%s\n' "$AUTOTUNE_STATIC_V4_PRIVATE_KEY_BASE64" > "$key"
          printf '%s\n' "$PEARL_AUTOTUNE_DEPLOY_SSH_KEY" > "$ssh_key"
          chmod 600 "$key" "$ssh_key"
          unset AUTOTUNE_STATIC_V4_PRIVATE_KEY_BASE64 PEARL_AUTOTUNE_DEPLOY_SSH_KEY
          export AUTOTUNE_STATIC_PRIVATE_KEY_PATH="$key"
          export PEARL_SSH_IDENTITY="$ssh_key"
          export PEARL_SSH_KNOWN_HOSTS="$GITHUB_WORKSPACE/scripts/dist/malibu-download-known_hosts"
          export PEARL_SSH="root@159.223.165.194"
          bash scripts/publish-native-mtp-revocations.sh --deploy

  alarm:
    # Route the outcome to an `ops-alarm` issue (#1920): failure opens or
    # updates it, the next success closes it.
    needs: [publish]
    if: ${{ always() }}
    uses: ./.github/workflows/ops-alarm.yml
    permissions:
      contents: read
      issues: write
    with:
      key: publish-native-mtp-revocations
      title: the native-MTP revocation batch publish failed
      result: ${{ needs.publish.result }}
