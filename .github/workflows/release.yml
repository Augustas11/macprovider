name: Release macprovider-cli

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v1.2.1"
        required: true
        type: string
      prerelease:
        description: "Publish as a prerelease canary and do not mark latest"
        required: false
        default: false
        type: boolean
      candidate:
        description: "Build unsigned candidate inputs before the release tag exists"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned release inputs from reviewed main
    # The official macos-15 image contract carries Xcode 16.4 (16F6) at
    # /Applications/Xcode_16.4.app and macOS SDK 15.5:
    # https://github.com/actions/runner-images/blob/main/images/macos/macos-15-Readme.md
    runs-on: macos-15
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release_source.outputs.tag }}
      commit: ${{ steps.release_source.outputs.commit }}
      prerelease: ${{ steps.release_source.outputs.prerelease }}
    steps:
      - name: Checkout
        # Pinned to actions/checkout v6.0.3. Re-resolve deliberately
        # when upgrading the action rather than trusting a mutable tag.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Verify reviewed release source
        id: release_source
        shell: bash
        env:
          RELEASE_VERSION_INPUT: ${{ github.event.inputs.version }}
          RELEASE_PRERELEASE_INPUT: ${{ github.event.inputs.prerelease || 'false' }}
          RELEASE_CANDIDATE_INPUT: ${{ github.event.inputs.candidate || 'false' }}
        run: |
          set -euo pipefail
          bash scripts/validate-release-inputs.sh \
            "$RELEASE_VERSION_INPUT" "$RELEASE_PRERELEASE_INPUT" \
            "$RELEASE_CANDIDATE_INPUT"
          tag="$RELEASE_VERSION_INPUT"
          commit="$(git rev-parse HEAD)"
          absence_policy="--require-existing"
          if [[ "$RELEASE_CANDIDATE_INPUT" == "true" ]]; then
            absence_policy="--allow-absent"
          fi
          bash scripts/verify-release-source.sh \
            "$tag" "$commit" origin "$absence_policy"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "prerelease=$RELEASE_PRERELEASE_INPUT" >> "$GITHUB_OUTPUT"

      - name: Verify content-pinned app build inputs
        shell: bash
        run: bash scripts/verify-app-build-inputs.sh "${{ steps.release_source.outputs.commit }}"

      - name: Verify release version cohesion
        shell: bash
        run: bash scripts/test-coordinator-advertised-version.sh "${{ steps.release_source.outputs.tag }}"

      - name: Select and verify reviewed release toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          bash scripts/verify-release-toolchain.sh "$RUNNER_TEMP/release-toolchain.json"

      - name: Setup Go for Pearl binaries
        # Pinned to actions/setup-go v6.5.0. Linux binaries are cross-compiled
        # without CGO and carried as unsigned inputs into the protected signer.
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.4"
          cache-dependency-path: |
            phase4-coordinator/go.sum
            phase5-gateway/go.sum

      - name: Build Pearl linux-amd64 binaries
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release_source.outputs.tag }}"
          (
            cd phase4-coordinator
            GOTOOLCHAIN=local CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -mod=readonly -trimpath \
              -ldflags "-s -w -X main.version=$tag" \
              -o "$RUNNER_TEMP/coordinator-linux-amd64" ./cmd/coordinator
            GOTOOLCHAIN=local CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -mod=readonly -trimpath \
              -ldflags "-s -w" \
              -o "$RUNNER_TEMP/coordinator-cli-linux-amd64" ./cmd/coordinator-cli
          )
          (
            cd phase5-gateway
            GOTOOLCHAIN=local CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -mod=readonly -trimpath \
              -ldflags "-s -w -X main.version=$tag" \
              -o "$RUNNER_TEMP/gateway-linux-amd64" ./cmd/gateway
          )
          file "$RUNNER_TEMP/coordinator-linux-amd64" \
            "$RUNNER_TEMP/coordinator-cli-linux-amd64" \
            "$RUNNER_TEMP/gateway-linux-amd64" \
            | tee pearl-file.txt
          grep -Eq "coordinator-linux-amd64:[[:space:]]+ELF 64-bit.*x86-64" pearl-file.txt
          grep -Eq "coordinator-cli-linux-amd64:[[:space:]]+ELF 64-bit.*x86-64" pearl-file.txt
          grep -Eq "gateway-linux-amd64:[[:space:]]+ELF 64-bit.*x86-64" pearl-file.txt
          for binary in coordinator-linux-amd64 coordinator-cli-linux-amd64 gateway-linux-amd64; do
            go version -m "$RUNNER_TEMP/$binary" > "$RUNNER_TEMP/$binary.buildinfo"
            grep -Fq 'GOOS=linux' "$RUNNER_TEMP/$binary.buildinfo"
            grep -Fq 'GOARCH=amd64' "$RUNNER_TEMP/$binary.buildinfo"
          done
          strings "$RUNNER_TEMP/coordinator-linux-amd64" > "$RUNNER_TEMP/coordinator-linux-amd64.strings"
          strings "$RUNNER_TEMP/gateway-linux-amd64" > "$RUNNER_TEMP/gateway-linux-amd64.strings"
          grep -Fq "$tag" "$RUNNER_TEMP/coordinator-linux-amd64.strings"
          grep -Fq "$tag" "$RUNNER_TEMP/gateway-linux-amd64.strings"

      - name: Install reviewed XcodeGen artifact
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install-pinned-xcodegen.sh "$RUNNER_TEMP/xcodegen-2.45.4"

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          cd phase3-binary/dist
          ./package.sh "${{ steps.release_source.outputs.tag }}"

      - name: Build Malibu.app
        shell: bash
        run: |
          set -euo pipefail
          cd phase3-binary/app
          "$RUNNER_TEMP/xcodegen-2.45.4/xcodegen/bin/xcodegen" generate
          resolved_dir="Malibu.xcodeproj/project.xcworkspace/xcshareddata/swiftpm"
          mkdir -p "$resolved_dir"
          cp Package.resolved "$resolved_dir/Package.resolved"
          xcodebuild \
            -project Malibu.xcodeproj \
            -scheme Malibu \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$RUNNER_TEMP/Malibu.xcarchive" \
            archive \
            -onlyUsePackageVersionsFromResolvedFile \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO
          cp -R "$RUNNER_TEMP/Malibu.xcarchive/Products/Applications/Malibu.app" \
            "$RUNNER_TEMP/Malibu.app"

      - name: Capture unsigned build artifact
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release_source.outputs.tag }}"
          mkdir -p unsigned-release-inputs
          cp "phase3-binary/dist/phase3-binary-m4-${tag}.tar.gz" unsigned-release-inputs/
          tar czf unsigned-release-inputs/Malibu.app.tar.gz -C "$RUNNER_TEMP" Malibu.app
          cp "$RUNNER_TEMP/release-toolchain.json" unsigned-release-inputs/
          cp "$RUNNER_TEMP/coordinator-linux-amd64" \
            "$RUNNER_TEMP/coordinator-cli-linux-amd64" \
            "$RUNNER_TEMP/gateway-linux-amd64" unsigned-release-inputs/
          unsigned_assets=(
            "unsigned-release-inputs/phase3-binary-m4-${tag}.tar.gz"
            unsigned-release-inputs/Malibu.app.tar.gz
            unsigned-release-inputs/release-toolchain.json
            unsigned-release-inputs/coordinator-linux-amd64
            unsigned-release-inputs/coordinator-cli-linux-amd64
            unsigned-release-inputs/gateway-linux-amd64
          )
          python3 scripts/build-release-provenance.py \
            "$tag" "${{ steps.release_source.outputs.commit }}" \
            "$GITHUB_REPOSITORY" "${{ steps.release_source.outputs.prerelease }}" \
            unsigned-release-inputs/release-toolchain.json \
            unsigned-release-inputs/unsigned-release-manifest.json \
            "${unsigned_assets[@]}"

      - name: Upload unsigned build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-release-${{ steps.release_source.outputs.commit }}
          path: unsigned-release-inputs/
          if-no-files-found: error
          retention-days: 1

  sign_publish:
    name: Sign and publish reviewed release
    needs: build
    runs-on: macos-15
    environment: production-release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout reviewed release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download unsigned build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: unsigned-release-${{ needs.build.outputs.commit }}
          path: ${{ runner.temp }}/unsigned-release-inputs

      - name: Restore captured unsigned inputs
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.build.outputs.tag }}"
          bash scripts/verify-release-source.sh \
            "$tag" "${{ needs.build.outputs.commit }}" origin --require-existing
          unsigned_dir="$RUNNER_TEMP/unsigned-release-inputs"
          unsigned_assets=(
            "$unsigned_dir/phase3-binary-m4-${tag}.tar.gz"
            "$unsigned_dir/Malibu.app.tar.gz"
            "$unsigned_dir/release-toolchain.json"
            "$unsigned_dir/coordinator-linux-amd64"
            "$unsigned_dir/coordinator-cli-linux-amd64"
            "$unsigned_dir/gateway-linux-amd64"
          )
          python3 scripts/build-release-provenance.py \
            "$tag" "${{ needs.build.outputs.commit }}" \
            "$GITHUB_REPOSITORY" "${{ needs.build.outputs.prerelease }}" \
            "$unsigned_dir/release-toolchain.json" \
            "$RUNNER_TEMP/expected-unsigned-release-manifest.json" \
            "${unsigned_assets[@]}"
          cmp "$unsigned_dir/unsigned-release-manifest.json" \
            "$RUNNER_TEMP/expected-unsigned-release-manifest.json"
          cp "$RUNNER_TEMP/unsigned-release-inputs/phase3-binary-m4-${tag}.tar.gz" \
            "phase3-binary/dist/phase3-binary-m4-${tag}.tar.gz"
          cp "$RUNNER_TEMP/unsigned-release-inputs/release-toolchain.json" release-toolchain.json
          for binary in coordinator-linux-amd64 coordinator-cli-linux-amd64 gateway-linux-amd64; do
            source="$RUNNER_TEMP/unsigned-release-inputs/$binary"
            test -f "$source"
            test ! -L "$source"
            install -m 0755 "$source" "$binary"
          done
          tar xzf "$RUNNER_TEMP/unsigned-release-inputs/Malibu.app.tar.gz" -C "$RUNNER_TEMP"
          test -d "$RUNNER_TEMP/Malibu.app"

      - name: Verify protected GitHub release posture
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_POSTURE_TOKEN }}
        run: bash scripts/verify-github-release-posture.sh "$GITHUB_REPOSITORY" production-release 28995904

      - name: Reverify captured release toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          bash scripts/verify-release-toolchain.sh "$RUNNER_TEMP/signing-release-toolchain.json"
          cmp release-toolchain.json "$RUNNER_TEMP/signing-release-toolchain.json"

      # SPEC-003 v0.8.2 follow-up: macOS 26.3.1+ tightened launchd's AMFI policy
      # to reject adhoc-signed binaries under `launchctl bootstrap`. Earlier
      # adhoc-signed releases (v1.2.x through v1.3.1) worked because they were
      # loaded under earlier macOS versions; fresh installs of v1.3.1 on
      # macOS 26.3.1 fail bootstrap with "5: Input/output error" because the
      # binary has no CMS blob. See memory:
      # macprovider-launchd-amfi-blocker-macos-26 for the full discovery
      # writeup (2026-06-12 session).
      #
      # The fix: codesign the binary with a Developer ID Application cert
      # and notarize via xcrun notarytool. The compatibility artifact remains
      # a tarball containing a standalone Mach-O executable, which Apple's
      # stapler cannot ticket directly. When a Developer ID Installer cert is
      # also present, this step additionally builds, signs, notarizes, staples,
      # and validates a flat pkg delivery container for install.sh to consume.
      # Production publication is fail closed: the protected environment must
      # supply a Developer ID identity and notarization credentials. An
      # adhoc-signed binary cannot satisfy the fresh-install launchd contract.
      - name: Sign + notarize binary
        shell: bash
        env:
          APPLE_DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_DEVELOPER_ID_INSTALLER_CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_CERT_P12_BASE64 }}
          APPLE_DEVELOPER_ID_INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_CERT_PASSWORD }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          WORK=""
          SIGNING_TMP=""
          NOTARIZE_ZIP=""

          tag="${{ needs.build.outputs.tag }}"
          src="phase3-binary/dist/phase3-binary-m4-${tag}.tar.gz"
          test -f "$src"

          if [ -z "$APPLE_DEVELOPER_ID_CERT_P12_BASE64" ]; then
            echo "::error::APPLE_DEVELOPER_ID_CERT_P12_BASE64 is required for a production release." >&2
            exit 1
          fi

          # Verify the remaining secrets are also present — partial setup
          # would silently produce an unsigned-but-claims-to-be-signed asset.
          missing=""
          for var in APPLE_DEVELOPER_ID_CERT_PASSWORD APPLE_NOTARY_APPLE_ID \
                     APPLE_NOTARY_PASSWORD APPLE_NOTARY_TEAM_ID; do
            if [ -z "$(printf '%s' "${!var}")" ]; then
              missing="$missing $var"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Developer ID cert present but other Apple secrets missing:$missing" >&2
            exit 1
          fi
          if [ -n "$APPLE_DEVELOPER_ID_INSTALLER_CERT_P12_BASE64" ] && \
             [ -z "$APPLE_DEVELOPER_ID_INSTALLER_CERT_PASSWORD" ]; then
            echo "::error::Developer ID Installer cert present but APPLE_DEVELOPER_ID_INSTALLER_CERT_PASSWORD missing" >&2
            exit 1
          fi

          # Step 1: import .p12 certificate identities into a transient
          # keychain. The Application identity signs the executable; the
          # Installer identity signs the staplable .pkg artifact.
          KEYCHAIN_PASS=$(openssl rand -hex 16)
          SIGNING_TMP=$(mktemp -d)
          echo "SIGNING_TMP=$SIGNING_TMP" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASS" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASS" build.keychain
          security set-keychain-settings -lut 3600 build.keychain

          echo "$APPLE_DEVELOPER_ID_CERT_P12_BASE64" | base64 -d > "$SIGNING_TMP/cert.p12"
          security import "$SIGNING_TMP/cert.p12" \
            -k build.keychain \
            -P "$APPLE_DEVELOPER_ID_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          if [ -n "$APPLE_DEVELOPER_ID_INSTALLER_CERT_P12_BASE64" ]; then
            echo "$APPLE_DEVELOPER_ID_INSTALLER_CERT_P12_BASE64" | base64 -d > "$SIGNING_TMP/installer-cert.p12"
            security import "$SIGNING_TMP/installer-cert.p12" \
              -k build.keychain \
              -P "$APPLE_DEVELOPER_ID_INSTALLER_CERT_PASSWORD" \
              -T /usr/bin/productsign \
              -T /usr/bin/security
          fi

          # Required on macOS Sierra+ so the codesign tool can access the
          # imported private key non-interactively.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" build.keychain

          # Step 2: codesign the binary with hardened runtime + secure
          # timestamp. Both are notarization requirements.
          SIGNING_ID=$(security find-identity -v -p codesigning build.keychain \
                      | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          if [ -z "$SIGNING_ID" ]; then
            echo "::error::No Developer ID Application identity found in imported cert" >&2
            exit 1
          fi
          INSTALLER_ID=""
          if [ -n "$APPLE_DEVELOPER_ID_INSTALLER_CERT_P12_BASE64" ]; then
            INSTALLER_ID=$(security find-identity -v build.keychain \
                          | awk -F'"' '/Developer ID Installer/ {print $2; exit}')
            if [ -z "$INSTALLER_ID" ]; then
              echo "::error::No Developer ID Installer identity found in imported cert" >&2
              exit 1
            fi
          fi

          # Extract tarball so we can sign the binary in place, then repack.
          WORK=$(mktemp -d)
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          tar xzf "$src" -C "$WORK"
          test -x "$WORK/macprovider-cli"

          codesign --force \
            --options runtime \
            --timestamp \
            --sign "$SIGNING_ID" \
            "$WORK/macprovider-cli"

          # Verify the signature before notarizing — surfaces problems
          # early (e.g. cert expired) without burning notary submission
          # quota.
          codesign --verify --strict --verbose=2 "$WORK/macprovider-cli"

          # Step 3: notarize. notarytool needs a zip or dmg, not a raw
          # binary, so wrap the binary in a transient zip for submission
          # only. The tarball is what we ship. Apple's stapler cannot
          # attach a ticket to a standalone executable, so Accepted
          # notarization is the release gate for this artifact format
          # (--wait blocks until notarization completes, typically 1-15
          # minutes).
          NOTARIZE_ZIP="$SIGNING_TMP/notary.zip"
          (cd "$WORK" && /usr/bin/ditto -c -k --keepParent macprovider-cli "$NOTARIZE_ZIP")

          scripts/notarytool-submit-with-retry.sh "$NOTARIZE_ZIP" \
            --apple-id "$APPLE_NOTARY_APPLE_ID" \
            --password "$APPLE_NOTARY_PASSWORD" \
            --team-id "$APPLE_NOTARY_TEAM_ID" \
            --wait
          rm -f "$NOTARIZE_ZIP"

          # Step 4: re-tar with the signed + notarized binary.
          # Preserve the same internal layout package.sh produced; the
          # only difference vs the input tarball is that
          # ./macprovider-cli now carries a real signature chain.
          rm -f "$src"
          tar czf "$src" -C "$WORK" .

          pkg_src="phase3-binary/dist/phase3-binary-m4-${tag}.pkg"
          if [ -n "$INSTALLER_ID" ]; then
            # Step 5: build a signed, notarized, stapled flat package as the
            # Apple-native delivery container. install.sh treats this as a
            # verified payload container and still owns per-user config,
            # launchd plist rendering, and support-file placement. A direct
            # Installer.app install is blocked by the package preinstall script
            # so operators do not bypass install.sh's user-level setup.
            PKG_ROOT="$WORK/pkg-root"
            PKG_SCRIPTS="$WORK/pkg-scripts"
            mkdir -p "$PKG_ROOT"
            mkdir -p "$PKG_SCRIPTS"
            cp "$WORK/macprovider-cli" "$PKG_ROOT/macprovider-cli"
            if [ -f "$WORK/mlx.metallib" ]; then
              cp "$WORK/mlx.metallib" "$PKG_ROOT/mlx.metallib"
            fi
            find "$WORK" -mindepth 1 -maxdepth 1 -name '*.bundle' -exec cp -R {} "$PKG_ROOT"/ \;
            if [ -f "$WORK/THIRD-PARTY-NOTICES.txt" ]; then
              cp "$WORK/THIRD-PARTY-NOTICES.txt" "$PKG_ROOT/THIRD-PARTY-NOTICES.txt"
            fi
            printf '%s\n' \
              '#!/bin/sh' \
              'echo "macprovider-cli.pkg is a signed delivery container for install.sh." >&2' \
              'echo "Install with: curl -fsSL https://get.streamvc.live/install.sh | bash" >&2' \
              'exit 1' \
              > "$PKG_SCRIPTS/preinstall"
            chmod 755 "$PKG_SCRIPTS/preinstall"

            UNSIGNED_PKG="$WORK/macprovider-cli-unsigned.pkg"
            SIGNED_PKG="$WORK/macprovider-cli.pkg"
            pkgbuild \
              --root "$PKG_ROOT" \
              --scripts "$PKG_SCRIPTS" \
              --identifier live.streamvc.macprovider.cli \
              --version "${tag#v}" \
              --install-location "/" \
              "$UNSIGNED_PKG"
            productsign --sign "$INSTALLER_ID" "$UNSIGNED_PKG" "$SIGNED_PKG"

            scripts/notarytool-submit-with-retry.sh "$SIGNED_PKG" \
              --apple-id "$APPLE_NOTARY_APPLE_ID" \
              --password "$APPLE_NOTARY_PASSWORD" \
              --team-id "$APPLE_NOTARY_TEAM_ID" \
              --wait
            xcrun stapler staple "$SIGNED_PKG"
            xcrun stapler validate "$SIGNED_PKG"
            cp "$SIGNED_PKG" "$pkg_src"
          else
            rm -f "$pkg_src"
            echo "::warning::APPLE_DEVELOPER_ID_INSTALLER_CERT_P12_BASE64 not set; skipping signed/stapled .pkg artifact."
          fi

          echo "  binary signed by: $SIGNING_ID"
          echo "  notarization: accepted"
          echo "  stapling: skipped for standalone executable tarball"
          if [ -n "$INSTALLER_ID" ]; then
            echo "  installer signed by: $INSTALLER_ID"
            echo "  pkg notarization: accepted"
            echo "  pkg stapling: validated"
          fi

      - name: Sign + notarize + staple Malibu.app
        shell: bash
        env:
          APPLE_DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          APPLE_DEVELOPER_ID_INSTALLER_CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_CERT_P12_BASE64 }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Malibu.app"

          if [ -z "$APPLE_DEVELOPER_ID_CERT_P12_BASE64" ]; then
            echo "::error::APPLE_DEVELOPER_ID_CERT_P12_BASE64 is required for Malibu.app." >&2
            exit 1
          fi
          test -d "$APP"

          security list-keychains | grep -q build.keychain || {
            echo "::error::build.keychain absent; CLI signing step cleanup ran too early." >&2
            exit 1
          }
          [ -n "${WORK:-}" ] && [ -x "$WORK/macprovider-cli" ] || {
            echo "::error::signed macprovider-cli not available for Malibu.app bundling" >&2
            exit 1
          }

          SIGNING_ID=$(security find-identity -v -p codesigning build.keychain \
                      | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          [ -n "$SIGNING_ID" ] || {
            echo "::error::No Developer ID Application identity in build.keychain" >&2
            exit 1
          }

          cp "$WORK/macprovider-cli" "$APP/Contents/MacOS/macprovider-cli"
          chmod 755 "$APP/Contents/MacOS/macprovider-cli"
          [ -f "$WORK/mlx.metallib" ] || {
            echo "::error::signed CLI payload lacks mlx.metallib for Malibu.app bundling" >&2
            exit 1
          }
          cp "$WORK/mlx.metallib" "$APP/Contents/MacOS/mlx.metallib"
          find "$WORK" -mindepth 1 -maxdepth 1 -name '*.bundle' \
            -exec cp -R {} "$APP/Contents/MacOS"/ \;

          codesign --force --deep \
            --options runtime \
            --timestamp \
            --entitlements phase3-binary/app/Malibu.entitlements \
            --sign "$SIGNING_ID" \
            "$APP"

          codesign --verify --strict --verbose=2 --deep "$APP"

          NOTARIZE_ZIP="$RUNNER_TEMP/Malibu-notary.zip"
          /usr/bin/ditto -c -k --keepParent "$APP" "$NOTARIZE_ZIP"

          scripts/notarytool-submit-with-retry.sh "$NOTARIZE_ZIP" \
            --apple-id "$APPLE_NOTARY_APPLE_ID" \
            --password "$APPLE_NOTARY_PASSWORD" \
            --team-id "$APPLE_NOTARY_TEAM_ID" \
            --wait
          rm -f "$NOTARIZE_ZIP"

          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl -a -vvv -t exec "$APP"

          tag="${{ needs.build.outputs.tag }}"
          mkdir -p "phase3-binary/app/dist"
          DIST_DMG="phase3-binary/app/dist/Malibu-${tag}.dmg"

          # SPEC-025 P2: primary consumer download is a stapled .dmg with an
          # Applications symlink (Application cert only; no Installer cert).
          DMG_STAGE="$RUNNER_TEMP/malibu-dmg-stage"
          mkdir -p "$DMG_STAGE"
          cp -R "$APP" "$DMG_STAGE/"
          ln -sf /Applications "$DMG_STAGE/Applications"
          hdiutil create \
            -volname "Malibu" \
            -srcfolder "$DMG_STAGE" \
            -ov \
            -format UDZO \
            "$GITHUB_WORKSPACE/$DIST_DMG"
          rm -rf "$DMG_STAGE"

          codesign --sign "$SIGNING_ID" --timestamp "$GITHUB_WORKSPACE/$DIST_DMG"
          scripts/notarytool-submit-with-retry.sh "$GITHUB_WORKSPACE/$DIST_DMG" \
            --apple-id "$APPLE_NOTARY_APPLE_ID" \
            --password "$APPLE_NOTARY_PASSWORD" \
            --team-id "$APPLE_NOTARY_TEAM_ID" \
            --wait
          xcrun stapler staple "$GITHUB_WORKSPACE/$DIST_DMG"
          xcrun stapler validate "$GITHUB_WORKSPACE/$DIST_DMG"

          # Optional .pkg for operators who prefer a double-click installer.
          if [ -z "$APPLE_DEVELOPER_ID_INSTALLER_CERT_P12_BASE64" ]; then
            echo "::warning::APPLE_DEVELOPER_ID_INSTALLER_CERT_P12_BASE64 not set;"
            echo "::warning::skipping Malibu.app.pkg (Malibu-${tag}.dmg is the primary artifact)."
          else
          INSTALLER_ID=$(security find-identity -v build.keychain \
                        | awk -F'"' '/Developer ID Installer/ {print $2; exit}')
          [ -n "$INSTALLER_ID" ] || {
            echo "::error::No Developer ID Installer identity in build.keychain" >&2
            exit 1
          }

          APP_PKG_ROOT="$RUNNER_TEMP/malibu-pkg-root"
          mkdir -p "$APP_PKG_ROOT"
          cp -R "$APP" "$APP_PKG_ROOT/Malibu.app"

          UNSIGNED_PKG="$RUNNER_TEMP/Malibu-unsigned.pkg"
          DIST_PKG="phase3-binary/app/dist/Malibu-${tag}.pkg"

          # pkgbuild wraps Malibu.app into a flat installer package.
          # --install-location "/Applications" makes double-click install
          # place Malibu.app directly in /Applications with no user
          # interaction beyond consent.
          # --identifier is the CFBundleIdentifier of the package, distinct
          # from the app bundle's tech.malibu.app.
          pkgbuild \
            --root "$APP_PKG_ROOT" \
            --install-location "/Applications" \
            --identifier tech.malibu.app.installer \
            --version "${tag#v}" \
            "$UNSIGNED_PKG"

          productsign --sign "$INSTALLER_ID" \
            "$UNSIGNED_PKG" "$GITHUB_WORKSPACE/$DIST_PKG"

          # Notarize the .pkg separately from the .app inside — Apple
          # notary treats the two as distinct submissions.
          scripts/notarytool-submit-with-retry.sh "$GITHUB_WORKSPACE/$DIST_PKG" \
            --apple-id "$APPLE_NOTARY_APPLE_ID" \
            --password "$APPLE_NOTARY_PASSWORD" \
            --team-id "$APPLE_NOTARY_TEAM_ID" \
            --wait

          xcrun stapler staple "$GITHUB_WORKSPACE/$DIST_PKG"
          xcrun stapler validate "$GITHUB_WORKSPACE/$DIST_PKG"
          spctl -a -vvv -t install "$GITHUB_WORKSPACE/$DIST_PKG"

          rm -rf "$APP_PKG_ROOT" "$UNSIGNED_PKG"
          fi

          echo "  Malibu.app signed by: $SIGNING_ID"
          echo "  Malibu.app notarization: accepted"
          echo "  Malibu.app stapling: validated"
          echo "  Malibu-${tag}.dmg notarization: accepted"
          echo "  Malibu-${tag}.dmg stapling: validated"
          echo "  Malibu-${tag}.dmg: $DIST_DMG"
          if [ -f "$GITHUB_WORKSPACE/phase3-binary/app/dist/Malibu-${tag}.pkg" ]; then
            echo "  Malibu.app.pkg signed by: $INSTALLER_ID"
            echo "  Malibu.app.pkg notarization: accepted"
            echo "  Malibu.app.pkg stapling: validated"
            echo "  Malibu.app.pkg: phase3-binary/app/dist/Malibu-${tag}.pkg"
          fi

      - name: Clean Apple signing material before third-party tools
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          security delete-keychain build.keychain >/dev/null 2>&1 || true
          rm -rf "${SIGNING_TMP:-}" "${WORK:-}" 2>/dev/null || true

      - name: Generate Sparkle appcast for Malibu.app
        shell: bash
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          tag="${{ needs.build.outputs.tag }}"
          dmg="phase3-binary/app/dist/Malibu-${tag}.dmg"
          if [ ! -f "$dmg" ]; then
            echo "::error::required Malibu dmg is absent: $dmg" >&2
            exit 1
          fi
          if [ -z "${SPARKLE_EDDSA_PRIVATE_KEY:-}" ]; then
            echo "::error::SPARKLE_EDDSA_PRIVATE_KEY is required when a Malibu dmg was built." >&2
            exit 1
          fi
          bash scripts/generate-malibu-appcast.sh "$tag"
          bash scripts/test-coordinator-advertised-version.sh \
            "$tag" \
            phase3-binary/app/dist/appcast.xml

      - name: Tier-2 provider artifact preflight
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.build.outputs.tag }}"
          case "$tag" in
            v0.*|v1.0.*|v1.1.*|v1.2.[0-5])
              echo "Skipping Tier-2 provider artifact preflight for pre-B6 tag $tag"
              exit 0
              ;;
          esac
          PROVIDER_ARTIFACT="phase3-binary/dist/phase3-binary-m4-${tag}.tar.gz" \
            PROVIDER_VERSION="${tag#v}" \
            PROVIDER_SHA256="" \
            scripts/check-tier2-provider-artifact.sh

          pkg_src="phase3-binary/dist/phase3-binary-m4-${tag}.pkg"
          if [ ! -f "$pkg_src" ]; then
            echo "No signed .pkg artifact present; tarball compatibility release preflight complete."
            exit 0
          fi

          validate_payload_entries() {
            payload_dir="$1"
            label="$2"
            entries="$(cd "$payload_dir" && find . -mindepth 1 -print)" || {
              echo "::error::failed to list $label" >&2
              exit 1
            }
            [ -n "$entries" ] || {
              echo "::error::$label is empty" >&2
              exit 1
            }
            has_binary=0
            while IFS= read -r entry; do
              normalized_entry="$entry"
              while :; do
                case "$normalized_entry" in
                  ./*) normalized_entry="${normalized_entry#./}" ;;
                  *) break ;;
                esac
              done
              case "$normalized_entry" in
                ""|.) continue ;;
              esac
              case "$normalized_entry" in
                /*|*"/../"*|../*|*/..|..)
                  echo "::error::unsafe $label path: $entry" >&2
                  exit 1
                  ;;
                macprovider-cli)
                  has_binary=1
                  ;;
                mlx.metallib)
                  ;;
                THIRD-PARTY-NOTICES.txt)
                  ;;
                *.bundle|*.bundle/*)
                  ;;
                *)
                  echo "::error::unexpected $label member: $entry" >&2
                  exit 1
                  ;;
              esac
            done <<EOF
          $entries
          EOF
            [ "$has_binary" -eq 1 ] || {
              echo "::error::$label does not contain macprovider-cli" >&2
              exit 1
            }
            if find "$payload_dir" \( -type l -o -type b -o -type c -o -type p \) -print -quit | grep -q .; then
              echo "::error::$label contains unsafe link or device members" >&2
              exit 1
            fi
          }

          spctl -a -vv -t install "$pkg_src"
          xcrun stapler validate "$pkg_src"

          preflight_dir="$(mktemp -d)"
          cleanup_preflight() {
            rm -rf "$preflight_dir"
          }
          trap cleanup_preflight EXIT

          tar_payload_dir="$preflight_dir/tar-payload"
          pkg_expand_dir="$preflight_dir/pkg-expanded"
          pkg_payload_tar="$preflight_dir/pkg-payload.tar.gz"
          mkdir -p "$tar_payload_dir"
          tar -xzf "phase3-binary/dist/phase3-binary-m4-${tag}.tar.gz" -C "$tar_payload_dir" macprovider-cli
          pkgutil --expand-full "$pkg_src" "$pkg_expand_dir"
          test -x "$pkg_expand_dir/Payload/macprovider-cli"
          validate_payload_entries "$pkg_expand_dir/Payload" "provider package payload"

          tar_binary_sha="$(shasum -a 256 "$tar_payload_dir/macprovider-cli" | awk '{print $1}')"
          pkg_binary_sha="$(shasum -a 256 "$pkg_expand_dir/Payload/macprovider-cli" | awk '{print $1}')"
          if [ "$pkg_binary_sha" != "$tar_binary_sha" ]; then
            echo "::error::package binary sha256 differs from tarball binary" >&2
            exit 1
          fi

          pkg_version="$("$pkg_expand_dir/Payload/macprovider-cli" --version)"
          if [ "$pkg_version" != "${tag#v}" ]; then
            echo "::error::provider package version mismatch: got $pkg_version want ${tag#v}" >&2
            exit 1
          fi

          tar czf "$pkg_payload_tar" -C "$pkg_expand_dir/Payload" .
          PROVIDER_ARTIFACT="$pkg_payload_tar" \
            PROVIDER_VERSION="${tag#v}" \
            PROVIDER_SHA256="" \
            scripts/check-tier2-provider-artifact.sh

      - name: Verify Malibu release cryptographic bindings
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.build.outputs.tag }}"
          dmg="phase3-binary/app/dist/Malibu-${tag}.dmg"
          appcast="phase3-binary/app/dist/appcast.xml"
          test -f "$dmg"
          test -f "$appcast"
          bash scripts/verify-malibu-release-artifacts.sh "$dmg"
          python3 scripts/verify-malibu-sparkle-signature.py \
            "$tag" "$dmg" "$appcast" phase3-binary/app/project.yml
          bash scripts/test-coordinator-advertised-version.sh "$tag" "$appcast"

      - name: Prepare release assets
        id: assets
        shell: bash
        env:
          MACPROVIDER_RELEASE_SIGNING_KEY_PEM: ${{ secrets.MACPROVIDER_RELEASE_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          tag="${{ needs.build.outputs.tag }}"
          src="phase3-binary/dist/phase3-binary-m4-${tag}.tar.gz"
          pkg_src="phase3-binary/dist/phase3-binary-m4-${tag}.pkg"
          app_src="phase3-binary/app/dist/Malibu-${tag}.pkg"
          app_dmg_src="phase3-binary/app/dist/Malibu-${tag}.dmg"
          appcast_src="phase3-binary/app/dist/appcast.xml"
          tar_asset="macprovider-cli-${tag}-darwin-arm64.tar.gz"
          pkg_asset="macprovider-cli-${tag}-darwin-arm64.pkg"
          app_asset="Malibu-${tag}.pkg"
          app_dmg_asset="Malibu-${tag}.dmg"
          appcast_asset="appcast.xml"
          coordinator_asset="coordinator-linux-amd64"
          coordinator_cli_asset="coordinator-cli-linux-amd64"
          gateway_asset="gateway-linux-amd64"
          pearl_metadata="pearl-release.json"
          pearl_metadata_sig="pearl-release.json.sig"
          test -f "$src"
          test -f "$coordinator_asset"
          test -f "$coordinator_cli_asset"
          test -f "$gateway_asset"
          if [ -z "$MACPROVIDER_RELEASE_SIGNING_KEY_PEM" ]; then
            echo "MACPROVIDER_RELEASE_SIGNING_KEY_PEM secret is required" >&2
            exit 1
          fi
          release_signing_key="$(mktemp "$RUNNER_TEMP/release-signing-private.XXXXXX.pem")"
          cleanup_release_signing_key() {
            rm -f "$release_signing_key"
          }
          trap cleanup_release_signing_key EXIT
          cp "$src" "$tar_asset"
          release_assets=("$tar_asset" "$coordinator_asset" "$coordinator_cli_asset" "$gateway_asset")
          if [ -f "$pkg_src" ]; then
            cp "$pkg_src" "$pkg_asset"
            release_assets+=("$pkg_asset")
          fi
          test -f "$app_dmg_src"
          test -f "$appcast_src"
          cp "$app_dmg_src" "$app_dmg_asset"
          release_assets+=("$app_dmg_asset")
          cp "$appcast_src" "$appcast_asset"
          release_assets+=("$appcast_asset")
          if [ -f "$app_src" ]; then
            cp "$app_src" "$app_asset"
            release_assets+=("$app_asset")
          fi
          coordinator_sha="$(shasum -a 256 "$coordinator_asset" | awk '{print $1}')"
          coordinator_cli_sha="$(shasum -a 256 "$coordinator_cli_asset" | awk '{print $1}')"
          gateway_sha="$(shasum -a 256 "$gateway_asset" | awk '{print $1}')"
          RELEASE_TAG="$tag" \
          RELEASE_COMMIT="${{ needs.build.outputs.commit }}" \
          COORDINATOR_SHA="$coordinator_sha" \
          COORDINATOR_CLI_SHA="$coordinator_cli_sha" \
          GATEWAY_SHA="$gateway_sha" \
          python3 - <<'PY'
          import json
          import os

          tag = os.environ["RELEASE_TAG"]
          metadata = {
              "schema_version": 1,
              "repository": "Augustas11/macprovider",
              "tag": tag,
              "release_version": tag.removeprefix("v"),
              "commit": os.environ["RELEASE_COMMIT"],
              "architecture": "linux-amd64",
              "provider_advertised_version": tag.removeprefix("v"),
              "components": {
                  "coordinator": {
                      "asset": "coordinator-linux-amd64",
                      "sha256": os.environ["COORDINATOR_SHA"],
                      "embedded_version": tag,
                  },
                  "gateway": {
                      "asset": "gateway-linux-amd64",
                      "sha256": os.environ["GATEWAY_SHA"],
                      "embedded_version": tag,
                  },
              },
              "operator_artifacts": {
                  "coordinator_cli": {
                      "asset": "coordinator-cli-linux-amd64",
                      "sha256": os.environ["COORDINATOR_CLI_SHA"],
                  },
              },
          }
          with open("pearl-release.json", "w", encoding="utf-8") as output:
              json.dump(metadata, output, sort_keys=True, separators=(",", ":"))
              output.write("\n")
          PY
          printf "%s\n" "$MACPROVIDER_RELEASE_SIGNING_KEY_PEM" > "$release_signing_key"
          chmod 600 "$release_signing_key"
          openssl dgst -sha256 -sign "$release_signing_key" \
            -out "$pearl_metadata_sig" "$pearl_metadata"
          openssl dgst -sha256 \
            -verify ops/pearl-updater/release-signing-public.pem \
            -signature "$pearl_metadata_sig" "$pearl_metadata"
          release_assets+=("$pearl_metadata" "$pearl_metadata_sig")
          python3 scripts/build-release-provenance.py \
            "$tag" "${{ needs.build.outputs.commit }}" "$GITHUB_REPOSITORY" \
            "${{ needs.build.outputs.prerelease }}" release-toolchain.json \
            release-provenance.json "${release_assets[@]}"
          release_assets+=(release-provenance.json)
          : > checksums.txt
          for release_asset in "${release_assets[@]}"; do
            shasum -a 256 "$release_asset" >> checksums.txt
          done
          printf "%s\n" "${release_assets[@]}" > release-assets.txt
          openssl dgst -sha256 -sign "$release_signing_key" -out checksums.txt.sig checksums.txt
          echo "asset=$tar_asset" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.build.outputs.tag }}"
          if [ -f CHANGELOG.md ]; then
            cp CHANGELOG.md release-notes.md
          else
            cat > release-notes.md <<EOF
          # macprovider-cli $tag

          Darwin arm64 build for Apple Silicon Macs.

          This release is Developer ID signed and notarized when the
          release operator secrets are populated. New releases may include
          a stapled .pkg asset in addition to the compatibility tarball.
          EOF
          fi
          if [ -f "phase3-binary/app/dist/Malibu-${tag}.dmg" ]; then
            cat >> release-notes.md <<EOF

          **Malibu.app (CLI wrapper)** — this release ships a Developer ID-signed,
          notarized, and stapled \`Malibu-${tag}.dmg\`. Open the disk image, drag
          Malibu.app to Applications, and launch. First run drives install.sh
          onboarding with no terminal setup; Malibu monitors the launchd provider.
          Publish recovery requires the numeric GitHub release and asset IDs;
          use \`scripts/recover-malibu-publication.sh\` with the reviewed commit.
          Malibu checks \`https://download.malibu.tech/appcast.xml\` for in-app updates via Sparkle.
          EOF
          elif [ -f "phase3-binary/app/dist/Malibu-${tag}.pkg" ]; then
            cat >> release-notes.md <<EOF

          **Malibu.app (App-track provider onboarding)** - this release also
          ships a Developer ID-signed, notarized, and stapled Malibu.app.pkg
          for the SPEC-026 browserless one-click provider onboarding flow.
          Download Malibu-${tag}.pkg and double-click to install Malibu.app
          to /Applications. First launch drives the whole registration ->
          autotune -> download -> live flow with no browser and no CLI setup.
          EOF
          fi

      - name: Create verified draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_POSTURE_TOKEN: ${{ secrets.RELEASE_POSTURE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.build.outputs.tag }}"
          release_commit="${{ needs.build.outputs.commit }}"
          bash scripts/verify-release-source.sh \
            "$tag" "$release_commit" origin --require-existing
          GH_TOKEN="$RELEASE_POSTURE_TOKEN" \
            bash scripts/verify-github-release-posture.sh \
              "$GITHUB_REPOSITORY" production-release 28995904
          release_assets=()
          while IFS= read -r release_asset; do
            [ -n "$release_asset" ] && release_assets+=("$release_asset")
          done < release-assets.txt
          bash scripts/verify-release-checksums.sh \
            checksums.txt checksums.txt.sig release-provenance.json \
            "$GITHUB_REPOSITORY" "$tag" "$release_commit" \
            "${release_assets[@]}"
          gh release create "$tag" \
            "${release_assets[@]}" \
            checksums.txt \
            checksums.txt.sig \
            --title "macprovider-cli $tag" \
            --notes-file release-notes.md \
            --target "$release_commit" \
            --verify-tag \
            --draft

      - name: Verify draft release assets by numeric ID
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.build.outputs.tag }}"
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > release-by-tag-api.json
          release_id="$(python3 - <<'PY'
          import json
          release = json.load(open("release-by-tag-api.json", encoding="utf-8"))
          value = release.get("id")
          if type(value) is not int or value <= 0:
              raise SystemExit("tag lookup did not return a numeric release id")
          print(value)
          PY
          )"
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" > draft-release-api.json
          python3 - "$release_id" <<'PY'
          import json
          import sys
          by_tag = json.load(open("release-by-tag-api.json", encoding="utf-8"))
          by_id = json.load(open("draft-release-api.json", encoding="utf-8"))
          def identity(release):
              return {
                  "id": release.get("id"),
                  "tag_name": release.get("tag_name"),
                  "target_commitish": release.get("target_commitish"),
                  "draft": release.get("draft"),
                  "immutable": release.get("immutable"),
                  "assets": sorted(
                      (asset.get("id"), asset.get("name"), asset.get("digest"))
                      for asset in release.get("assets", [])
                  ),
              }
          if identity(by_tag) != identity(by_id) or by_id.get("id") != int(sys.argv[1]):
              raise SystemExit("tag and numeric release lookups disagree")
          PY
          release_assets=()
          while IFS= read -r release_asset; do
            [ -n "$release_asset" ] && release_assets+=("$release_asset")
          done < release-assets.txt
          python3 scripts/capture-release-publication.py --draft \
            draft-release-api.json release-provenance.json draft-publication-manifest.json \
            "${release_assets[@]}" checksums.txt checksums.txt.sig
          printf '%s\n' "$release_id" > draft-release-id.txt

      - name: Publish only the revalidated numeric draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_POSTURE_TOKEN: ${{ secrets.RELEASE_POSTURE_TOKEN }}
          PRERELEASE_INPUT: ${{ needs.build.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.build.outputs.tag }}"
          commit="${{ needs.build.outputs.commit }}"
          release_id="$(cat draft-release-id.txt)"
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::captured draft release id is invalid" >&2
            exit 1
          }
          case "$PRERELEASE_INPUT" in
            true)
              make_latest=false
              ;;
            false)
              make_latest=true
              ;;
            *)
              echo "::error::validated prerelease state was lost" >&2
              exit 1
              ;;
          esac
          release_assets=()
          while IFS= read -r release_asset; do
            [ -n "$release_asset" ] && release_assets+=("$release_asset")
          done < release-assets.txt

          # This is the final public-transition gate: repeat every mutable
          # source, tag, repository-posture, numeric-ID, and asset assertion
          # directly before changing draft=false.
          bash scripts/verify-release-source.sh \
            "$tag" "$commit" origin --require-existing
          GH_TOKEN="$RELEASE_POSTURE_TOKEN" \
            bash scripts/verify-github-release-posture.sh \
              "$GITHUB_REPOSITORY" production-release 28995904
          bash scripts/verify-release-checksums.sh \
            checksums.txt checksums.txt.sig release-provenance.json \
            "$GITHUB_REPOSITORY" "$tag" "$commit" \
            "${release_assets[@]}"
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > final-draft-by-tag.json
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" > final-draft-by-id.json
          python3 - "$release_id" <<'PY'
          import json
          import sys
          by_tag = json.load(open("final-draft-by-tag.json", encoding="utf-8"))
          by_id = json.load(open("final-draft-by-id.json", encoding="utf-8"))
          def identity(release):
              return {
                  "id": release.get("id"),
                  "tag_name": release.get("tag_name"),
                  "target_commitish": release.get("target_commitish"),
                  "draft": release.get("draft"),
                  "immutable": release.get("immutable"),
                  "assets": sorted(
                      (asset.get("id"), asset.get("name"), asset.get("digest"))
                      for asset in release.get("assets", [])
                  ),
              }
          if identity(by_tag) != identity(by_id) or by_id.get("id") != int(sys.argv[1]):
              raise SystemExit("final tag and numeric draft lookups disagree")
          PY
          python3 scripts/capture-release-publication.py --draft \
            final-draft-by-id.json release-provenance.json final-draft-manifest.json \
            "${release_assets[@]}" checksums.txt checksums.txt.sig

          gh api --method PATCH -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false \
            -F prerelease="$PRERELEASE_INPUT" \
            -f make_latest="$make_latest" > published-release-api.json

          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" > immutable-release-by-id.json
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > immutable-release-by-tag.json
          if [ "$PRERELEASE_INPUT" = false ]; then
            gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/releases/latest" > stable-latest-release.json
          else
            gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/releases/latest" > stable-latest-release.json ||
              printf '%s\n' '{}' > stable-latest-release.json
          fi
          python3 scripts/verify-published-release.py \
            "$release_id" "$PRERELEASE_INPUT" \
            immutable-release-by-id.json immutable-release-by-tag.json \
            stable-latest-release.json
          python3 scripts/capture-release-publication.py \
            immutable-release-by-id.json release-provenance.json publication-manifest.json \
            "${release_assets[@]}" checksums.txt checksums.txt.sig

      - name: Publish Malibu latest.dmg
        if: needs.build.outputs.prerelease == 'false'
        env:
          MALIBU_DOWNLOAD_VPS_HOST: ${{ secrets.MALIBU_DOWNLOAD_VPS_HOST }}
          MALIBU_DOWNLOAD_SSH_KEY: ${{ secrets.MALIBU_DOWNLOAD_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${MALIBU_DOWNLOAD_SSH_KEY:-}" ]; then
            key_file="$(mktemp)"
            trap 'rm -f "$key_file"' EXIT
            printf '%s\n' "$MALIBU_DOWNLOAD_SSH_KEY" > "$key_file"
            chmod 600 "$key_file"
            export MALIBU_DOWNLOAD_SSH_KEY="$key_file"
          fi
          tag="${{ needs.build.outputs.tag }}"
          bash scripts/publish-malibu-latest-dmg.sh \
            publication-manifest.json "Malibu-${tag}.dmg" appcast.xml \
            checksums.txt checksums.txt.sig release-provenance.json

      - name: Verify published Tier-2 Release assets
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.build.outputs.tag }}"
          case "$tag" in
            v0.*|v1.0.*|v1.1.*|v1.2.[0-5])
              echo "Skipping Tier-2 published release verifier for pre-B6 tag $tag"
              exit 0
              ;;
          esac
          GITHUB_REPO="${{ github.repository }}" \
            DOWNLOAD_ATTEMPTS=6 \
            DOWNLOAD_RETRY_SLEEP=5 \
            scripts/verify-tier2-provider-release.sh --tag "$tag"
