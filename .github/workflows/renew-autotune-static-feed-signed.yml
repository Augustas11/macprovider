name: Renew signed autotune static feed

# Protected weekly freshness re-stamp for the SPEC-023 signed autotune feed.
# Signs on a macos-15-intel runner (Swift CryptoKit + sealed Go Tier-2
# verifier + sealed OpenSSL 3 verify), then rsyncs only signed bytes to
# Pearl and SIGHUPs the coordinator.
#
# The feed key MUST NOT live on Pearl. It is an autotune-feed-renewal secret
# (AUTOTUNE_STATIC_V4_PRIVATE_KEY_BASE64). Do not reuse the discovery-head
# PEM or the download.malibu.tech SSH key. This environment has no reviewer
# gate so the weekly restamp can run unattended.
#
# Tuesday watch (renew-autotune-static-feed.yml) and the 20-day alarm stay as
# read-only backstops. A red Tuesday run means this Wednesday job missed.

on:
  workflow_dispatch:
  schedule:
    # Wednesday 16:00 UTC: offset from Monday discovery-head and Tuesday watch.
    - cron: "0 16 * * 3"

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  renew:
    name: Re-stamp, sign, and hot-reload the autotune feed
    runs-on: macos-15-intel
    environment: autotune-feed-renewal
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout reviewed renewal controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify protected GitHub release posture
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_POSTURE_TOKEN }}
        run: POSTURE_PROFILE=unattended bash scripts/verify-github-release-posture.sh "$GITHUB_REPOSITORY" autotune-feed-renewal 28995904

      - name: Set up Go for the Tier-2 signature verifier
        # Pinned to actions/setup-go v7.0.0. Re-resolve deliberately.
        # catalog-release.py generate authenticates the previous signed
        # release against a fixed absolute Go path, not PATH.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: phase4-coordinator/go.mod
          cache: false

      - name: Seal the Tier-2 verifier toolchain
        shell: bash
        run: |
          set -euo pipefail
          source_root="$(go env GOROOT)"
          sudo test ! -e /private/var/macprovider-go-verifier
          sudo install -d -o root -g wheel -m 0755 /private/var/macprovider-go-verifier
          sudo cp -a "$source_root/." /private/var/macprovider-go-verifier/
          sudo chown -R root:wheel /private/var/macprovider-go-verifier
          sudo chmod -R go-w /private/var/macprovider-go-verifier
          sudo test -x /private/var/macprovider-go-verifier/bin/go

      - name: Seal reviewed OpenSSL 3
        id: protected_openssl
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          sealed_bin="$(
            bash scripts/install-sealed-release-openssl.sh \
              /private/var/macprovider-openssl-autotune-renewal
          )"
          "$sealed_bin" version | grep -E '^OpenSSL 3\.'
          printf 'bin=%s\n' "$sealed_bin" >> "$GITHUB_OUTPUT"

      - name: Sign a freshness restamp and deploy to Pearl
        shell: bash
        env:
          OPENSSL_BIN: ${{ steps.protected_openssl.outputs.bin }}
          AUTOTUNE_STATIC_V4_PRIVATE_KEY_BASE64: ${{ secrets.AUTOTUNE_STATIC_V4_PRIVATE_KEY_BASE64 }}
          PEARL_AUTOTUNE_DEPLOY_SSH_KEY: ${{ secrets.PEARL_AUTOTUNE_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          [ -n "$OPENSSL_BIN" ] || {
            echo "::error::sealed OPENSSL_BIN is required" >&2
            exit 1
          }
          [ -x "$OPENSSL_BIN" ] || {
            echo "::error::sealed OPENSSL_BIN is not executable" >&2
            exit 1
          }
          "$OPENSSL_BIN" version | grep -E '^OpenSSL 3\.'
          [ -n "$AUTOTUNE_STATIC_V4_PRIVATE_KEY_BASE64" ] || {
            echo "::error::AUTOTUNE_STATIC_V4_PRIVATE_KEY_BASE64 is required (autotune-feed-renewal secret)" >&2
            exit 1
          }
          [ -n "$PEARL_AUTOTUNE_DEPLOY_SSH_KEY" ] || {
            echo "::error::PEARL_AUTOTUNE_DEPLOY_SSH_KEY is required (autotune-feed-renewal secret)" >&2
            exit 1
          }
          key="$(mktemp "$RUNNER_TEMP/autotune-static.XXXXXX.b64")"
          ssh_key="$(mktemp "$RUNNER_TEMP/pearl-autotune-deploy.XXXXXX")"
          trap 'rm -f "$key" "$ssh_key"' EXIT
          umask 077
          printf '%s\n' "$AUTOTUNE_STATIC_V4_PRIVATE_KEY_BASE64" > "$key"
          printf '%s\n' "$PEARL_AUTOTUNE_DEPLOY_SSH_KEY" > "$ssh_key"
          chmod 600 "$key" "$ssh_key"
          unset AUTOTUNE_STATIC_V4_PRIVATE_KEY_BASE64 PEARL_AUTOTUNE_DEPLOY_SSH_KEY
          export AUTOTUNE_STATIC_PRIVATE_KEY_PATH="$key"
          export PEARL_SSH_IDENTITY="$ssh_key"
          export PEARL_SSH_KNOWN_HOSTS="$GITHUB_WORKSPACE/scripts/dist/malibu-download-known_hosts"
          export PEARL_SSH="root@159.223.165.194"
          export CATALOG_RELEASE_REQUIRE_SEALED_GO_VERIFIER=1
          bash scripts/renew-autotune-static-feed.sh --deploy
