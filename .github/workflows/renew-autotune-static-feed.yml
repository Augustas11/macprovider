name: Renew autotune static feed

# Manual legacy-client cadence check for the SPEC-023 signed autotune feed.
#
# This job is watch-only: no secrets, no Pearl SSH, no --deploy. It is
# intentionally manual-only now that current clients warn on old generated_at
# instead of failing closed. Use it only when auditing compatibility for older
# CLIs that still enforce the former 30-day generated_at horizon.

on:
  workflow_dispatch:
    inputs:
      max_age_days:
        description: "Legacy-client audit threshold in days (default 20; must be < 30)"
        required: false
        default: "20"
        type: string

permissions:
  contents: read

concurrency:
  group: renew-autotune-static-feed
  cancel-in-progress: false

jobs:
  check:
    name: Check live autotune-feed age for legacy clients
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout cadence check
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check live /v1/rate-card age against the manual threshold
        shell: bash
        env:
          MAX_AGE_DAYS: ${{ github.event.inputs.max_age_days || '20' }}
        run: |
          set -euo pipefail
          url="https://coordinator.malibu.tech/v1/rate-card"
          [[ "$MAX_AGE_DAYS" =~ ^[0-9]+([.][0-9]+)?$ ]] || {
            echo "::error::max_age_days must be a positive number" >&2
            exit 1
          }
          echo "Legacy-client audit: live generated_at threshold is ${MAX_AGE_DAYS}d."
          curl -fsS --proto '=https' --tlsv1.2 --max-time 20 -- "$url" \
            | python3 scripts/check-autotune-feed-freshness.py --max-age-days "$MAX_AGE_DAYS"
