          cp "$ENVELOPE" "$export_dir/$ENVELOPE"
          python3 - "$export_dir/evidence-manifest.json" "$SOURCE_SHA" "$EVIDENCE_SHA" "$REDACTED" "$BUNDLE" "$ENVELOPE" "$REQUIREMENT_IDS" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import sys

          output, source_sha, evidence_sha, redacted, bundle, envelope, requirement_ids = sys.argv[1:]
