name: Build a signed journey artifact
run-name: ${{ github.event.inputs.journey == 'native-mtp-serving' && format('native-mtp-postcut-{0}-{1}', github.event.inputs.source_sha, github.event.inputs.postcut_asset_sha256) || format('signed-journey-{0}', github.event.inputs.journey) }}

# One manual dispatch for every signed journey. The journey input is a closed
# registry: gate rejects unknown ids, and each job runs for its own ids only.
# Acceptance, SPEC-043 production-release, and SPEC-043 on-call keys stay in
# separate jobs. Evidence jobs do not call the conformance promoter.
# Closed set: buyer-enforce buyer-crash-recovery buyer-paid-path byom-discovery network-model-admission provider-prebeta trusted-pool-external-runtime trusted-pool-creator-mvp trusted-pool-layer2 payout trusted-pool-model privacy-class-beta native-mtp-release native-mtp-serving local-consumer-endpoint pool-promotion-transition oncall-readiness

on:
  workflow_dispatch:
    inputs:
      journey:
        description: "Closed journey id. The case in this workflow rejects every other value."
        required: true
        type: string
      source_sha:
        description: "Commit the evidence binds. Required by every journey except pool-promotion and on-call."
        required: false
        type: string
      redacted_evidence_path:
        description: "Redacted evidence path under journeys/evidence/. The journey registry checks the exact shape."
        required: false
        type: string
      requirement_ids:
        description: "Comma-separated requirement IDs. Privacy-class beta derives these from the payload."
        required: false
        type: string
      promotion_confirmed:
        description: "Set true to sign a promotion journey or a pool-promotion sibling."
        required: false
        default: false
        type: boolean
      evidence_confirmed:
        description: "Set true to sign an evidence-only journey."
        required: false
        default: false
        type: boolean
      postcut_asset_id:
        description: "Optional public-safe redacted ZIP asset ID in repository draft staging release"
        required: false
        type: string
      postcut_asset_sha256:
        description: "Exact SHA256 of the complete post-cut evidence ZIP"
        required: false
        type: string
      postcut_release_id:
        description: "Repository draft staging release ID owning the evidence asset"
        required: false
        type: string
      signed_candidate_path:
        description: "journeys/evidence/*.journey-result.signed.json"
        required: false
        type: string
      live_activation_target:
        description: "Production activation target, distinct from the candidate environment"
        required: false
        type: string
      schema_migration_hash:
        description: "Lowercase SHA-256 schema/migration hash bound into the sibling"
        required: false
        type: string
      approval_record_version:
        description: "Positive integer approval record version"
        required: false
        type: string
      creator_agreement_version:
        description: "Positive integer Creator Agreement version"
        required: false
        type: string
      pricing_schedule_version:
        description: "Positive integer pricing schedule version"
        required: false
        type: string
      authorization_id:
        description: "Fresh production authorization id"
        required: false
        type: string
      authorized_actor:
        description: "MacProvider production-release approver identity"
        required: false
        type: string
      credential_id:
        description: "Approver credential id"
        required: false
        type: string
      operation_id:
        description: "Idempotency key for the on-call upsert"
        required: false
        type: string
      launch_environment_id:
        description: "Launch environment id (e.g. production)"
        required: false
        type: string
      record_version:
        description: "On-call record version label"
        required: false
        type: string
      primary_operator_contact:
        description: "Primary on-call operator contact"
        required: false
        type: string
      secondary_operator_contact:
        description: "Secondary on-call operator contact"
        required: false
        type: string
      break_glass_escalation_path:
        description: "Break-glass escalation path"
        required: false
        type: string
      compromise_notification_channel:
        description: "Compromise notification channel"
        required: false
        type: string
      creator_agreement_notification_commitment_ack:
        description: "Creator-agreement notification commitment acknowledgement"
        required: false
        type: string
      creator_emergency_notification_mechanism:
        description: "Creator emergency notification mechanism"
        required: false
        type: string
      confirmation_ttl_seconds:
        description: "TTL in seconds, 0 < ttl <= 7776000 (90 days)"
        required: false
        default: "7776000"
        type: string
      signing_confirmed:
        description: "Confirm an on-call readiness record should be signed"
        required: false
        default: false
        type: boolean
permissions:
  contents: read

concurrency:
  group: signed-journey-${{ github.event.inputs.journey }}-${{ github.event.inputs.source_sha }}-${{ github.event.inputs.authorization_id }}-${{ github.event.inputs.operation_id }}
  cancel-in-progress: false

jobs:
  gate:
    name: Reject an unknown journey
    runs-on: ubuntu-latest
    steps:
      - name: Accept only a closed journey id
        shell: bash
        env:
          JOURNEY: ${{ github.event.inputs.journey }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] || { echo "::error::manual dispatch required" >&2; exit 1; }
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "::error::workflow must run from main" >&2; exit 1; }
          case "$JOURNEY" in
            buyer-enforce|buyer-crash-recovery|buyer-paid-path|byom-discovery|network-model-admission|provider-prebeta|trusted-pool-external-runtime|trusted-pool-creator-mvp|trusted-pool-layer2|payout|trusted-pool-model|privacy-class-beta|native-mtp-release|native-mtp-serving|local-consumer-endpoint|pool-promotion-transition|oncall-readiness) ;;
            *) echo "::error::unknown journey" >&2; exit 1 ;;
          esac

  acceptance_promote:
    if: contains(fromJSON('["buyer-enforce", "buyer-crash-recovery", "buyer-paid-path", "byom-discovery", "network-model-admission", "provider-prebeta", "trusted-pool-external-runtime"]'), github.event.inputs.journey)
    name: Build, sign, and promote an acceptance journey
    needs: [gate]
    runs-on: ubuntu-latest
    environment: production-release
    steps:
      - name: Checkout reviewed main controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact main source
        id: request
        shell: bash
        env:
          JOURNEY: ${{ github.event.inputs.journey }}
          EXPECTED_MODE: promote
          SOURCE_SHA_INPUT: ${{ github.event.inputs.source_sha }}
          REDACTED_EVIDENCE_INPUT: ${{ github.event.inputs.redacted_evidence_path }}
          REQUIREMENT_IDS_INPUT: ${{ github.event.inputs.requirement_ids }}
          PROMOTION_CONFIRMED_INPUT: ${{ github.event.inputs.promotion_confirmed || 'false' }}
          EVIDENCE_CONFIRMED_INPUT: ${{ github.event.inputs.evidence_confirmed || 'false' }}
        run: bash scripts/signed-journeys/common/validate.sh

      - name: Build unsigned journey-result payload
        shell: bash
        env:
          JOURNEY: ${{ github.event.inputs.journey }}
          EXPECTED_MODE: promote
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          EVIDENCE_SHA: ${{ steps.request.outputs.evidence_sha }}
          REDACTED: ${{ steps.request.outputs.redacted }}
          REQUIREMENT_IDS: ${{ steps.request.outputs.requirement_ids }}
          REQUIREMENT_SLUG: ${{ steps.request.outputs.requirement_slug }}
          PAYLOAD: ${{ steps.request.outputs.payload }}
          ENVELOPE: ${{ steps.request.outputs.envelope }}
        run: bash scripts/signed-journeys/common/build.sh

      - name: Preflight selector freshness before signing
        shell: bash
        env:
          JOURNEY: ${{ github.event.inputs.journey }}
          EXPECTED_MODE: promote
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          EVIDENCE_SHA: ${{ steps.request.outputs.evidence_sha }}
          REDACTED: ${{ steps.request.outputs.redacted }}
          REQUIREMENT_IDS: ${{ steps.request.outputs.requirement_ids }}
          REQUIREMENT_SLUG: ${{ steps.request.outputs.requirement_slug }}
          PAYLOAD: ${{ steps.request.outputs.payload }}
          ENVELOPE: ${{ steps.request.outputs.envelope }}
        run: bash scripts/signed-journeys/common/preflight.sh

      - name: Verify protected environment and repository posture
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_POSTURE_TOKEN }}
        run: bash scripts/verify-github-release-posture.sh "$GITHUB_REPOSITORY" production-release 28995904

      - name: Sign journey-result payload
        shell: bash
        env:
          MACPROVIDER_ACCEPTANCE_SIGNING_KEY_PEM: ${{ secrets.MACPROVIDER_ACCEPTANCE_SIGNING_KEY_PEM }}
          PAYLOAD: ${{ steps.request.outputs.payload }}
          ENVELOPE: ${{ steps.request.outputs.envelope }}
        run: bash scripts/signed-journeys/common/sign.sh

      - name: Promote only after signed validation
        shell: bash
        env:
          ENVELOPE: ${{ steps.request.outputs.envelope }}
          REQUIREMENT_IDS: ${{ steps.request.outputs.requirement_ids }}
        run: bash scripts/signed-journeys/promote/promote.sh

      - name: Verify promoted ledger and committed artifact set
        shell: bash
        env:
          REDACTED: ${{ steps.request.outputs.redacted }}
          ENVELOPE: ${{ steps.request.outputs.envelope }}
          REQUIREMENT_IDS: ${{ steps.request.outputs.requirement_ids }}
        run: bash scripts/signed-journeys/promote/verify.sh

      - name: Export signed promotion artifact
        shell: bash
        env:
          JOURNEY: ${{ github.event.inputs.journey }}
          EXPECTED_MODE: promote
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          EVIDENCE_SHA: ${{ steps.request.outputs.evidence_sha }}
          REDACTED: ${{ steps.request.outputs.redacted }}
          ENVELOPE: ${{ steps.request.outputs.envelope }}
          REQUIREMENT_IDS: ${{ steps.request.outputs.requirement_ids }}
          REQUIREMENT_SLUG: ${{ steps.request.outputs.requirement_slug }}
        run: bash scripts/signed-journeys/promote/export.sh

      - name: Upload signed journey artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.request.outputs.artifact_name }}
          path: ${{ runner.temp }}/${{ steps.request.outputs.export_dir }}
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1

  acceptance_evidence:
    if: contains(fromJSON('["trusted-pool-creator-mvp", "trusted-pool-layer2"]'), github.event.inputs.journey)
    name: Build and sign evidence without conformance promotion
    needs: [gate]
    runs-on: ubuntu-latest
    environment: production-release
    steps:
      - name: Checkout reviewed main controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact main source
        id: request
        shell: bash
        env:
          JOURNEY: ${{ github.event.inputs.journey }}
          EXPECTED_MODE: evidence
          SOURCE_SHA_INPUT: ${{ github.event.inputs.source_sha }}
          REDACTED_EVIDENCE_INPUT: ${{ github.event.inputs.redacted_evidence_path }}
          REQUIREMENT_IDS_INPUT: ${{ github.event.inputs.requirement_ids }}
          PROMOTION_CONFIRMED_INPUT: ${{ github.event.inputs.promotion_confirmed || 'false' }}
          EVIDENCE_CONFIRMED_INPUT: ${{ github.event.inputs.evidence_confirmed || 'false' }}
        run: bash scripts/signed-journeys/common/validate.sh

      - name: Build unsigned journey-result payload
        shell: bash
        env:
          JOURNEY: ${{ github.event.inputs.journey }}
          EXPECTED_MODE: evidence
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          EVIDENCE_SHA: ${{ steps.request.outputs.evidence_sha }}
          REDACTED: ${{ steps.request.outputs.redacted }}
          REQUIREMENT_IDS: ${{ steps.request.outputs.requirement_ids }}
          REQUIREMENT_SLUG: ${{ steps.request.outputs.requirement_slug }}
          PAYLOAD: ${{ steps.request.outputs.payload }}
          ENVELOPE: ${{ steps.request.outputs.envelope }}
        run: bash scripts/signed-journeys/common/build.sh

      - name: Preflight selector freshness before signing
        shell: bash
        env:
          JOURNEY: ${{ github.event.inputs.journey }}
          EXPECTED_MODE: evidence
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          EVIDENCE_SHA: ${{ steps.request.outputs.evidence_sha }}
          REDACTED: ${{ steps.request.outputs.redacted }}
          REQUIREMENT_IDS: ${{ steps.request.outputs.requirement_ids }}
          REQUIREMENT_SLUG: ${{ steps.request.outputs.requirement_slug }}
          PAYLOAD: ${{ steps.request.outputs.payload }}
          ENVELOPE: ${{ steps.request.outputs.envelope }}
        run: bash scripts/signed-journeys/common/preflight.sh

      - name: Verify protected environment and repository posture
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_POSTURE_TOKEN }}
        run: bash scripts/verify-github-release-posture.sh "$GITHUB_REPOSITORY" production-release 28995904

      - name: Sign journey-result payload
        shell: bash
        env:
          MACPROVIDER_ACCEPTANCE_SIGNING_KEY_PEM: ${{ secrets.MACPROVIDER_ACCEPTANCE_SIGNING_KEY_PEM }}
          PAYLOAD: ${{ steps.request.outputs.payload }}
          ENVELOPE: ${{ steps.request.outputs.envelope }}
        run: bash scripts/signed-journeys/common/sign.sh

      - name: Validate signed evidence without conformance promotion
        shell: bash
        env:
          ENVELOPE: ${{ steps.request.outputs.envelope }}
          REQUIREMENT_IDS: ${{ steps.request.outputs.requirement_ids }}
        run: bash scripts/signed-journeys/evidence/validate-signed.sh

      - name: Verify signed evidence artifact set
        shell: bash
        env:
          REDACTED: ${{ steps.request.outputs.redacted }}
          ENVELOPE: ${{ steps.request.outputs.envelope }}
        run: bash scripts/signed-journeys/evidence/verify.sh

      - name: Export signed evidence artifact
        shell: bash
        env:
          JOURNEY: ${{ github.event.inputs.journey }}
          EXPECTED_MODE: evidence
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          EVIDENCE_SHA: ${{ steps.request.outputs.evidence_sha }}
          REDACTED: ${{ steps.request.outputs.redacted }}
          ENVELOPE: ${{ steps.request.outputs.envelope }}
          REQUIREMENT_IDS: ${{ steps.request.outputs.requirement_ids }}
          REQUIREMENT_SLUG: ${{ steps.request.outputs.requirement_slug }}
        run: bash scripts/signed-journeys/evidence/export.sh

      - name: Upload signed journey artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.request.outputs.artifact_name }}
          path: ${{ runner.temp }}/${{ steps.request.outputs.export_dir }}
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1

  payout:
    if: github.event.inputs.journey == 'payout'
    needs: [gate]
    name: Capture, sign, validate, and export SPEC-016-R002 promotion
    runs-on: ubuntu-latest
    environment: production-release
    steps:
      - name: Checkout reviewed main controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact main source
        id: request
        shell: bash
        env:
          SOURCE_SHA_INPUT: ${{ github.event.inputs.source_sha }}
          PROMOTION_CONFIRMED_INPUT: ${{ github.event.inputs.promotion_confirmed || 'false' }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] || { echo "::error::manual dispatch required" >&2; exit 1; }
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "::error::workflow must run from main" >&2; exit 1; }
          [[ "$SOURCE_SHA_INPUT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::invalid source SHA" >&2; exit 1; }
          [[ "$SOURCE_SHA_INPUT" == "$GITHUB_SHA" ]] || { echo "::error::source SHA must equal the reviewed workflow commit" >&2; exit 1; }
          [[ "$PROMOTION_CONFIRMED_INPUT" == true ]] || { echo "::error::promotion confirmation is required" >&2; exit 1; }
          git fetch --quiet origin refs/heads/main:refs/remotes/origin/main
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          [[ "$main_sha" == "$SOURCE_SHA_INPUT" ]] || { echo "::error::source SHA is no longer origin/main" >&2; exit 1; }
          short_sha="${SOURCE_SHA_INPUT:0:12}"
          printf 'source_sha=%s\n' "$SOURCE_SHA_INPUT" >> "$GITHUB_OUTPUT"
          printf 'short_sha=%s\n' "$short_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: phase4-coordinator/go.mod
          cache-dependency-path: phase4-coordinator/go.sum

      - name: Capture payout journey payload
        shell: bash
        run: |
          set -euo pipefail
          (
            cd phase4-coordinator
            MACPROVIDER_CAPTURE_PAYOUT_JOURNEY=1 \
              go test ./internal/payout -run TestPayoutAddressRegistrationJourneyEvidence -count=1 -v
          )

      - name: Bind generated artifact paths
        id: generated
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$GITHUB_OUTPUT" <<'PY'
          import pathlib
          import sys

          root = pathlib.Path("journeys/evidence")
          payloads = sorted(root.glob("spec016-r002-payout-address-*.journey-result.unsigned.json"))
          if len(payloads) != 1:
              raise SystemExit(f"expected exactly one unsigned payload, found {len(payloads)}")
          payload = payloads[0]
          prefix = payload.name.removesuffix(".journey-result.unsigned.json")
          redacted = root / f"{prefix}.redacted.json"
          candidate = root / f"{prefix}.candidate.json"
          envelope = root / f"{prefix}.journey-result.signed.json"
          for path in (redacted, candidate):
              if not path.is_file():
                  raise SystemExit(f"missing generated artifact: {path}")
          with open(sys.argv[1], "a", encoding="ascii") as output:
              output.write(f"payload={payload.as_posix()}\n")
              output.write(f"redacted={redacted.as_posix()}\n")
              output.write(f"candidate={candidate.as_posix()}\n")
              output.write(f"envelope={envelope.as_posix()}\n")
              output.write(f"prefix={prefix}\n")
          PY

      - name: Verify protected environment and repository posture
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_POSTURE_TOKEN }}
        run: bash scripts/verify-github-release-posture.sh "$GITHUB_REPOSITORY" production-release 28995904

      - name: Sign journey-result payload
        shell: bash
        env:
          MACPROVIDER_ACCEPTANCE_SIGNING_KEY_PEM: ${{ secrets.MACPROVIDER_ACCEPTANCE_SIGNING_KEY_PEM }}
          PAYLOAD: ${{ steps.generated.outputs.payload }}
          ENVELOPE: ${{ steps.generated.outputs.envelope }}
        run: |
          set -euo pipefail
          python3 scripts/sign-journey-result.py \
            --input "$PAYLOAD" \
            --output "$ENVELOPE" \
            --verifier ".github/workflows/signed-journey.yml:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"

      - name: Promote only after signed validation
        shell: bash
        env:
          ENVELOPE: ${{ steps.generated.outputs.envelope }}
        run: |
          set -euo pipefail
          python3 scripts/promote-signed-journey-result.py \
            --base-ref origin/main \
            SPEC-016-R002 \
            "$ENVELOPE"

      - name: Drop non-promotable intermediates
        shell: bash
        env:
          PAYLOAD: ${{ steps.generated.outputs.payload }}
          CANDIDATE: ${{ steps.generated.outputs.candidate }}
        run: |
          set -euo pipefail
          python3 - "$PAYLOAD" "$CANDIDATE" <<'PY'
          import pathlib
          import sys

          for value in sys.argv[1:]:
              path = pathlib.Path(value)
              if path.suffix != ".json" or "journeys/evidence/" not in path.as_posix():
                  raise SystemExit(f"refusing to remove unexpected path: {path}")
              path.unlink()
          PY

      - name: Verify promoted ledger and committed artifact set
        shell: bash
        env:
          REDACTED: ${{ steps.generated.outputs.redacted }}
          ENVELOPE: ${{ steps.generated.outputs.envelope }}
        run: |
          set -euo pipefail
          python3 -m json.tool "$REDACTED" >/dev/null
          python3 -m json.tool "$ENVELOPE" >/dev/null
          python3 -m json.tool specs/CONFORMANCE.json >/dev/null
          python3 scripts/check_spec_governance.py --base-ref origin/main
          git diff --check
          python3 - "$ENVELOPE" <<'PY'
          import json
          import pathlib
          import sys

          envelope = pathlib.Path(sys.argv[1]).as_posix()
          conformance = json.loads(pathlib.Path("specs/CONFORMANCE.json").read_text(encoding="utf-8"))
          matches = [
              item for item in conformance.get("requirements", [])
              if isinstance(item, dict) and item.get("requirement_id") == "SPEC-016-R002"
          ]
          if len(matches) != 1:
              raise SystemExit("SPEC-016-R002 must exist exactly once")
          requirement = matches[0]
          if requirement.get("state") != "conformant" or requirement.get("gap") is not None:
              raise SystemExit("SPEC-016-R002 was not promoted to conformant")
          evidence = requirement.get("evidence")
          if not isinstance(evidence, list) or not any(item.get("source") == envelope for item in evidence if isinstance(item, dict)):
              raise SystemExit("SPEC-016-R002 evidence does not reference the signed envelope")
          for path in pathlib.Path("journeys/evidence").glob("spec016-r002-payout-address-*"):
              name = path.name
              if name.endswith(".candidate.json") or name.endswith(".journey-result.unsigned.json"):
                  raise SystemExit(f"non-promotable intermediate remains: {path}")
          PY

      - name: Export signed promotion artifact
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          REDACTED: ${{ steps.generated.outputs.redacted }}
          ENVELOPE: ${{ steps.generated.outputs.envelope }}
        run: |
          set -euo pipefail
          export_dir="$RUNNER_TEMP/signed-payout-journey-promotion"
          mkdir -p "$export_dir/journeys/evidence" "$export_dir/specs"
          cp "$REDACTED" "$export_dir/$REDACTED"
          cp "$ENVELOPE" "$export_dir/$ENVELOPE"
          cp specs/CONFORMANCE.json "$export_dir/specs/CONFORMANCE.json"
          python3 - "$export_dir/promotion-manifest.json" "$SOURCE_SHA" "$REDACTED" "$ENVELOPE" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          output, source_sha, redacted, envelope = sys.argv[1:]
          root = pathlib.Path(".")
          manifest = {
              "schema_version": "macprovider.signed-payout-journey-promotion.v1",
              "source_sha": source_sha,
              "requirement_id": "SPEC-016-R002",
              "journey_id": "JOURNEY-SPEC-016-PAYOUT-ADDRESS-REGISTRATION",
              "redacted_artifact": redacted,
              "redacted_sha256": hashlib.sha256((root / redacted).read_bytes()).hexdigest(),
              "signed_envelope": envelope,
              "signed_envelope_sha256": hashlib.sha256((root / envelope).read_bytes()).hexdigest(),
              "conformance_sha256": hashlib.sha256((root / "specs/CONFORMANCE.json").read_bytes()).hexdigest(),
              "workflow_run_id": __import__("os").environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": __import__("os").environ["GITHUB_RUN_ATTEMPT"],
          }
          pathlib.Path(output).write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload signed promotion artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: signed-payout-journey-promotion-${{ steps.request.outputs.source_sha }}
          path: ${{ runner.temp }}/signed-payout-journey-promotion/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1
  trusted_pool_model:
    if: github.event.inputs.journey == 'trusted-pool-model'
    needs: [gate]
    name: Build, sign, validate, and export trusted-pool-model promotion
    runs-on: ubuntu-latest
    environment: production-release
    steps:
      - name: Checkout reviewed main controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: phase4-coordinator/go.mod
          cache: false

      - name: Validate exact main source
        id: request
        shell: bash
        env:
          SOURCE_SHA_INPUT: ${{ github.event.inputs.source_sha }}
          REDACTED_EVIDENCE_INPUT: ${{ github.event.inputs.redacted_evidence_path }}
          REQUIREMENT_IDS_INPUT: ${{ github.event.inputs.requirement_ids }}
          PROMOTION_CONFIRMED_INPUT: ${{ github.event.inputs.promotion_confirmed || 'false' }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] || { echo "::error::manual dispatch required" >&2; exit 1; }
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "::error::workflow must run from main" >&2; exit 1; }
          [[ "$SOURCE_SHA_INPUT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::invalid source SHA" >&2; exit 1; }
          [[ "$PROMOTION_CONFIRMED_INPUT" == true ]] || { echo "::error::promotion confirmation is required" >&2; exit 1; }
          [[ "$REDACTED_EVIDENCE_INPUT" =~ ^journeys/evidence/trusted-pool-model-[A-Za-z0-9_.:-]+\.redacted\.json$ ]] || { echo "::error::invalid redacted evidence path" >&2; exit 1; }
          [[ -f "$REDACTED_EVIDENCE_INPUT" && ! -L "$REDACTED_EVIDENCE_INPUT" ]] || { echo "::error::redacted evidence is absent or unsafe" >&2; exit 1; }
          [[ "$REQUIREMENT_IDS_INPUT" =~ ^SPEC-[0-9]{3}-R[0-9]{3}(,SPEC-[0-9]{3}-R[0-9]{3})*$ ]] || { echo "::error::invalid requirement IDs" >&2; exit 1; }
          git fetch --quiet origin refs/heads/main:refs/remotes/origin/main
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          [[ "$main_sha" == "$GITHUB_SHA" ]] || { echo "::error::workflow commit is no longer origin/main" >&2; exit 1; }
          git cat-file -e "${SOURCE_SHA_INPUT}^{commit}" || { echo "::error::source SHA is not reachable" >&2; exit 1; }
          git merge-base --is-ancestor "$SOURCE_SHA_INPUT" "$GITHUB_SHA" || { echo "::error::source SHA must be an ancestor of the reviewed evidence commit" >&2; exit 1; }
          requirement_slug="$(printf '%s' "$REQUIREMENT_IDS_INPUT" | tr '[:upper:]' '[:lower:]' | tr ',' '-')"
          [[ "$requirement_slug" =~ ^spec-[0-9]{3}-r[0-9]{3}(-spec-[0-9]{3}-r[0-9]{3})*$ ]] || { echo "::error::invalid requirement slug" >&2; exit 1; }
          envelope="${REDACTED_EVIDENCE_INPUT%.redacted.json}.${requirement_slug}.journey-result.signed.json"
          payload="$RUNNER_TEMP/trusted-pool-model-journey-result-${requirement_slug}.unsigned.json"
          short_sha="${SOURCE_SHA_INPUT:0:12}"
          printf 'source_sha=%s\n' "$SOURCE_SHA_INPUT" >> "$GITHUB_OUTPUT"
          printf 'evidence_sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          printf 'short_sha=%s\n' "$short_sha" >> "$GITHUB_OUTPUT"
          printf 'redacted=%s\n' "$REDACTED_EVIDENCE_INPUT" >> "$GITHUB_OUTPUT"
          printf 'requirement_ids=%s\n' "$REQUIREMENT_IDS_INPUT" >> "$GITHUB_OUTPUT"
          printf 'requirement_slug=%s\n' "$requirement_slug" >> "$GITHUB_OUTPUT"
          printf 'payload=%s\n' "$payload" >> "$GITHUB_OUTPUT"
          printf 'envelope=%s\n' "$envelope" >> "$GITHUB_OUTPUT"

      # The verifier is the reviewed main commit's coordinator-cli: the
      # deployed source_sha predates verify-manifest, and this checkout is the
      # code the signature attests to.
      - name: Build reviewed coordinator-cli verifier
        shell: bash
        run: |
          set -euo pipefail
          (cd phase4-coordinator && go build -trimpath -o "$RUNNER_TEMP/coordinator-cli" ./cmd/coordinator-cli)

      - name: Build unsigned trusted-pool-model journey-result payload
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          EVIDENCE_SHA: ${{ steps.request.outputs.evidence_sha }}
          REDACTED: ${{ steps.request.outputs.redacted }}
          REQUIREMENT_IDS: ${{ steps.request.outputs.requirement_ids }}
          PAYLOAD: ${{ steps.request.outputs.payload }}
        run: |
          set -euo pipefail
          python3 scripts/build-trusted-pool-model-journey-result.py payload \
            --source-sha "$SOURCE_SHA" \
            --evidence-sha "$EVIDENCE_SHA" \
            --requirement-ids "$REQUIREMENT_IDS" \
            --coordinator-cli "$RUNNER_TEMP/coordinator-cli" \
            --output "$PAYLOAD" \
            "$REDACTED"

      - name: Preflight selector freshness before signing
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          REQUIREMENT_IDS: ${{ steps.request.outputs.requirement_ids }}
        run: |
          set -euo pipefail
          python3 scripts/preflight-signed-journey-promotion.py \
            --source-sha "$SOURCE_SHA" \
            --requirement-ids "$REQUIREMENT_IDS" \
            --journey-id JOURNEY-TRUSTED-POOL-MODEL

      - name: Verify protected environment and repository posture
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_POSTURE_TOKEN }}
        run: bash scripts/verify-github-release-posture.sh "$GITHUB_REPOSITORY" production-release 28995904

      - name: Sign journey-result payload
        shell: bash
        env:
          MACPROVIDER_ACCEPTANCE_SIGNING_KEY_PEM: ${{ secrets.MACPROVIDER_ACCEPTANCE_SIGNING_KEY_PEM }}
          PAYLOAD: ${{ steps.request.outputs.payload }}
          ENVELOPE: ${{ steps.request.outputs.envelope }}
        run: |
          set -euo pipefail
          python3 scripts/sign-journey-result.py \
            --input "$PAYLOAD" \
            --output "$ENVELOPE" \
            --verifier ".github/workflows/signed-journey.yml:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"

      - name: Promote only after signed validation
        shell: bash
        env:
          ENVELOPE: ${{ steps.request.outputs.envelope }}
          REQUIREMENT_IDS: ${{ steps.request.outputs.requirement_ids }}
        run: |
          set -euo pipefail
          python3 - "$REQUIREMENT_IDS" "$ENVELOPE" <<'PY'
          import subprocess
          import sys

          requirement_ids = [item for item in sys.argv[1].split(",") if item]
          envelope = sys.argv[2]
          for requirement_id in requirement_ids:
              subprocess.run(
                  [
                      "python3",
                      "scripts/promote-signed-journey-result.py",
                      "--base-ref",
                      "origin/main",
                      requirement_id,
                      envelope,
                  ],
                  check=True,
              )
          PY

      - name: Verify promoted ledger and committed artifact set
        shell: bash
        env:
          REDACTED: ${{ steps.request.outputs.redacted }}
          ENVELOPE: ${{ steps.request.outputs.envelope }}
          REQUIREMENT_IDS: ${{ steps.request.outputs.requirement_ids }}
        run: |
          set -euo pipefail
          python3 -m json.tool "$REDACTED" >/dev/null
          python3 -m json.tool "$ENVELOPE" >/dev/null
          python3 -m json.tool specs/CONFORMANCE.json >/dev/null
          python3 scripts/check_spec_governance.py --base-ref origin/main
          git diff --check
          python3 - "$ENVELOPE" "$REQUIREMENT_IDS" <<'PY'
          import json
          import pathlib
          import sys

          envelope = pathlib.Path(sys.argv[1]).as_posix()
          requirement_ids = [item for item in sys.argv[2].split(",") if item]
          conformance = json.loads(pathlib.Path("specs/CONFORMANCE.json").read_text(encoding="utf-8"))
          rows = {
              item.get("requirement_id"): item
              for item in conformance.get("requirements", [])
              if isinstance(item, dict)
          }
          for requirement_id in requirement_ids:
              requirement = rows.get(requirement_id)
              if requirement is None:
                  raise SystemExit(f"{requirement_id} missing from conformance ledger")
              if requirement.get("state") != "conformant" or requirement.get("gap") is not None:
                  raise SystemExit(f"{requirement_id} was not promoted to conformant")
              evidence = requirement.get("evidence")
              if not isinstance(evidence, list) or not any(item.get("source") == envelope for item in evidence if isinstance(item, dict)):
                  raise SystemExit(f"{requirement_id} evidence does not reference the signed envelope")
          prefix = pathlib.Path(envelope).name.removesuffix(".journey-result.signed.json")
          for path in pathlib.Path("journeys/evidence").glob(f"{prefix}*"):
              name = path.name
              if name.endswith(".candidate.json") or name.endswith(".journey-result.unsigned.json"):
                  raise SystemExit(f"non-promotable intermediate remains: {path}")
          PY

      - name: Export signed promotion artifact
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          EVIDENCE_SHA: ${{ steps.request.outputs.evidence_sha }}
          REDACTED: ${{ steps.request.outputs.redacted }}
          ENVELOPE: ${{ steps.request.outputs.envelope }}
          REQUIREMENT_IDS: ${{ steps.request.outputs.requirement_ids }}
          REQUIREMENT_SLUG: ${{ steps.request.outputs.requirement_slug }}
        run: |
          set -euo pipefail
          export_dir="$RUNNER_TEMP/signed-trusted-pool-model-journey-promotion"
          mkdir -p "$export_dir/journeys/evidence" "$export_dir/specs"
          cp "$REDACTED" "$export_dir/$REDACTED"
          cp -R "${REDACTED%.redacted.json}.manifests" "$export_dir/journeys/evidence/"
          cp "$ENVELOPE" "$export_dir/$ENVELOPE"
          cp specs/CONFORMANCE.json "$export_dir/specs/CONFORMANCE.json"
          python3 - "$export_dir/promotion-manifest.json" "$SOURCE_SHA" "$EVIDENCE_SHA" "$REDACTED" "$ENVELOPE" "$REQUIREMENT_IDS" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import sys

          output, source_sha, evidence_sha, redacted, envelope, requirement_ids = sys.argv[1:]
          root = pathlib.Path(".")
          manifest = {
              "schema_version": "macprovider.signed-trusted-pool-model-journey-promotion.v1",
              "source_sha": source_sha,
              "evidence_sha": evidence_sha,
              "requirement_ids": [item for item in requirement_ids.split(",") if item],
              "requirement_slug": os.environ["REQUIREMENT_SLUG"],
              "journey_id": "JOURNEY-TRUSTED-POOL-MODEL",
              "redacted_artifact": redacted,
              "redacted_sha256": hashlib.sha256((root / redacted).read_bytes()).hexdigest(),
              "signed_envelope": envelope,
              "signed_envelope_sha256": hashlib.sha256((root / envelope).read_bytes()).hexdigest(),
              "conformance_sha256": hashlib.sha256((root / "specs/CONFORMANCE.json").read_bytes()).hexdigest(),
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }
          pathlib.Path(output).write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload signed promotion artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: signed-trusted-pool-model-journey-promotion-${{ steps.request.outputs.source_sha }}-${{ steps.request.outputs.requirement_slug }}
          path: ${{ runner.temp }}/signed-trusted-pool-model-journey-promotion/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1
  privacy_evidence:
