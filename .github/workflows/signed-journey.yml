              "redaction_manifest_sha256": hashlib.sha256((root / bundle / "MANIFEST.sha256").read_bytes()).hexdigest(),
              "signed_envelope": envelope,
              "signed_envelope_sha256": hashlib.sha256((root / envelope).read_bytes()).hexdigest(),
