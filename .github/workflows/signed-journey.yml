          printf 'envelope=%s\n' "$envelope" >> "$GITHUB_OUTPUT"
          printf 'short_sha=%s\n' "${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Build unsigned PoolPromotionTransitionV1 payload
        shell: bash
        env:
          CANDIDATE: ${{ steps.request.outputs.candidate }}
          PAYLOAD: ${{ steps.request.outputs.payload }}
          LIVE_TARGET: ${{ github.event.inputs.live_activation_target }}
          SCHEMA_HASH: ${{ github.event.inputs.schema_migration_hash }}
          APPROVAL_VERSION: ${{ github.event.inputs.approval_record_version }}
          AGREEMENT_VERSION: ${{ github.event.inputs.creator_agreement_version }}
          PRICING_VERSION: ${{ github.event.inputs.pricing_schedule_version }}
          AUTHORIZATION_ID: ${{ github.event.inputs.authorization_id }}
          AUTHORIZED_ACTOR: ${{ github.event.inputs.authorized_actor }}
