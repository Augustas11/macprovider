          [[ "$EVIDENCE_CONFIRMED_INPUT" == true ]] || { echo "::error::evidence confirmation is required" >&2; exit 1; }
          [[ "$REDACTED_EVIDENCE_INPUT" =~ ^journeys/evidence/privacy-class-beta-[0-9]{8}T[0-9]{6}Z\.redacted\.json$ ]] || { echo "::error::invalid redacted evidence path" >&2; exit 1; }
