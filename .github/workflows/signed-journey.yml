          REDACTED: ${{ steps.request.outputs.redacted }}
          BUNDLE: ${{ steps.request.outputs.bundle }}
          ENVELOPE: ${{ steps.request.outputs.envelope }}
          REQUIREMENT_IDS: ${{ steps.payload.outputs.requirement_ids }}
