  local_consumer_transport:
    if: github.event.inputs.journey == 'local-consumer-endpoint'
    needs: [gate]
    name: Re-run and bind the trusted transport matrix
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Checkout reviewed main controls for transport verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate transport verification request
        id: matrix_request
        shell: bash
        env:
          SOURCE_SHA_INPUT: ${{ github.event.inputs.source_sha }}
          REDACTED_EVIDENCE_INPUT: ${{ github.event.inputs.redacted_evidence_path }}
          REQUIREMENT_IDS_INPUT: ${{ github.event.inputs.requirement_ids }}
          PROMOTION_CONFIRMED_INPUT: ${{ github.event.inputs.promotion_confirmed || 'false' }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] || { echo "::error::manual dispatch required" >&2; exit 1; }
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "::error::workflow must run from main" >&2; exit 1; }
          [[ "$SOURCE_SHA_INPUT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::invalid source SHA" >&2; exit 1; }
          [[ "$PROMOTION_CONFIRMED_INPUT" == true ]] || { echo "::error::promotion confirmation is required" >&2; exit 1; }
          [[ "$REDACTED_EVIDENCE_INPUT" =~ ^journeys/evidence/local-consumer-endpoint-[A-Za-z0-9_.:-]+\.redacted\.json$ ]] || { echo "::error::invalid redacted evidence path" >&2; exit 1; }
          [[ -f "$REDACTED_EVIDENCE_INPUT" && ! -L "$REDACTED_EVIDENCE_INPUT" ]] || { echo "::error::redacted evidence is absent or unsafe" >&2; exit 1; }
          [[ "$REQUIREMENT_IDS_INPUT" =~ ^SPEC-045-R00[1-8](,SPEC-045-R00[1-8])*$ ]] || { echo "::error::invalid SPEC-045 requirement IDs" >&2; exit 1; }
          git fetch --quiet origin refs/heads/main:refs/remotes/origin/main
          [[ "$(git rev-parse refs/remotes/origin/main)" == "$GITHUB_SHA" ]] || { echo "::error::workflow commit is no longer origin/main" >&2; exit 1; }
          git cat-file -e "${SOURCE_SHA_INPUT}^{commit}" || { echo "::error::source SHA is not reachable" >&2; exit 1; }
          git merge-base --is-ancestor "$SOURCE_SHA_INPUT" "$GITHUB_SHA" || { echo "::error::source SHA must be an ancestor of the reviewed evidence commit" >&2; exit 1; }
          matrix_required=false
          case ",${REQUIREMENT_IDS_INPUT}," in
            *,SPEC-045-R003,*|*,SPEC-045-R004,*|*,SPEC-045-R008,*) matrix_required=true ;;
          esac
          printf 'matrix_required=%s\n' "$matrix_required" >> "$GITHUB_OUTPUT"

