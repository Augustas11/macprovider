name: Spike 1840 App Attest

on:
  push:
    branches:
      - "spike/1840-**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    name: build, sign, notarize
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install XcodeGen 2.45.4
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install-pinned-xcodegen.sh "$RUNNER_TEMP/xcodegen-2.45.4"
          echo "$RUNNER_TEMP/xcodegen-2.45.4/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Decode App Attest profile
        shell: bash
        env:
          MALIBU_APP_ATTEST_PROFILE_BASE64: ${{ secrets.MALIBU_APP_ATTEST_PROFILE_BASE64 }}
        run: |
          set +x
          set -euo pipefail
          if [ -z "${MALIBU_APP_ATTEST_PROFILE_BASE64}" ]; then
            echo "::error::MALIBU_APP_ATTEST_PROFILE_BASE64 is empty. Enable App Attest on App ID tech.malibu.app, create a Developer ID provisioning profile for that App ID, base64-encode the .provisionprofile, and set this repo secret." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/spike1840"
          printf '%s' "$MALIBU_APP_ATTEST_PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/spike1840/profile.provisionprofile"
          if [ ! -s "$RUNNER_TEMP/spike1840/profile.provisionprofile" ]; then
            echo "::error::MALIBU_APP_ATTEST_PROFILE_BASE64 decoded to an empty profile." >&2
            exit 1
          fi

      - name: Import Developer ID certificate
        shell: bash
        env:
          APPLE_DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
        run: |
          set +x
          set -euo pipefail
          missing=""
          for var in APPLE_DEVELOPER_ID_CERT_P12_BASE64 APPLE_DEVELOPER_ID_CERT_PASSWORD \
                     APPLE_NOTARY_APPLE_ID APPLE_NOTARY_PASSWORD APPLE_NOTARY_TEAM_ID; do
            if [ -z "${!var}" ]; then
              missing="$missing $var"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Apple signing secrets missing:$missing" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/spike1840"
          umask 077
          KEYCHAIN_PASS="$(openssl rand -hex 16)"
          printf '%s' "$KEYCHAIN_PASS" > "$RUNNER_TEMP/spike1840/keychain.pass"
          printf '%s' "$APPLE_DEVELOPER_ID_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/spike1840/cert.p12"
          if [ ! -s "$RUNNER_TEMP/spike1840/cert.p12" ]; then
            echo "::error::Developer ID certificate decoded empty." >&2
            exit 1
          fi
          security create-keychain -p "$KEYCHAIN_PASS" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASS" build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          security import "$RUNNER_TEMP/spike1840/cert.p12" \
            -k build.keychain \
            -P "$APPLE_DEVELOPER_ID_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" build.keychain
          SIGNING_ID="$(security find-identity -v -p codesigning build.keychain \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$SIGNING_ID" ]; then
            echo "::error::No Developer ID Application identity found in the imported certificate." >&2
            exit 1
          fi
          team_suffix="($APPLE_NOTARY_TEAM_ID)"
          case "$SIGNING_ID" in
            *"$team_suffix") ;;
            *)
              echo "::error::Developer ID Application identity is not for APPLE_NOTARY_TEAM_ID." >&2
              exit 1
              ;;
          esac
          echo "SIGNING_ID=$SIGNING_ID" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/spike1840/cert.p12"
          unset KEYCHAIN_PASS APPLE_DEVELOPER_ID_CERT_PASSWORD APPLE_DEVELOPER_ID_CERT_P12_BASE64

      - name: Build and sign MalibuAttestSpike
        shell: bash
        env:
          PROFILE_PATH: ${{ runner.temp }}/spike1840/profile.provisionprofile
          SIGNING_IDENTITY: ${{ env.SIGNING_ID }}
          TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          BUNDLE_ID: tech.malibu.app
          OUT_DIR: spike/1840-app-attest/out
          SPIKE_KEYCHAIN_PASS_FILE: ${{ runner.temp }}/spike1840/keychain.pass
        run: |
          set +x
          set -euo pipefail
          bash spike/1840-app-attest/scripts/build-and-sign.sh

      - name: Build and sign provider-id child
        shell: bash
        env:
          SIGNING_IDENTITY: ${{ env.SIGNING_ID }}
          SPIKE_KEYCHAIN_PASS_FILE: ${{ runner.temp }}/spike1840/keychain.pass
        run: |
          set +x
          set -euo pipefail
          security unlock-keychain -p "$(cat "$SPIKE_KEYCHAIN_PASS_FILE")" build.keychain
          security default-keychain -s build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          mkdir -p spike/1840-app-attest/out
          xcrun swiftc -O \
            -o spike/1840-app-attest/out/live.malibu.provider.cli \
            spike/1840-app-attest/child/main.swift
          codesign --force \
            --options runtime \
            --timestamp \
            --identifier live.malibu.provider.cli \
            --sign "$SIGNING_IDENTITY" \
            spike/1840-app-attest/out/live.malibu.provider.cli
          codesign --verify --strict --verbose=2 spike/1840-app-attest/out/live.malibu.provider.cli
          codesign -dv spike/1840-app-attest/out/live.malibu.provider.cli 2>&1 \
            | awk -F= '/^(Identifier|TeamIdentifier|CDHash)=/{print}'

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: spike/1840-app-attest/verifier/go.mod
          cache: false

      - name: Test and build the verifier
        shell: bash
        run: |
          set -euo pipefail
          cd spike/1840-app-attest/verifier
          export GOTOOLCHAIN=local
          dirty="$(gofmt -l .)"
          if [ -n "$dirty" ]; then
            echo "::error::gofmt needed on: $dirty" >&2
            exit 1
          fi
          go vet ./...
          go test ./... -count=1
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o ../out/appattest-verify .

      - name: Notarize and staple
        shell: bash
        env:
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
        run: |
          set +x
          set -euo pipefail
          app="spike/1840-app-attest/out/MalibuAttestSpike.app"
          child="spike/1840-app-attest/out/live.malibu.provider.cli"
          app_zip="$RUNNER_TEMP/spike1840/MalibuAttestSpike.notary.zip"
          child_zip="$RUNNER_TEMP/spike1840/child.notary.zip"
          ditto -c -k --keepParent "$app" "$app_zip"
          scripts/notarytool-submit-with-retry.sh "$app_zip" \
            --apple-id "$APPLE_NOTARY_APPLE_ID" \
            --password "$APPLE_NOTARY_PASSWORD" \
            --team-id "$APPLE_NOTARY_TEAM_ID" \
            --wait
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          rm -f spike/1840-app-attest/out/MalibuAttestSpike.zip "$app_zip"
          ditto -c -k --keepParent "$app" spike/1840-app-attest/out/MalibuAttestSpike.zip
          ditto -c -k --keepParent "$child" "$child_zip"
          scripts/notarytool-submit-with-retry.sh "$child_zip" \
            --apple-id "$APPLE_NOTARY_APPLE_ID" \
            --password "$APPLE_NOTARY_PASSWORD" \
            --team-id "$APPLE_NOTARY_TEAM_ID" \
            --wait
          rm -f "$child_zip"
          if ! xcrun stapler staple "$child"; then
            echo "::warning::stapler did not staple the raw child Mach-O. Notarization was accepted; Gatekeeper can fetch the ticket online."
          fi
          # ditto keeps the executable bit and the embedded signature; the
          # artifact upload alone would drop the mode bits.
          rm -f spike/1840-app-attest/out/live.malibu.provider.cli.zip
          ditto -c -k --keepParent "$child" spike/1840-app-attest/out/live.malibu.provider.cli.zip

      - name: Upload spike artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: spike-1840-app-attest
          if-no-files-found: error
          retention-days: 14
          path: |
            spike/1840-app-attest/out/MalibuAttestSpike.zip
            spike/1840-app-attest/out/live.malibu.provider.cli.zip
            spike/1840-app-attest/out/appattest-verify
            spike/1840-app-attest/out/entitlements.plist
            spike/1840-app-attest/out/appattest-environment.txt

      - name: Delete temporary keychain
        if: always()
        shell: bash
        run: |
          set +x
          set -euo pipefail
          security delete-keychain build.keychain >/dev/null 2>&1 || true
          rm -rf "${RUNNER_TEMP:-}/spike1840"
