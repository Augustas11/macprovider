# Phase 2 config — coordinator track (added 2026-05-28 after Phase 4 deploy).
#
# Fires the same cooperative + adversarial batches as config-m4.yaml /
# config-m1.yaml, but routes through the Phase 4 coordinator instead of
# direct to a tunnel. Lets us measure:
#   - end-to-end latency: coordinator path vs. direct-to-tunnel
#   - coordinator routing overhead (expect <100 ms based on smoke tests)
#   - real-world request distribution across the pool (when N >= 2 providers)
#   - 502/530 handling under real partner sleep/wake cycles
#
# Run alongside config-m4.yaml and config-m1.yaml, NOT instead of — direct
# baselines remain the control group.

tunnel_url: "https://coordinator.malibu.tech"

# Model rotation: coordinator pool may serve multiple models. Pick whatever
# is most useful for comparison. Default below matches M4's current model
# so coord-vs-m4 latency comparisons are direct.
model: "mlx-community/Qwen2.5-7B-Instruct-4bit"

# Multi-model variant (uncomment once both M4 and M1 are on phase3-binary
# + coordinator and the pool offers more than one model):
# models:
#   - {id: "mlx-community/Qwen2.5-7B-Instruct-4bit", tier: "16gb"}
#   - {id: "mlx-community/Llama-3.2-3B-Instruct-4bit", tier: "8gb"}
# model_select: "rotate"

# Per-request HTTP timeout. Coordinator adds ~50-100ms of routing latency
# on top of provider inference; keep the same 180s budget for parity.
timeout_s: 180

batch:
  - short_chat
  - medium_with_system
  - code_completion
  - agent_style
  - streaming_check
  # - long_context  # flip on after coordinator baseline is established

batch_adversarial:
  - retry_storm
  - concurrent_burst_8way
  - midstream_disconnect
  - malformed_tool_call
  # - long_context_oom_probe

# Shared SQLite. tunnel_url column distinguishes coordinator-routed rows
# from direct-to-tunnel rows for A/B analysis.
db_path: "runs.sqlite"
reports_dir: "reports"
