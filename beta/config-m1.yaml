# Phase 2 config — M1 collaborator (provider)
# Hostname is pre-provisioned via Cloudflare named tunnel.
# Model: fill in once the M1 partner reports what their agent picked.

tunnel_url: "https://m1.malibu.tech"

# M1 partner has 8GB — Llama 3.2 3B 4-bit. After M1 upgraded to phase3-binary
# v1.1.3 (2026-05-28), the model name comparison became case-sensitive and
# the binary advertises Title Case at /v1/models. Updated to match exact
# string from `curl https://m1.malibu.tech/v1/models | jq .data[0].id`.
# (mlx_lm.server was case-insensitive; phase3-binary v1.1.x is not — TODO
# fix in v1.1.5 or v1.2.)
model: "mlx-community/Llama-3.2-3B-Instruct-4bit"

timeout_s: 180

batch:
  - short_chat
  - medium_with_system
  - code_completion
  - agent_style
  - streaming_check
  # - long_context

batch_adversarial:
  - retry_storm
  - concurrent_burst_8way
  - midstream_disconnect
  - malformed_tool_call
  # - long_context_oom_probe

db_path: "runs.sqlite"
reports_dir: "reports"
