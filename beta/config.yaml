# Phase 2 buyer harness configuration.
# Fill in tunnel_url from the M4 user, set model to whatever they actually serve,
# then run scripts/run-once.sh to smoke-test before enabling the cron schedule.

# Required: the M4 user pastes their https://*.trycloudflare.com URL here.
# No trailing slash. The harness appends /v1/chat/completions itself.
tunnel_url: "http://127.0.0.1:8090"

# The model name the M4 user passed to `mlx_lm.server --model`.
# mlx_lm.server echoes whatever you pass; the harness sends this in the request
# body so the response `usage` and `model` fields line up.
model: "mlx-community/Llama-3.2-3B-Instruct-4bit"

# Multi-model rotation (optional, overrides `model:` above when present):
# models:
#   - {id: "mlx-community/Qwen2.5-7B-Instruct-4bit", tier: "16gb"}
#   - {id: "mlx-community/Qwen2.5-14B-Instruct-4bit", tier: "24gb"}
#   - {id: "mlx-community/Llama-3.2-3B-Instruct-4bit", tier: "8gb"}
# model_select: "rotate"    # "rotate" | "first" | "day_of_week"

# Per-request HTTP timeout (seconds). Long-context workloads on 8GB Macs can
# easily eat 60s of prefill; 180s gives headroom without hanging forever on a
# dead tunnel.
timeout_s: 180

# Which workloads to run in a scheduled batch. Order is preserved; one request
# per entry per batch. Remove any that hurt the M4 user's machine.
batch:
  - short_chat
  - medium_with_system
  - code_completion
  - agent_style
  - streaming_check
  # long_context is heavy — opt in only after baseline is established.
  # - long_context

# Adversarial workloads — fired by `harness.py --batch adversarial`.
# Run on a SEPARATE crontab line (e.g. twice/week off-peak). Each entry runs
# its own internal HTTP storm and writes one aggregate row to adversarial_runs.
batch_adversarial:
  - retry_storm
  - concurrent_burst_8way
  - midstream_disconnect
  - malformed_tool_call
  # long_context_oom_probe is heavy (~30K tokens) — opt in deliberately:
  # - long_context_oom_probe

# Where to write the SQLite database. Relative paths resolve against beta/.
db_path: "runs.sqlite"

# Where to drop HTML daily reports. Created if missing.
reports_dir: "reports"
