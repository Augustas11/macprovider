add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; connect-src https://api.malibu.tech; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src 'none'; form-action https://api.malibu.tech; frame-ancestors 'none'; upgrade-insecure-requests" always;
