<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Malibu</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <script>
    const PAIR_OT_CAPTURED = (function() {
      if (location.pathname !== "/claim") return null;
      const u = new URL(location.href);
      const ot = u.searchParams.get("ot");
      history.replaceState({}, "", "/claim");
      return ot;
    })();
    var PORTAL_SESSION_CAPTURED = (function() {
      const u = new URL(location.href);
      const ps = (u.searchParams.get("ps") || "").trim();
      if (!ps) return "";
      u.searchParams.delete("ps");
      history.replaceState({}, "", u.pathname + u.search + u.hash);
      return ps;
    })();
  </script>
  <style>
    :root {
      --ice-white:#fafbff;
      --ocean-night:#143a45;
      --ocean-night-muted:#113540;
      --ocean-night-deep:#0c3a45;
      --sunset-coral:#f76b57;
      --sunset-coral-hover:#e05a48;
      --ocean-breeze:#4bb8d0;
      --malibu-gold:#ffc629;
      --seafoam-teal:#60ab9a;
      --ink-blue:#101d29;
      --bg:var(--ink-blue);
      --sb:var(--ocean-night);
      --surface:var(--ocean-night-muted);
      --border:rgba(250,251,255,.12);
      --border2:rgba(250,251,255,.18);
      --line:rgba(250,251,255,.12);
      --text:var(--ice-white);
      --muted:#fafbffb8;
      --hint:#fafbff80;
      --accent:var(--sunset-coral);
      --accent-dim:#f76b572e;
      --ok:#00e889;
      --warn:var(--malibu-gold);
      --bad:#ff6b6b;
      color-scheme:dark;
    }
    * { box-sizing:border-box; }
    html, body { margin:0; padding:0; background:var(--bg); color:var(--text); height:100%; }
    body {
      font:14px/1.5 "Hanken Grotesk", system-ui, sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    code, .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    a { color:var(--malibu-gold); text-decoration:none; }
    a:hover { text-decoration:underline; }
    button { font:inherit; color:inherit; cursor:pointer; }

    /* App shell */
    .shell { display:flex; min-height:100vh; }
    .sidebar {
      width:220px; flex:0 0 220px;
      background:var(--sb);
      border-right:1px solid var(--border);
      display:flex; flex-direction:column;
      padding:18px 0;
    }
    .brand {
      padding:0 16px 14px 16px;
      border-bottom:1px solid var(--border);
      margin-bottom:10px;
    }
    .brand-lockup {
      display:inline-flex; align-items:center; gap:10px;
      color:inherit; text-decoration:none;
    }
    .brand-mark { width:28px; height:28px; display:block; flex-shrink:0; }
    .brand-wordmark {
      letter-spacing:-.01em; color:var(--ice-white);
      font-size:17px; font-weight:500; line-height:1;
      white-space:nowrap;
    }
    .brand-period {
      width:.24em; height:.24em; margin-left:.02em;
      background:var(--sunset-coral); border-radius:1px;
      display:inline-block; vertical-align:baseline;
    }
    .nav { display:flex; flex-direction:column; gap:2px; padding:6px 8px; }
    .nav-item {
      display:block; width:100%; text-align:left;
      background:transparent; border:0;
      color:var(--muted); padding:8px 12px; border-radius:8px;
      font-size:13px; font-weight:500;
    }
    .nav-item:hover { background:var(--ice-white-10, #fafbff1a); color:var(--text); }
    .nav-item.active { background:var(--accent-dim); color:var(--text); border-left:2px solid var(--accent); padding-left:10px; }
    .nav-spacer { flex:1; }
    .nav-footer {
      padding:10px 12px; border-top:1px solid var(--border);
      display:flex; flex-direction:column; gap:6px; font-size:13px;
    }
    .nav-footer a, .nav-footer button { color:var(--muted); }
    .nav-footer button {
      background:transparent; border:0; padding:6px 0; text-align:left;
    }
    .nav-footer button:hover { color:var(--text); }

    .main {
      flex:1; display:flex; flex-direction:column;
      min-width:0;
    }
    .topbar {
      padding:14px 24px; border-bottom:1px solid var(--border);
      display:none;
      align-items:center; gap:12px;
      background:var(--sb);
    }
    .hamburger {
      background:transparent; border:1px solid var(--border2);
      color:var(--text); padding:6px 10px; border-radius:6px;
    }
    .surface-pane { padding:24px; flex:1; overflow:auto; }

    .scrim {
      display:none;
      position:fixed; inset:0;
      background:rgba(0,0,0,.45);
      z-index:40;
    }

    /* Cards */
    .card {
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:10px;
      padding:16px 18px;
    }
    .card h3 { margin:0 0 4px 0; font-size:13px; color:var(--muted); font-weight:500; }
    .card .val { font-size:24px; font-weight:600; letter-spacing:-.2px; }
    .card .sub { font-size:12px; color:var(--muted); margin-top:6px; }

    /* Surface A */
    .surface-title { font-size:18px; font-weight:600; margin:0 0 14px 0; }

    .dash { max-width:640px; }
    .dash-head {
      display:flex; align-items:baseline; justify-content:space-between;
      gap:16px; margin-bottom:28px;
    }
    .dash-status { font-size:22px; font-weight:600; letter-spacing:-.02em; }
    .dash-status.ok { color:var(--seafoam-teal); }
    .dash-status.idle { color:var(--muted); }
    .dash-status.warn { color:var(--sunset-coral); }
    .dash-trust { color:var(--muted); font-size:13px; }
    .dash-hero { margin-bottom:22px; }
    .dash-kicker {
      font-size:12px; color:var(--muted); letter-spacing:.08em;
      text-transform:uppercase; font-weight:500; margin-bottom:6px;
    }
    .dash-amt { font-size:44px; font-weight:600; letter-spacing:-.03em; line-height:1.05; }
    .dash-sub { margin-top:10px; color:var(--muted); font-size:14px; }
    .dash-malibu { font-size:16px; margin-top:8px; }
    .dash-note { margin-top:8px; font-size:13px; color:var(--muted); }
    .dash-note.hold { color:var(--sunset-coral); }
    .dash-wallet { margin-top:14px; font-size:13px; color:var(--muted); }
    .dash-exception {
      margin-top:22px; padding:14px 16px;
      border:1px solid rgba(247,107,87,.35);
      background:var(--accent-dim); border-radius:12px;
    }
    .dash-exception .ex-reason { font-size:14px; }
    .dash-exception .ex-action { margin-top:6px; color:var(--muted); font-size:13px; }
    .panel {
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:10px;
      padding:16px 18px;
    }
    .panel h2 { margin:0 0 10px 0; font-size:14px; color:var(--muted); font-weight:500; letter-spacing:.3px; text-transform:uppercase; }
    .row {
      display:flex; flex-direction:column; gap:8px;
      padding:12px;
      border:1px solid var(--border);
      border-radius:8px;
      background:var(--bg);
    }
    .row + .row { margin-top:10px; }
    .row .row-title { font-size:14px; }
    .row .row-hint { font-size:13px; color:var(--muted); }
    .row .row-cta {
      display:flex; align-items:center; gap:10px;
      margin-top:4px;
    }
    .row .row-cta code {
      background:var(--ink-blue); border:1px solid var(--border2);
      padding:5px 8px; border-radius:6px; font-size:12px;
    }
    .row .copy-btn {
      background:transparent; border:1px solid var(--border2);
      color:var(--text); padding:5px 10px; border-radius:6px;
      font-size:12px;
    }
    .row .copy-btn:hover { background:var(--accent-dim); }
    .row .copy-ok { color:var(--ok); font-size:12px; }
    .row.muted {
      color:var(--muted);
      background:transparent;
      border-style:dashed;
    }

    /* Banners */
    .banner {
      border-radius:10px;
      padding:12px 16px;
      margin-bottom:16px;
      border:1px solid;
      font-size:13px;
      line-height:1.5;
    }
    .banner.bad {
      background:rgba(239,68,68,.10);
      border-color:rgba(239,68,68,.5);
      color:#fecaca;
    }
    .banner.warn {
      background:rgba(245,158,11,.10);
      border-color:rgba(245,158,11,.5);
      color:#fde68a;
    }

    /* Sign-in */
    .signin-wrap {
      min-height:100vh;
      display:flex; align-items:center; justify-content:center;
      padding:24px;
    }
    .signin-card {
      width:100%; max-width:420px;
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:12px;
      padding:28px 26px;
    }
    .signin-card .brand-lockup { margin-bottom:16px; }
    .signin-card h1 { margin:0 0 4px 0; font-size:18px; }
    .signin-card .h-sub { color:var(--muted); font-size:13px; margin-bottom:18px; }
    .signin-err { color:var(--bad); font-size:13px; margin-top:10px; }
    .signin-misconfig {
      margin-top:14px; padding:10px 12px;
      border:1px solid rgba(245,158,11,.5);
      background:rgba(245,158,11,.10);
      color:#fde68a;
      border-radius:8px; font-size:12px; line-height:1.5;
    }
    .signin-guide { margin-top:14px; color:var(--muted); font-size:13px; text-align:center; }
    .github-btn {
      display:block; width:100%;
      background:var(--accent); border:0; color:var(--ice-white);
      padding:10px; border-radius:12px; font-weight:600;
      text-align:center;
    }
    .github-btn:hover { filter:brightness(1.08); text-decoration:none; }
    .claim-card h1 { color:var(--text); }
    .claim-card .claim-ok { color:var(--ok); font-size:13px; margin-top:10px; }
    .provider-list { display:flex; flex-direction:column; gap:10px; }
    .provider-row {
      display:flex; justify-content:space-between; align-items:center; gap:12px;
      background:var(--surface); border:1px solid var(--border);
      border-radius:8px; padding:12px 14px; width:100%; text-align:left;
    }
    .provider-row:hover { background:var(--accent-dim); }
    .provider-row .sub { color:var(--muted); font-size:12px; }

    /* Unavailable mode */
    .unavail-wrap {
      min-height:100vh;
      display:flex; align-items:center; justify-content:center;
      padding:24px;
    }
    .unavail-card {
      width:100%; max-width:560px;
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:12px;
      padding:28px 26px;
    }
    .unavail-card h1 { margin:0 0 8px 0; font-size:18px; color:var(--warn); }
    .unavail-card p { color:var(--muted); font-size:13px; line-height:1.6; }
    .unavail-card code { background:var(--ink-blue); border:1px solid var(--border2); padding:2px 6px; border-radius:4px; font-size:12px; color:var(--text); }

    /* Surface B */
    .section { margin-bottom:22px; }
    .section-h { font-size:13px; color:var(--muted); margin:0 0 10px 0; text-transform:uppercase; letter-spacing:.5px; font-weight:500; }
    .section-sub { font-size:12px; color:var(--muted); margin:0 0 12px 0; }
    .grid-4 { display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); }
    .snippet { display:flex; align-items:center; gap:8px; }
    .snippet code { flex:1; background:var(--bg); border:1px solid var(--border2); padding:7px 10px; border-radius:6px; font-size:12px; overflow-x:auto; white-space:nowrap; }

    /* Mobile */
    @media (max-width: 720px) {
      .shell { flex-direction:column; }
      .topbar { display:flex; }
      .sidebar {
        position:fixed; top:0; left:0; bottom:0;
        width:240px;
        z-index:50;
        transform:translateX(-100%);
        transition:transform .18s ease;
      }
      .sidebar.open { transform:translateX(0); }
      .scrim.show { display:block; }
      .surface-pane { padding:16px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    "use strict";

    /* =====================================================================
     * Constants / thresholds (SPEC-014 §5.4)
     * ===================================================================== */
    var POOL_POLL_MS = 30 * 1000;
    var EARN_POLL_MS = 60 * 1000;
    var EARN_CACHE_TTL_MS = 60 * 1000;

    var ALLOWED_CONFIG_KEYS = [
      "coordinator_base_url",
      "releases_repo_owner_name",
      "require_provider_tokens",
      "github_oauth_enabled"
    ];
    var REPO_OWNER_NAME_RE = /^[A-Za-z0-9._-]+\/[A-Za-z0-9._-]+$/;

    var PORTAL_SESSION_PATH = "/v1/portal/session";
    var POOL_PATH = "/v1/pool/check";
    function earningsPath(providerId) {
      return "/providers/" + encodeURIComponent(providerId) + "/earnings";
    }
    var MALIBU_ACCRUAL_PATH = "/v1/provider/malibu-accrual";
    var PROVIDER_WALLET_PATH = "/v1/provider/wallet";

    /* =====================================================================
     * State container
     * ===================================================================== */
    var state = {
      cfg: null,
      session: null,
      sessionGeneration: 0,
      route: "dashboard",
      pool: { data: null, ts: 0, err: null, inflight: false },
      earn: { data: null, ts: 0, err: null, inflight: false },
      malibu: { data: null, ts: 0, err: null, inflight: false },
      wallet: { data: null, ts: 0, err: null, inflight: false },
      authFailBySurface: {},
      proxyMissing: false,
      sidebarOpen: false,
      signinErr: null,
      signinMisconfigNotice: null,
      copyEcho: null,
      configError: null,
      flagFalse: false,
      githubAuthState: "idle",
      githubProviders: [],
      cookieFetch: null,
      claim: { phase: "idle", error: null, result: null },
    };

    var timers = {
      pool: null,
      earn: null,
    };

    /* =====================================================================
     * DOM helpers — text-only, never assigns markup from user data
     * ===================================================================== */
    function el(tag, attrs) {
      var node = document.createElement(tag);
      if (attrs) {
        for (var k in attrs) {
          if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
          var v = attrs[k];
          if (v === null || v === undefined || v === false) continue;
          if (k === "class") node.className = v;
          else if (k === "style") node.setAttribute("style", v);
          else if (k.indexOf("on") === 0 && typeof v === "function") {
            node.addEventListener(k.slice(2), v);
          } else if (k === "for") node.setAttribute("for", v);
          else if (k === "value") node.value = v;
          else if (typeof v === "boolean") {
            if (v) node.setAttribute(k, "");
          } else {
            node.setAttribute(k, String(v));
          }
        }
      }
      for (var i = 2; i < arguments.length; i++) {
        var child = arguments[i];
        if (child === null || child === undefined || child === false) continue;
        if (Array.isArray(child)) {
          for (var j = 0; j < child.length; j++) appendChild(node, child[j]);
        } else {
          appendChild(node, child);
        }
      }
      return node;
    }
    function appendChild(parent, child) {
      if (child === null || child === undefined || child === false) return;
      if (child instanceof Node) parent.appendChild(child);
      else parent.appendChild(document.createTextNode(String(child)));
    }
    function clear(node) {
      while (node.firstChild) node.removeChild(node.firstChild);
    }

    function brandMark() {
      var NS = "http://www.w3.org/2000/svg";
      var svg = document.createElementNS(NS, "svg");
      svg.setAttribute("viewBox", "0 0 64 64");
      svg.setAttribute("class", "brand-mark");
      svg.setAttribute("aria-hidden", "true");
      var tile = document.createElementNS(NS, "rect");
      tile.setAttribute("width", "64");
      tile.setAttribute("height", "64");
      tile.setAttribute("rx", "14");
      tile.setAttribute("fill", "#143A45");
      svg.appendChild(tile);
      var g = document.createElementNS(NS, "g");
      g.setAttribute("fill", "#FF6E5B");
      var paths = [
        "M19.50 38.00 A12.5 12.5 0 0 1 44.50 38.00 Z",
        "M44.75 33.56 L59.39 32.18 L45.45 36.87 Z",
        "M42.54 29.56 L55.87 23.37 L44.30 32.44 Z",
        "M39.11 26.53 L49.62 16.24 L41.74 28.66 Z",
        "M34.88 24.81 L41.35 11.61 L38.07 25.94 Z",
        "M30.31 24.61 L32.00 10.00 L33.69 24.61 Z",
        "M25.93 25.94 L22.65 11.61 L29.12 24.81 Z",
        "M22.26 28.66 L14.38 16.24 L24.89 26.53 Z",
        "M19.70 32.44 L8.13 23.37 L21.46 29.56 Z",
        "M18.55 36.87 L4.61 32.18 L19.25 33.56 Z",
      ];
      for (var i = 0; i < paths.length; i++) {
        var p = document.createElementNS(NS, "path");
        p.setAttribute("d", paths[i]);
        g.appendChild(p);
      }
      svg.appendChild(g);
      return svg;
    }

    function brandLockup() {
      return el("div", { class: "brand-lockup" },
        brandMark(),
        el("span", { class: "brand-wordmark" },
          "Malibu",
          el("span", { class: "brand-period", "aria-hidden": "true" })));
    }

    /* =====================================================================
     * AUTH-3 — operator-declared deployment mode loader (fail-CLOSED)
     * ===================================================================== */
    function loadConfig() {
      return fetch("/portal-config.json", { cache: "no-store" })
        .then(function (resp) {
          if (!resp.ok) {
            throw new Error("non-200:" + resp.status);
          }
          return resp.json().catch(function () {
            throw new Error("malformed-json");
          });
        })
        .then(function (raw) {
          var validated = validateConfig(raw);
          state.cfg = validated;
          return validated;
        })
        .catch(function (err) {
          var info = describeConfigError(err);
          if (info.kind !== "flag-false") {
            state.configError = info;
          }
          throw err;
        });
    }

    function validateConfig(raw) {
      if (raw === null || typeof raw !== "object" || Array.isArray(raw)) {
        throw new Error("not-object");
      }
      var keys = Object.keys(raw);
      for (var i = 0; i < keys.length; i++) {
        if (ALLOWED_CONFIG_KEYS.indexOf(keys[i]) === -1) {
          throw new Error("unknown-key:" + keys[i]);
        }
      }
      var cbu = raw.coordinator_base_url;
      if (typeof cbu !== "string" || cbu.length === 0) {
        throw new Error("invalid-coordinator_base_url");
      }
      var rro = raw.releases_repo_owner_name;
      if (typeof rro !== "string" || rro.length === 0 || !REPO_OWNER_NAME_RE.test(rro)) {
        throw new Error("invalid-releases_repo_owner_name");
      }
      if (raw.require_provider_tokens !== true) {
        state.flagFalse = true;
        throw new Error("flag-false");
      }
      if (Object.prototype.hasOwnProperty.call(raw, "github_oauth_enabled") && typeof raw.github_oauth_enabled !== "boolean") {
        throw new Error("invalid-github_oauth_enabled");
      }
      return {
        coordinator_base_url: cbu,
        releases_repo_owner_name: rro,
        require_provider_tokens: true,
        github_oauth_enabled: raw.github_oauth_enabled === true,
      };
    }

    function describeConfigError(err) {
      var msg = err && err.message ? err.message : String(err);
      if (msg === "flag-false") return { kind: "flag-false" };
      if (msg.indexOf("unknown-key:") === 0) {
        return { kind: "unknown-key", key: msg.slice("unknown-key:".length) };
      }
      if (msg === "not-object") return { kind: "not-object" };
      if (msg === "malformed-json") return { kind: "malformed-json" };
      if (msg.indexOf("invalid-") === 0) return { kind: "invalid-field", field: msg.slice("invalid-".length) };
      if (msg.indexOf("non-200:") === 0) return { kind: "non-200", status: msg.slice("non-200:".length) };
      return { kind: "fetch-failed" };
    }

    /* =====================================================================
     * Same-origin fetch with proxy fail-loud (§3 + Open Q9)
     * ===================================================================== */
    function coordFetch(pathAndQuery, opts) {
      opts = opts || {};
      var headers = {};
      if (opts.auth && state.session && state.session.provider_token) {
        headers["Authorization"] = "Bearer " + state.session.provider_token;
      }
      headers["Accept"] = "application/json";
      return fetch(pathAndQuery, {
        method: "GET",
        headers: headers,
        cache: "no-store",
      })
        .then(function (resp) {
          var surface = opts.surface;
          var isCurrentSession = opts.sessionGeneration === undefined ||
            opts.sessionGeneration === state.sessionGeneration;
          if (resp.ok) {
            if (isCurrentSession && opts.auth && surface) state.authFailBySurface[surface] = 0;
            return resp.json().then(function (j) { return { ok: true, status: resp.status, body: j }; });
          }
          if (isCurrentSession && opts.auth && surface &&
              (resp.status === 401 || resp.status === 403 || resp.status === 404) &&
              resp.status !== opts.ignoreAuthFailureStatus) {
            state.authFailBySurface[surface] = (state.authFailBySurface[surface] || 0) + 1;
          }
          return { ok: false, status: resp.status, body: null };
        })
        .catch(function (e) {
          if (!state.proxyMissing) {
            state.proxyMissing = true;
            render();
          }
          throw e;
        });
    }

    function makeCookieFetch() {
      return function cookieFetch(pathAndQuery, opts) {
        opts = opts || {};
        var supplied = opts.headers || {};
        var headers = { "Accept": "application/json", "Content-Type": "application/json" };
        for (var k in supplied) {
          if (!Object.prototype.hasOwnProperty.call(supplied, k)) continue;
          if (String(k).toLowerCase() === "authorization") continue;
          headers[k] = supplied[k];
        }
        return fetch(pathAndQuery, {
          method: opts.method || "GET",
          headers: headers,
          body: opts.body,
          cache: "no-store",
          credentials: "include",
        }).catch(function (e) {
          if (!state.proxyMissing) {
            state.proxyMissing = true;
            render();
          }
          throw e;
        });
      };
    }

    function cookieJSON(pathAndQuery, opts) {
      if (!state.cookieFetch) state.cookieFetch = makeCookieFetch();
      return state.cookieFetch(pathAndQuery, opts).then(function (resp) {
        return readJSONResponse(resp);
      });
    }

    function readJSONResponse(resp) {
      return resp.text().then(function (txt) {
        var body = null;
        if (txt) {
          try { body = JSON.parse(txt); } catch (_) { body = null; }
        }
        return { ok: resp.ok, status: resp.status, body: body };
      });
    }

    window.__macproviderPortalAuthProbe = function () {
      return {
        mode: sessionUsesPortalBearer() ? "bearer" : (state.cfg && state.cfg.github_oauth_enabled ? "cookie" : "paste"),
        pasteAuth: coordFetch,
        cookieAuth: state.cookieFetch || undefined,
      };
    };

    function sessionUsesPortalBearer() {
      return !!(state.session && state.session.provider_token);
    }

    function sessionUsesGitHubCookie() {
      return !!(state.cfg && state.cfg.github_oauth_enabled && !sessionUsesPortalBearer());
    }

    /* =====================================================================
     * Pool poll (§5.4: 30 s + manual refresh)
     * ===================================================================== */
    function poolCheck() {
      if (!state.session) return Promise.resolve();
      if (state.pool.inflight) return Promise.resolve();
      state.pool.inflight = true;
      render();
      var pid = state.session.provider_id;
      var sessionGeneration = state.sessionGeneration;
      var url = POOL_PATH + "?provider_id=" + encodeURIComponent(pid);
      var fetchResult = sessionUsesGitHubCookie()
        ? cookieJSON(url, { method: "GET" })
        : coordFetch(url, { auth: false, sessionGeneration: sessionGeneration });
      return fetchResult
        .then(function (r) {
          if (sessionGeneration !== state.sessionGeneration) return;
          state.pool.inflight = false;
          if (r.ok) {
            state.pool.data = r.body;
            state.pool.ts = Date.now();
            state.pool.err = null;
          } else {
            state.pool.err = { status: r.status };
          }
          render();
        })
        .catch(function () {
          if (sessionGeneration !== state.sessionGeneration) return;
          state.pool.inflight = false;
          render();
        });
    }

    /* =====================================================================
     * Earnings fetch (§5.4: 60 s cadence + 60 s cache TTL)
     * ===================================================================== */
    function earnFetch(surface, opts) {
      opts = opts || {};
      if (!state.session) return Promise.resolve();
      var now = Date.now();
      if (!opts.force && state.earn.data && (now - state.earn.ts) < EARN_CACHE_TTL_MS) {
        return Promise.resolve();
      }
      if (state.earn.inflight) return Promise.resolve();
      state.earn.inflight = true;
      render();
      var pid = state.session.provider_id;
      var sessionGeneration = state.sessionGeneration;
      var useCookieAuth = sessionUsesGitHubCookie();
      var fetchResult = useCookieAuth
        ? cookieJSON(earningsPath(pid), { method: "GET" })
        : coordFetch(earningsPath(pid), {
            auth: true,
            surface: surface || "dashboard",
            sessionGeneration: sessionGeneration
          });
      return fetchResult
        .then(function (r) {
          if (sessionGeneration !== state.sessionGeneration) return;
          state.earn.inflight = false;
          if (r.ok) {
            state.earn.data = r.body;
            state.earn.ts = Date.now();
            state.earn.err = null;
            render();
            return;
          }
          if (r.status === 401 || r.status === 403 || r.status === 404) {
            if (useCookieAuth && r.status === 401) {
              githubSessionExpired("/" + "?p=" + encodeURIComponent(pid));
            } else {
              handleAuthRejection(r.status, surface || "dashboard");
            }
            return;
          }
          state.earn.err = { status: r.status };
          render();
        })
        .catch(function () {
          if (sessionGeneration !== state.sessionGeneration) return;
          state.earn.inflight = false;
          render();
        });
    }

    function malibuFetch(surface, opts) {
      opts = opts || {};
      if (!state.session || sessionUsesGitHubCookie()) return Promise.resolve();
      var sessionGeneration = state.sessionGeneration;
      var now = Date.now();
      if (!opts.force && state.malibu.data && (now - state.malibu.ts) < EARN_CACHE_TTL_MS) {
        return Promise.resolve();
      }
      if (state.malibu.inflight) return Promise.resolve();
      state.malibu.inflight = true;
      render();
      return coordFetch(MALIBU_ACCRUAL_PATH, {
        auth: true,
        surface: surface || "dashboard",
        ignoreAuthFailureStatus: 404,
        sessionGeneration: sessionGeneration
      })
        .then(function (r) {
          if (sessionGeneration !== state.sessionGeneration) return;
          state.malibu.inflight = false;
          if (r.ok) {
            state.malibu.data = r.body;
            state.malibu.ts = Date.now();
            state.malibu.err = null;
            render();
            return;
          }
          state.malibu.data = null;
          state.malibu.ts = 0;
          if (r.status === 401 || r.status === 403) {
            handleAuthRejection(r.status, surface || "dashboard");
            return;
          }
          state.malibu.err = {
            status: r.status,
            unavailable: r.status === 404
          };
          render();
        })
        .catch(function () {
          if (sessionGeneration !== state.sessionGeneration) return;
          state.malibu.inflight = false;
          state.malibu.data = null;
          state.malibu.ts = 0;
          render();
        });
    }

    function walletFetch(surface, opts) {
      opts = opts || {};
      if (!state.session || sessionUsesGitHubCookie()) return Promise.resolve();
      var sessionGeneration = state.sessionGeneration;
      var now = Date.now();
      if (!opts.force && state.wallet.data && (now - state.wallet.ts) < EARN_CACHE_TTL_MS) {
        return Promise.resolve();
      }
      if (state.wallet.inflight) return Promise.resolve();
      state.wallet.inflight = true;
      render();
      return coordFetch(PROVIDER_WALLET_PATH, {
        auth: true,
        surface: surface || "dashboard",
        ignoreAuthFailureStatus: 404,
        sessionGeneration: sessionGeneration
      })
        .then(function (r) {
          if (sessionGeneration !== state.sessionGeneration) return;
          state.wallet.inflight = false;
          if (r.ok) {
            state.wallet.data = r.body;
            state.wallet.ts = Date.now();
            state.wallet.err = null;
            render();
            return;
          }
          state.wallet.data = null;
          state.wallet.ts = 0;
          if (r.status === 401 || r.status === 403) {
            handleAuthRejection(r.status, surface || "dashboard");
            return;
          }
          state.wallet.err = {
            status: r.status,
            unavailable: r.status === 404
          };
          render();
        })
        .catch(function () {
          if (sessionGeneration !== state.sessionGeneration) return;
          state.wallet.inflight = false;
          state.wallet.data = null;
          state.wallet.ts = 0;
          render();
        });
    }

    /* =====================================================================
     * Auth rejection handling (§2.2 + §2.3 stale-config guard)
     * ===================================================================== */
    function handleAuthRejection(status, surface) {
      state.sessionGeneration += 1;
      var failCount = state.authFailBySurface[surface] || 0;
      var misconfig = failCount >= 2;
      stopPollers();
      state.session = null;
      state.earn = { data: null, ts: 0, err: null, inflight: false };
      state.malibu = { data: null, ts: 0, err: null, inflight: false };
      state.wallet = { data: null, ts: 0, err: null, inflight: false };
      state.pool = { data: null, ts: 0, err: null, inflight: false };
      if (status === 401) {
        state.signinErr = signInRejectedCopy();
      } else {
        state.signinErr = signInRejectedCopy();
      }
      state.signinMisconfigNotice = misconfig ? misconfigNoticeCopy() : null;
      render();
    }
    function signInRejectedCopy() {
      return "This portal link expired. Ask Malibu for a new one.";
    }
    function misconfigNoticeCopy() {
      return "The portal could not verify this Malibu link. Try a fresh link from Malibu.";
    }

    /* =====================================================================
     * Pollers
     * ===================================================================== */
    function startPollers() {
      stopPollers();
      timers.pool = setInterval(function () { poolCheck(); }, POOL_POLL_MS);
      timers.earn = setInterval(function () {
        earnFetch("dashboard");
        malibuFetch("dashboard");
        walletFetch("dashboard");
      }, EARN_POLL_MS);
      poolCheck();
      earnFetch("dashboard", { force: true });
      malibuFetch("dashboard", { force: true });
      walletFetch("dashboard", { force: true });
    }
    function stopPollers() {
      if (timers.pool) { clearInterval(timers.pool); timers.pool = null; }
      if (timers.earn) { clearInterval(timers.earn); timers.earn = null; }
    }

    /* =====================================================================
     * Sign-out
     * ===================================================================== */
    function signOut() {
      state.sessionGeneration += 1;
      if (sessionUsesGitHubCookie()) {
        stopPollers();
        state.session = null;
        state.githubAuthState = "signin";
        state.pool = { data: null, ts: 0, err: null, inflight: false };
        state.earn = { data: null, ts: 0, err: null, inflight: false };
        state.malibu = { data: null, ts: 0, err: null, inflight: false };
        state.wallet = { data: null, ts: 0, err: null, inflight: false };
        state.authFailBySurface = {};
        state.proxyMissing = false;
        state.signinErr = null;
        state.signinMisconfigNotice = null;
        state.route = "dashboard";
        state.sidebarOpen = false;
        render();
        cookieJSON("/v1/auth/logout", { method: "POST", body: "{}" })
          .catch(function () { return null; })
          .then(function () { location.reload(); });
        return;
      }
      stopPollers();
      state.session = null;
      state.pool = { data: null, ts: 0, err: null, inflight: false };
      state.earn = { data: null, ts: 0, err: null, inflight: false };
      state.malibu = { data: null, ts: 0, err: null, inflight: false };
      state.wallet = { data: null, ts: 0, err: null, inflight: false };
      state.authFailBySurface = {};
      state.proxyMissing = false;
      state.signinErr = null;
      state.signinMisconfigNotice = null;
      state.route = "dashboard";
      state.sidebarOpen = false;
      render();
    }

    /* =====================================================================
     * GitHub auth mode
     * ===================================================================== */
    function githubStartURL(returnTo, pairOT) {
      var url = "/v1/auth/github/start?return_to=" + encodeURIComponent(returnTo);
      if (pairOT) url += "&pair_ot=" + encodeURIComponent(pairOT);
      return url;
    }

    function startGitHubOAuth(returnTo, pairOT) {
      location.assign(githubStartURL(returnTo, pairOT));
    }

    function initializeGitHubMode() {
      state.cookieFetch = makeCookieFetch();
      state.githubAuthState = "loading";
      render();
      if (location.pathname === "/claim") {
        return handleClaimRoute();
      }
      return loadGitHubHome();
    }

    function loadGitHubHome() {
      state.githubAuthState = "loading";
      state.claim = { phase: "idle", error: null, result: null };
      stopPollers();
      state.session = null;
      render();
      return cookieJSON("/v1/auth/me/providers", { method: "GET" })
        .then(function (r) {
          if (r.status === 401) {
            state.githubAuthState = "signin";
            render();
            return;
          }
          if (!r.ok) {
            state.githubAuthState = "signin";
            if (r.status === 404 || r.status >= 500) state.proxyMissing = true;
            render();
            return;
          }
          var providers = r.body && Array.isArray(r.body.providers) ? r.body.providers : [];
          state.githubProviders = providers;
          if (providers.length === 0) {
            state.githubAuthState = "waiting";
            state.route = "dashboard";
            render();
            return;
          }
          var wanted = new URL(location.href).searchParams.get("p");
          var selected = null;
          for (var i = 0; i < providers.length; i++) {
            if (providers[i] && providers[i].provider_id === wanted) selected = providers[i];
          }
          if (!selected && providers.length === 1) selected = providers[0];
          if (!selected) {
            state.githubAuthState = "providers";
            state.route = "dashboard";
            render();
            return;
          }
          selectGitHubProvider(selected.provider_id, false);
        })
        .catch(function () {
          state.githubAuthState = "signin";
          render();
        });
    }

    function selectGitHubProvider(providerId, pushRoute) {
      state.sessionGeneration += 1;
      state.session = { provider_id: providerId, provider_token: null };
      state.githubAuthState = "dashboard";
      state.route = "dashboard";
      state.pool = { data: null, ts: 0, err: null, inflight: false };
      state.earn = { data: null, ts: 0, err: null, inflight: false };
      state.malibu = { data: null, ts: 0, err: null, inflight: false };
      state.wallet = { data: null, ts: 0, err: null, inflight: false };
      if (pushRoute) {
        history.pushState({}, "", "/?p=" + encodeURIComponent(providerId));
      }
      render();
      startPollers();
    }

    function githubSessionExpired(returnTo) {
      state.sessionGeneration += 1;
      stopPollers();
      state.session = null;
      state.githubAuthState = "signin";
      render();
      startGitHubOAuth(returnTo || "/", null);
    }

    function handleClaimRoute() {
      state.githubAuthState = "claim";
      state.claim = { phase: "checking", error: null, result: null };
      render();
      return cookieJSON("/v1/auth/me/providers", { method: "GET" })
        .then(function (r) {
          if (r.status === 401) {
            startGitHubOAuth("/claim", PAIR_OT_CAPTURED);
            return;
          }
          if (!r.ok) {
            if (isProxyMisconfigurationStatus(r.status)) {
              state.proxyMissing = true;
              state.claim = { phase: "error", error: "proxy_missing", result: null };
            } else {
              state.claim = { phase: "error", error: "bad_request", result: null };
            }
            render();
            return;
          }
          return bindClaim();
        })
        .catch(function () {
          state.claim = { phase: "error", error: "network", result: null };
          render();
        });
    }

    function bindClaim() {
      state.claim = { phase: "binding", error: null, result: null };
      render();
      var body = PAIR_OT_CAPTURED ? { pair_ot: PAIR_OT_CAPTURED } : {};
      return cookieJSON("/v1/auth/me/providers/bind", {
        method: "POST",
        body: JSON.stringify(body),
      }).then(function (r) {
        if (r.ok) {
          state.claim = { phase: "success", error: null, result: r.body || {} };
          render();
          setTimeout(function () { location.assign("/"); }, 2000);
          return;
        }
        if (r.status === 401) {
          startGitHubOAuth("/claim", PAIR_OT_CAPTURED);
          return;
        }
        if (isProxyMisconfigurationStatus(r.status)) {
          state.proxyMissing = true;
          state.claim = { phase: "error", error: "proxy_missing", result: null };
          render();
          return;
        }
        var code = r.body && r.body.error ? r.body.error : "bad_request";
        state.claim = { phase: "error", error: code, result: null };
        render();
      }).catch(function () {
        state.claim = { phase: "error", error: "network", result: null };
        render();
      });
    }

    function isProxyMisconfigurationStatus(status) {
      return status === 404 || status >= 500;
    }

    /* =====================================================================
     * Copy-to-clipboard
     * ===================================================================== */
    function copyText(text, key) {
      var done = function () {
        state.copyEcho = key;
        render();
        setTimeout(function () {
          if (state.copyEcho === key) {
            state.copyEcho = null;
            render();
          }
        }, 1600);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
      } else {
        fallbackCopy(text);
        done();
      }
    }
    function fallbackCopy(text) {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "absolute";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (_) {}
      document.body.removeChild(ta);
    }

    /* =====================================================================
     * Renderers
     * ===================================================================== */
    function render() {
      var root = document.getElementById("app");
      if (!root) return;
      clear(root);
      if (state.configError) {
        root.appendChild(renderUnavailable_Config(state.configError));
        return;
      }
      if (state.flagFalse) {
        root.appendChild(renderUnavailable_FlagFalse());
        return;
      }
      if (!state.cfg) {
        root.appendChild(renderLoading());
        return;
      }
      if (state.signinErr && !state.session) {
        root.appendChild(renderSignIn());
        return;
      }
      if (state.cfg.github_oauth_enabled && !sessionUsesPortalBearer()) {
        if (state.githubAuthState === "signin") {
          root.appendChild(renderGitHubSignIn());
          return;
        }
        if (state.githubAuthState === "claim") {
          root.appendChild(renderClaim());
          return;
        }
        if (state.githubAuthState === "waiting" || state.githubAuthState === "providers" || state.githubAuthState === "dashboard") {
          root.appendChild(renderShell());
          return;
        }
        root.appendChild(renderLoading());
        return;
      }
      if (!state.session) {
        root.appendChild(renderSignIn());
        return;
      }
      root.appendChild(renderShell());
    }

    function renderLoading() {
      return el("div", { class: "signin-wrap" },
        el("div", { class: "signin-card" },
          el("p", { class: "h-sub" }, "Loading portal configuration…")));
    }

    function renderUnavailable_Config(errInfo) {
      return el("div", { class: "unavail-wrap" },
        el("div", { class: "unavail-card" },
          el("h1", null, "Portal unavailable"),
          el("p", null, "The Malibu dashboard is not ready right now. Open Malibu for local status and try the portal again later.")));
    }

    function renderUnavailable_FlagFalse() {
      return el("div", { class: "unavail-wrap" },
        el("div", { class: "unavail-card" },
          el("h1", null, "Portal unavailable"),
          el("p", null, "The Malibu dashboard is not available for this link. Open Malibu for local status and try again later.")));
    }

    function renderSignIn() {
      var card = el("div", { class: "signin-card" },
        brandLockup(),
        el("h1", null, "Your Mac"),
        el("p", { class: "h-sub" },
          "Open the portal link from Malibu. This page should not ask you to paste a token."),
        state.signinErr ? el("div", { class: "signin-err" }, state.signinErr) : null,
        state.signinMisconfigNotice
          ? el("div", { class: "signin-misconfig" }, state.signinMisconfigNotice)
          : null);
      return el("div", { class: "signin-wrap" }, card);
    }

    function renderGitHubSignIn() {
      var button = el("button", {
        class: "github-btn",
        onclick: function () { startGitHubOAuth("/", null); },
      }, "Continue with GitHub");
      var card = el("div", { class: "signin-card" },
        brandLockup(),
        el("h1", null, "Your Mac"),
        el("p", { class: "h-sub" }, "Sign in to view Macs linked to your GitHub account."),
        button,
        state.proxyMissing
          ? el("div", { class: "signin-misconfig" }, "The portal cannot reach Malibu sign-in right now. Try again later.")
          : null,
        el("div", { class: "signin-guide" },
          "New here? ",
          el("a", { href: "#install-guide" }, "See the install guide")));
      return el("div", { class: "signin-wrap" }, card);
    }

    function renderClaim() {
      var phase = state.claim.phase;
      var cardKids = [el("h1", null, "Link this Mac")];
      if (state.proxyMissing) {
        cardKids.push(renderProxyMissingBanner());
      }
      if (phase === "checking" || phase === "binding") {
        cardKids.push(el("p", { class: "h-sub" }, phase === "checking" ? "Checking your GitHub session…" : "Linking this Mac to your account…"));
      } else if (phase === "success") {
        var result = state.claim.result || {};
        cardKids.push(
          el("p", { class: "h-sub" }, "This Mac is linked."),
          el("div", { class: "claim-ok" }, "GitHub: ", result.github_login || "linked"),
          el("div", { class: "claim-ok" }, "Your Mac is linked."),
          el("p", { class: "h-sub" }, "Redirecting to your dashboard…"));
      } else {
        var msg = "Something went wrong. Try running malibu-cli claim again.";
        var withCopy = false;
        if (state.claim.error === "pair_ot_invalid") {
          msg = "This link expired. Run `malibu-cli claim` on your Mac for a fresh link.";
          withCopy = true;
        } else if (state.claim.error === "already_owned") {
          msg = "This Mac is already linked to a different account. Open Malibu for account help.";
        } else if (state.claim.error === "proxy_missing") {
          msg = "The portal cannot reach Malibu sign-in right now. Try again later.";
        }
        cardKids.push(el("p", { class: "h-sub" }, msg));
        if (withCopy) {
          cardKids.push(snippetNode("malibu-cli claim", "claim-refresh"));
        }
      }
      return el("div", { class: "signin-wrap" },
        el("div", { class: "signin-card claim-card" }, cardKids));
    }

    function renderWaitingForMac() {
      return el("div", null,
        el("h1", { class: "surface-title" }, "Dashboard"),
        el("div", { class: "panel" },
          el("h2", null, "Waiting for a Mac to come online"),
          el("p", null, "Install Malibu on a Mac. After install, your Mac will auto-open a browser to link itself."),
          snippetNode("curl -fsSL https://get.malibu.tech/install.sh | bash", "waiting-install")));
    }

    function renderProviderChooser() {
      var rows = state.githubProviders.map(function (p) {
        var pid = p && p.provider_id ? p.provider_id : "";
        return el("button", {
          class: "provider-row",
          onclick: function () { selectGitHubProvider(pid, true); },
        },
          el("span", null, "Your Mac"),
          el("span", { class: "sub" }, p && p.last_seen_at ? ("last seen " + p.last_seen_at) : "select"));
      });
      return el("div", null,
        el("h1", { class: "surface-title" }, "Dashboard"),
        el("div", { class: "panel" },
          el("h2", null, "Choose a Mac"),
          el("div", { class: "provider-list" }, rows)));
    }

    function renderShell() {
      var sidebar = renderSidebar();
      var topbar = el("div", { class: "topbar" },
        el("button", { class: "hamburger", onclick: function () { state.sidebarOpen = !state.sidebarOpen; render(); } }, "☰ Menu"),
        el("span", null, "Malibu"));
      var pane = el("div", { class: "surface-pane" });
      if (state.proxyMissing) {
        pane.appendChild(renderProxyMissingBanner());
      }
      if (sessionUsesGitHubCookie() && state.githubAuthState === "waiting") {
        pane.appendChild(renderWaitingForMac());
      } else if (sessionUsesGitHubCookie() && state.githubAuthState === "providers" && !state.session) {
        pane.appendChild(renderProviderChooser());
      } else {
        pane.appendChild(renderEarn());
      }
      var scrim = el("div", {
        class: "scrim" + (state.sidebarOpen ? " show" : ""),
        onclick: function () { state.sidebarOpen = false; render(); },
      });
      return el("div", { class: "shell" },
        sidebar,
        el("div", { class: "main" }, topbar, pane),
        scrim);
    }

    function renderSidebar() {
      var items = sessionUsesGitHubCookie() && !state.session
        ? []
        : [{ id: "dashboard", label: "Dashboard" }];
      var navNodes = items.map(function (it) {
        return el("button", {
          class: "nav-item" + (state.route === it.id ? " active" : ""),
          onclick: function () {
            state.route = it.id;
            state.sidebarOpen = false;
            render();
            earnFetch("dashboard");
            malibuFetch("dashboard");
            walletFetch("dashboard");
          },
        }, it.label);
      });
      return el("aside", { class: "sidebar" + (state.sidebarOpen ? " open" : "") },
        el("div", { class: "brand" }, brandLockup()),
        el("nav", { class: "nav" }, navNodes),
        el("div", { class: "nav-spacer" }),
        el("div", { class: "nav-footer" },
          el("button", { onclick: signOut }, "⏋ Sign out")));
    }

    function malibuNextAction(data, reasons) {

    var MALIBU_WITHDRAWAL_STATES = ["withdrawable", "held", "capped", "ineligible", "unavailable"];

    function normalizedMalibuRewardEligibility(data) {
      if (!data) return null;
      if (!data.reward_eligibility || typeof data.reward_eligibility !== "object") {
        reportMalibuRewardEligibilitySchemaDrift("", "reward_eligibility");
        return unavailableMalibuRewardEligibility("");
      }
      var e = data.reward_eligibility;
      var schema = typeof e.schema_version === "string" ? e.schema_version : "";
      if (schema !== MALIBU_REWARD_ELIGIBILITY_SCHEMA) {
        reportMalibuRewardEligibilitySchemaDrift(schema, "schema_version");
        return unavailableMalibuRewardEligibility(schema);
      }
      var reasons = Array.isArray(e.reasons) ? e.reasons : [];
      if (!containsValue(MALIBU_EARNING_STATES, e.earning_state)) {
        reportMalibuRewardEligibilitySchemaDrift(schema, "earning_state");
        return unavailableMalibuRewardEligibility(schema);
      }
      if (!containsValue(MALIBU_WITHDRAWAL_STATES, e.withdrawal_state)) {
        reportMalibuRewardEligibilitySchemaDrift(schema, "withdrawal_state");
        return unavailableMalibuRewardEligibility(schema);

      if (!containsValue(MALIBU_REWARD_REASONS, e.primary_reason)) {
        reportMalibuRewardEligibilitySchemaDrift(schema, "primary_reason");
        return unavailableMalibuRewardEligibility(schema);

      if (reasons.some(function (reason) { return !containsValue(MALIBU_REWARD_REASONS, reason); })) {
        reportMalibuRewardEligibilitySchemaDrift(schema, "reasons");
        return unavailableMalibuRewardEligibility(schema);
      }
      return {
        schema_version: schema,
        earning_state: e.earning_state,
        withdrawal_state: e.withdrawal_state,

    function miningHealthCodeFromRewardEligibility(eligibility, pool) {
      if (!eligibility) return null;
      switch (eligibility.primary_reason) {
        case "earning_verified_work": return "earning";
        case "eligible_idle_no_work": return "idle_no_work";
        case "held_provisional_trust_tier": return "trust_tier_provisional";
        case "held_provider_daily_cap": return "provider_daily_cap_held";
        case "held_wallet_daily_cap": return "wallet_daily_cap_held";
        case "held_demotion_cooldown": return "rewards_held";
        case "withdrawable_balance_available": return "trusted_withdrawable";
        case "missing_wallet_binding": return "wallet_missing";
        case "local_on_battery": return "local_on_battery";
        case "local_thermal_pressure": return "local_thermal_pressure";
        case "model_not_ready": return "local_model_preparing";
        case "withdrawable_no_balance":
          return pool && (pool.state === "ready" || pool.state === "draining")
            ? "idle_no_work" : "customer_availability_pending";
        default:
          return "reward_projection_unavailable";
      }
    }

    function computePortalMiningHealth() {
      var earn = state.earn.data;
      var malibu = state.malibu.data;
      var pool = state.pool.data;
      var idle = earn && earn.idle_prewarm ? earn.idle_prewarm : null;
      var skips = idle && idle.skips_by_reason_last_1h ? idle.skips_by_reason_last_1h : {};
      var reasons = malibu && Array.isArray(malibu.withdrawal_hold_reasons)
        ? malibu.withdrawal_hold_reasons : [];
      var eligibility = normalizedMalibuRewardEligibility(malibu);
      var code;
      if (pool && pool.state && pool.state !== "ready" && pool.state !== "draining") {
        code = "not_running";
      } else if (!earn || !malibu) {
        code = state.earn.inflight || state.malibu.inflight
          ? "customer_availability_pending" : "reward_projection_unavailable";
      } else if ((skips.on_battery || 0) > 0) {
        code = "local_on_battery";
      } else if ((skips.thermal_pressure || 0) > 0) {
        code = "local_thermal_pressure";
      } else if ((skips.model_not_loaded || 0) > 0) {
        code = "local_model_preparing";
      } else if (eligibility) {
        code = miningHealthCodeFromRewardEligibility(eligibility, pool);
      } else if (malibu.wallet_bound === false) {
        code = "wallet_missing";
      } else if (reasons.indexOf("per_wallet_daily_cap") !== -1) {
        code = "wallet_daily_cap_held";
      } else if (malibu.trust_tier === "provisional" ||
                 reasons.indexOf("trust_tier_provisional") !== -1) {
        code = "trust_tier_provisional";
      } else if (reasons.length || Number(malibu.held_malibu) > 0) {
        code = "rewards_held";
      } else if (Number(malibu.withdrawable_malibu) > 0) {
        code = "trusted_withdrawable";
      } else if (typeof earn.usdc_today === "number" && earn.usdc_today > 0) {
        code = "earning";
      } else if (pool && (pool.state === "ready" || pool.state === "draining")) {
        code = "idle_no_work";
      } else if (pool) {
        code = "not_running";
      } else {
        code = "customer_availability_pending";
      }
      var vocab = miningReasonVocabulary(code);
      var usdc = earn && typeof earn.usdc_today === "number" && isFinite(earn.usdc_today)
        ? fmtUSDC(earn.usdc_today) + " USDC today"
        : "USDC unavailable";
      var malibuLine = "MALIBU unavailable";
      if (malibu) {
        var withdrawable = Number(malibu.withdrawable_malibu);
        var held = Number(malibu.held_malibu);
        malibuLine = "MALIBU " +
          (isFinite(withdrawable) ? withdrawable.toFixed(2) + " withdrawable" : "n/a withdrawable") +
          " / " +
          (isFinite(held) ? held.toFixed(2) + " held" : "n/a held");
      }
      var rewardSummary = usdc + " · " + malibuLine;
      var trustSummary = "Trust status unavailable";
      if (malibu) {
        trustSummary = "Trust: " + (
          typeof malibu.trust_tier === "string" && malibu.trust_tier.trim()
            ? malibu.trust_tier : "n/a"
        );
        if (typeof malibu.trust_criteria_met === "number" &&
            typeof malibu.trust_criteria_required === "number") {
          trustSummary += " · " + malibu.trust_criteria_met + " of " +
            malibu.trust_criteria_required + " criteria met";
        }
      }
      var action = eligibility ? malibuRewardNextAction(eligibility.primary_reason) : vocab.action;
      if (eligibility &&
          eligibility.primary_reason === "held_provisional_trust_tier" &&
          malibu &&
          typeof malibu.trust_criteria_met === "number" &&
          typeof malibu.trust_criteria_required === "number" &&
          malibu.trust_criteria_required > malibu.trust_criteria_met) {
        action = "Complete " + (malibu.trust_criteria_required - malibu.trust_criteria_met) +
          " more trust criteria to unlock withdrawals.";
      }
      if (!eligibility && malibu && (reasons.length ||
          code === "trust_tier_provisional" ||
          code === "provider_daily_cap_held" ||
          code === "wallet_daily_cap_held")) {
        action = malibuNextAction(malibu, reasons);
      }
      return {
        code: code,
        displayReasonCode: eligibility ? eligibility.primary_reason : code,
        status: vocab.status,
        reason: eligibility ? malibuRewardReasonCopy(eligibility.primary_reason) : vocab.reason,
        action: action,
        rewardSummary: rewardSummary,
        trustSummary: trustSummary,
      };
    }

    function normalizedProviderWalletStatus(data) {

        return providerWalletStatusUnavailable(data, "schema_version");

      var driftField = providerWalletStatusV1DriftField(data);
      if (driftField) return providerWalletStatusUnavailable(data, driftField);

    function providerWalletStatusUnavailable(data, field) {
      if (typeof console !== "undefined" && typeof console.warn === "function") {
        console.warn("provider_wallet_status_schema_drift", {
          schema_version: data && data.schema_version ? data.schema_version : "missing",
          field: field

    function providerWalletStatusV1DriftField(data) {
      if (!isPlainObject(data)) return "body";
      if (!nonEmptyString(data.provider_id)) return "provider_id";
      if (typeof data.wallet_bound !== "boolean") return "wallet_bound";
      if (typeof data.wallet_mismatch !== "boolean") return "wallet_mismatch";
      if (Object.prototype.hasOwnProperty.call(data, "hold_or_mismatch_reason") && !nonEmptyString(data.hold_or_mismatch_reason)) {
        return "hold_or_mismatch_reason";

      if (data.payout_wallet != null) {
        var payoutWalletDrift = providerPayoutWalletDriftField(data.payout_wallet);
        if (payoutWalletDrift) return "payout_wallet." + payoutWalletDrift;
      }
      var rewardWalletDrift = providerRewardWalletDriftField(data.reward_wallet);
      if (rewardWalletDrift) return "reward_wallet." + rewardWalletDrift;
      var rewardAmountsDrift = providerRewardAmountsDriftField(data.reward_amounts);
      if (rewardAmountsDrift) return "reward_amounts." + rewardAmountsDrift;
      var inputsDrift = providerEligibilityInputsDriftField(data.eligibility_inputs);
      if (inputsDrift) return "eligibility_inputs." + inputsDrift;
      var rewardEligibilityDrift = providerRewardEligibilityDriftField(data.reward_eligibility);
      if (rewardEligibilityDrift) return "reward_eligibility." + rewardEligibilityDrift;
      var auditDrift = providerRewardAuditDriftField(data.audit);
      if (auditDrift) return "audit." + auditDrift;
      return "";
    }

    function providerPayoutWalletDriftField(wallet) {
      if (!isPlainObject(wallet)) return "body";
      var requiredStringFields = ["chain", "address", "verification_source"];
      for (var i = 0; i < requiredStringFields.length; i++) {
        if (!nonEmptyString(wallet[requiredStringFields[i]])) return requiredStringFields[i];
      }
      if (typeof wallet.payout_allowed !== "boolean") return "payout_allowed";
      var optionalStringFields = [
        "pending_until_utc",
        "rotated_from",
        "registered_at_utc",
        "registered_against_hot_wallet",
        "last_update_utc",
      ];
      for (var j = 0; j < optionalStringFields.length; j++) {
        var field = optionalStringFields[j];
        if (Object.prototype.hasOwnProperty.call(wallet, field) && !nonEmptyString(wallet[field])) return field;
      }
      return "";
    }

    function providerRewardWalletDriftField(wallet) {
      if (!isPlainObject(wallet)) return "body";
      if (Object.prototype.hasOwnProperty.call(wallet, "address") && !nonEmptyString(wallet.address)) return "address";
      if (!nonEmptyString(wallet.verification_source)) return "verification_source";
      if (Object.prototype.hasOwnProperty.call(wallet, "last_update_utc") && !nonEmptyString(wallet.last_update_utc)) {
        return "last_update_utc";
      }
      if (typeof wallet.cap_replay_pending !== "boolean") return "cap_replay_pending";
      return "";

    function providerRewardAmountsDriftField(amounts) {
      if (!isPlainObject(amounts)) return "body";
      var decimalFields = [
        "accrued_malibu",
        "withdrawable_malibu",
        "held_malibu",
        "provider_daily_cap_malibu",
        "provider_day_malibu",
        "wallet_daily_cap_malibu",
        "wallet_day_malibu",
      ];
      for (var i = 0; i < decimalFields.length; i++) {

      if (typeof amounts.provider_daily_capped !== "boolean") return "provider_daily_capped";
      if (typeof amounts.wallet_daily_capped !== "boolean") return "wallet_daily_capped";
      return "";
    }

    function providerEligibilityInputsDriftField(inputs) {
      if (!isPlainObject(inputs)) return "body";
      var stringFields = ["trust_tier", "receipt_quality", "compute_integrity_state", "attestation_tier"];
      for (var i = 0; i < stringFields.length; i++) {
        if (!nonEmptyString(inputs[stringFields[i]])) return stringFields[i];
      }
      var intFields = ["verified_receipt_count", "required_receipt_count", "criteria_met", "criteria_required"];
      for (var j = 0; j < intFields.length; j++) {
        if (!Number.isInteger(inputs[intFields[j]])) return intFields[j];
      }
      if (typeof inputs.quarantined !== "boolean") return "quarantined";
      if (typeof inputs.app_attested !== "boolean") return "app_attested";
      if (typeof inputs.wallet_balance_ok !== "boolean") return "wallet_balance_ok";
      if (typeof inputs.uptime_ok !== "boolean") return "uptime_ok";
      if (!Array.isArray(inputs.economic_criteria)) return "economic_criteria";
      if (!Array.isArray(inputs.additional_criteria)) return "additional_criteria";
      return "";
    }

    function providerRewardEligibilityDriftField(eligibility) {
      if (!isPlainObject(eligibility)) return "body";
      if (eligibility.schema_version !== MALIBU_REWARD_ELIGIBILITY_SCHEMA) return "schema_version";
      if (!containsValue(MALIBU_EARNING_STATES, eligibility.earning_state)) return "earning_state";
      if (!containsValue(MALIBU_WITHDRAWAL_STATES, eligibility.withdrawal_state)) return "withdrawal_state";
      if (!containsValue(MALIBU_REWARD_REASONS, eligibility.primary_reason)) return "primary_reason";
      if (!Array.isArray(eligibility.reasons)) return "reasons";
      if (eligibility.reasons.some(function (reason) { return !containsValue(MALIBU_REWARD_REASONS, reason); })) return "reasons";
      return "";
    }

	    function providerRewardAuditDriftField(audit) {
	      if (!isPlainObject(audit)) return "body";
	      if (!Array.isArray(audit.events)) return "events";
	      if (Object.prototype.hasOwnProperty.call(audit, "next_before_id") && !nonEmptyString(audit.next_before_id)) {
	        return "next_before_id";
	      }
	      for (var i = 0; i < audit.events.length; i++) {
	        var eventDrift = providerRewardAuditEventDriftField(audit.events[i]);
	        if (eventDrift) return "events[" + i + "]." + eventDrift;
	      }
	      return "";
	    }

	    function providerRewardAuditEventDriftField(evt) {
	      if (!isPlainObject(evt)) return "body";
	      var stringFields = ["id", "occurred_at", "event_type", "summary"];
	      for (var i = 0; i < stringFields.length; i++) {
	        if (!nonEmptyString(evt[stringFields[i]])) return stringFields[i];
	      }
	      if (Object.prototype.hasOwnProperty.call(evt, "ledger_id") && !Number.isInteger(evt.ledger_id)) {
	        return "ledger_id";
	      }
	      if (Object.prototype.hasOwnProperty.call(evt, "amount_malibu") && !finiteDecimalField(evt, "amount_malibu")) {
	        return "amount_malibu";
	      }
	      var optionalStringFields = ["withdrawal_hold_reason", "trust_tier", "source_reason"];
	      for (var j = 0; j < optionalStringFields.length; j++) {
	        var field = optionalStringFields[j];
	        if (Object.prototype.hasOwnProperty.call(evt, field) && !nonEmptyString(evt[field])) return field;
	      }
	      return "";
	    }

    function isPlainObject(value) {
      return !!value && typeof value === "object" && !Array.isArray(value);
    }

    function nonEmptyString(value) {
      return typeof value === "string" && value.trim() !== "";
    }

    function finiteDecimalField(obj, field) {
      if (!Object.prototype.hasOwnProperty.call(obj, field)) return false;
      var value = obj[field];
      if (value === null) return false;
      if (typeof value !== "number" && typeof value !== "string") return false;
      if (typeof value === "string" && value.trim() === "") return false;
      return Number.isFinite(Number(value));
    }

    function truncateWalletAddress(address) {
      if (typeof address !== "string") return "";
      var trimmed = address.trim();
      if (trimmed.length < 12) return trimmed;
      return trimmed.slice(0, 6) + "…" + trimmed.slice(-4);
    }

    /* ---- Dashboard ---- */
    function dashPayoutAddress() {
      var raw = state.wallet.data;
      if (!raw) return "";
      var normalized = normalizedProviderWalletStatus(raw);
      if (normalized && !normalized.unavailable && normalized.payout_wallet &&
          typeof normalized.payout_wallet.address === "string") {
        return normalized.payout_wallet.address;
      }
      if (raw.payout_wallet && typeof raw.payout_wallet.address === "string") {
        return raw.payout_wallet.address;
      }
      return "";
    }

    function decimalNumber(value) {
      if (value === null || value === undefined) return NaN;
      var n = Number(value);
      return isFinite(n) ? n : NaN;
    }

    function formatMalibuBare(value) {
      var n = decimalNumber(value);
      return isFinite(n) ? n.toFixed(2) : "n/a";
    }

    function dashboardMalibuTodayLine(earn, malibu, eligibility) {
      var today = earn && Object.prototype.hasOwnProperty.call(earn, "malibu_today")
        ? decimalNumber(earn.malibu_today)
        : NaN;
      if (!isFinite(today) && malibu && Object.prototype.hasOwnProperty.call(malibu, "malibu_today")) {
        today = decimalNumber(malibu.malibu_today);
      }
      if (!isFinite(today)) {
        return malibu ? "MALIBU daily not reported yet" : "n/a MALIBU today";
      }
      if (eligibility) {
        if (eligibility.withdrawal_state === "capped") {
          return today.toFixed(2) + " MALIBU today (capped)";
        }
        if (eligibility.withdrawal_state === "held" || eligibility.withdrawal_state === "ineligible") {
          return today.toFixed(2) + " MALIBU today (locked)";
        }
        if (eligibility.withdrawal_state === "unavailable") {
          return "MALIBU today unavailable";
        }
      }
      return today.toFixed(2) + " MALIBU today";
    }

    function dashboardMalibuLine(earn, malibu, eligibility) {
      if (!malibu && state.malibu.inflight) return "MALIBU …";
      if (!malibu) return "";
      var allTime = isFinite(decimalNumber(malibu.accrued_malibu))
        ? formatMalibuBare(malibu.accrued_malibu) + " all-time"
        : "n/a all-time";
      return dashboardMalibuTodayLine(earn, malibu, eligibility) + " · " + allTime;
    }

    function dashboardTrustLine(malibu) {
      if (!malibu || typeof malibu.trust_tier !== "string" || !malibu.trust_tier.trim()) return "";
      var tier = malibu.trust_tier.trim().toLowerCase();
      var label = tier === "trusted" ? "Trusted" :
        (tier === "provisional" ? "Provisional" : malibu.trust_tier.trim());
      if (tier === "provisional" &&
          typeof malibu.trust_criteria_met === "number" &&
          typeof malibu.trust_criteria_required === "number") {
        label += " · " + malibu.trust_criteria_met + " of " + malibu.trust_criteria_required;
      }
      return label;
    }

    function dashStatusClass(health) {
      switch (health.code) {
        case "earning":
        case "trusted_withdrawable":
          return "ok";
        case "wallet_missing":
        case "trust_tier_provisional":
        case "wallet_daily_cap_held":
        case "provider_daily_cap_held":
        case "rewards_held":
        case "local_on_battery":
        case "local_thermal_pressure":
        case "not_running":
        case "provider_paused":
        case "provider_error":
          return "warn";
        default:
          return "idle";
      }
    }

    function dashNeedsAttention(health) {
      return dashStatusClass(health) === "warn";
    }

    function dashboardEligibilityCopy(eligibility) {
      if (!eligibility) return "";
      switch (eligibility.primary_reason) {
        case "earning_verified_work": return "Earning MALIBU from verified work";
        case "eligible_idle_no_work": return "";
        case "held_provisional_trust_tier": return "MALIBU unlocks at Trusted.";
        case "held_wallet_daily_cap": return "MALIBU above the wallet daily limit is held.";
        case "held_provider_daily_cap": return "MALIBU above the daily limit is held.";
        case "held_demotion_cooldown": return "MALIBU is held while trust is rechecked.";
        case "missing_wallet_binding": return "Add a payout wallet in Malibu.";
        default: return "";
      }
    }

    function renderEarn() {
      var d = state.earn.data;
      var malibu = state.malibu.data;
      var loading = state.earn.inflight && !d;
      var health = computePortalMiningHealth();
      var today = d && typeof d.usdc_today === "number" ? fmtUSDC(d.usdc_today) : (loading ? "…" : "—");
      var week = d && typeof d.usdc_week === "number" ? fmtUSDC(d.usdc_week) : (loading ? "…" : "n/a");
      var pending = d && typeof d.usdc_pending === "number" ? fmtUSDC(d.usdc_pending) : (loading ? "…" : "n/a");
      var life = d && typeof d.usdc_lifetime === "number" ? fmtUSDC(d.usdc_lifetime) : (loading ? "…" : "n/a");
      var eligibility = normalizedMalibuRewardEligibility(malibu);
      var hold = eligibility && rewardStatusIsHold(eligibility.primary_reason);
      var eligCopy = dashboardEligibilityCopy(eligibility);
      var malibuLine = dashboardMalibuLine(d, malibu, eligibility);
      var addr = dashPayoutAddress();
      var kids = [
        el("div", { class: "dash-head" },
          el("div", { class: "dash-status " + dashStatusClass(health) }, health.status),
          el("div", { class: "dash-trust" }, dashboardTrustLine(malibu))),
        el("div", { class: "dash-hero" },
          el("div", { class: "dash-kicker" }, "Today"),
          el("div", { class: "dash-amt mono" }, today),
          el("div", { class: "dash-sub" }, week + " wk · " + pending + " accrued · " + life + " life"),
          el("div", { class: "dash-note" }, "Accrued — payouts open in beta")),
      ];
      if (malibuLine) kids.push(el("div", { class: "dash-malibu" }, malibuLine));
      if (eligCopy) {
        kids.push(el("div", { class: hold ? "dash-note hold" : "dash-note" }, eligCopy));
      }
      if (addr) {
        kids.push(el("div", { class: "dash-wallet mono" }, "Payout wallet " + truncateWalletAddress(addr)));
      } else if (malibu && malibu.wallet_bound === false) {
        kids.push(el("div", { class: "dash-note hold" }, "Add a payout wallet in Malibu."));
      }
      if (dashNeedsAttention(health) && health.reason) {
        kids.push(el("div", { class: "dash-exception" },
          el("div", { class: "ex-reason" }, health.reason),
          health.action ? el("div", { class: "ex-action" }, health.action) : null));
      }
      return el("div", { class: "dash" }, kids);
    }

    /* =====================================================================
     * Formatting
     * ===================================================================== */
    function fmtUSDC(n) {
      if (typeof n !== "number" || !isFinite(n)) return "—";
      var digits = (n !== 0 && Math.abs(n) < 0.01) ? 4 : 2;
      try {
        return "$" + n.toLocaleString("en-US", { minimumFractionDigits: digits, maximumFractionDigits: digits });
      } catch (_) {
        return "$" + n.toFixed(digits);
      }
    }

    function consumePortalSessionFromURL() {
      var token = PORTAL_SESSION_CAPTURED;
      PORTAL_SESSION_CAPTURED = "";
      if (!token) return Promise.resolve(false);
      state.sessionGeneration += 1;
      state.session = { provider_id: "", provider_token: token };
      state.githubAuthState = "dashboard";
      state.signinErr = null;
      state.route = "dashboard";
      render();
      return coordFetch(PORTAL_SESSION_PATH, { auth: true, surface: "dashboard" })
        .then(function (r) {
          if (!r.ok || !r.body || !r.body.provider_id) {
            state.session = null;
            state.signinErr = "This portal link expired. Ask Malibu for a new one.";
            render();
            return false;
          }
          state.session.provider_id = r.body.provider_id;
          render();
          startPollers();
          return true;
        })
        .catch(function () {
          state.session = null;
          state.signinErr = "This portal link expired. Ask Malibu for a new one.";
          render();
          return false;
        });
    }

    /* =====================================================================
     * Bootstrap
     * ===================================================================== */
    function bootstrap() {
      render();
      return loadConfig().then(function () {
        if (PORTAL_SESSION_CAPTURED) {
          return consumePortalSessionFromURL().then(function (opened) {
            if (!opened) render();
          });
        }
        if (state.cfg && state.cfg.github_oauth_enabled) {
          return initializeGitHubMode();
        }
        return consumePortalSessionFromURL().then(function (opened) {
          if (!opened) render();
        });
      }, function () {
        render();
      });
    }

    window.addEventListener("popstate", function () {
      if (state.cfg && state.cfg.github_oauth_enabled) {
        loadGitHubHome();
      }
    });

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", bootstrap);
    } else {
      bootstrap();
    }
  </script>
</body>
</html>
