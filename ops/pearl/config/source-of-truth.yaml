schema_version: pearl-config-source-v1
issue: 785
description: >
  Pearl coordinator config source-of-truth classification for read-only drift
  reconciliation. This manifest classifies ownership; it is not a migration
  plan and must not be used to overwrite live production config.

pearl:
  ssh_target: pearl
  files:
    base_product_defaults:
      repo_path: phase4-coordinator/dist/coordinator.yaml
      live_path: /opt/macprovider/coordinator.yaml
      owner: base_product_defaults
    production_overlay:
      live_path: /etc/macprovider/coordinator.pearl-overlays.yaml
      owner: pearl_production_overlay
      repo_mirror: manifest-only
      note: >
        Overlay contents can contain production-only posture. PR B tracks
        ownership here without checking a non-secret mirror into the repo.
    secrets_env:
      live_path: /etc/macprovider/coordinator.env
      owner: pearl_operator_secrets
      values: never_log

tracked_base_owned_prefixes:
  - listen
  - coordinator.require_gateway_context
  - pool
  - routing
  - provider_http
  - limits
  - relay
  - auth.require_provider_tokens
  - auth.allow_tokenless_provisional_bootstrap
  - referrals
  - explorer
  - stats
  - onboarding
  - storage
  - logging
  - autotune
  - rewards.rate_card
  - rewards.global_multiplier
  - rewards.provider_share
  - admission
  - tier2

fleet_version_policy_owned_prefixes:
  - coordinator_advertised_version

pearl_overlay_owned_prefixes: []

known_config_drift:
  - path: auth.credential_bootstrap_identity_retention_s
    drift_kind: tracked_only
    tracked: 604800
    owner: base_product_defaults
    category: Evidence
    classification: intentional Pearl production posture
    rationale: Live Pearl base config omits this newly explicit YAML field; the coordinator code default supplies the same bounded credential-bootstrap retention policy.
  - path: auth.credential_bootstrap_mints_global_hour
    drift_kind: tracked_only
    tracked: 128
    owner: base_product_defaults
    category: Evidence
    classification: intentional Pearl production posture
    rationale: Live Pearl base config omits this newly explicit YAML field; the coordinator code default supplies the same global credential-bootstrap rate limit.
  - path: auth.credential_bootstrap_mints_per_id_hour
    drift_kind: tracked_only
    tracked: 3
    owner: base_product_defaults
    category: Evidence
    classification: intentional Pearl production posture
    rationale: Live Pearl base config omits this newly explicit YAML field; the coordinator code default supplies the same identity-scoped credential-bootstrap rate limit.
  - path: auth.credential_bootstrap_mints_per_ip_hour
    drift_kind: tracked_only
    tracked: 8
    owner: base_product_defaults
    category: Evidence
    classification: intentional Pearl production posture
    rationale: Live Pearl base config omits this newly explicit YAML field; the coordinator code default supplies the same source-IP credential-bootstrap rate limit.
  - path: auth.credential_bootstrap_outstanding_max
    drift_kind: tracked_only
    tracked: 64
    owner: base_product_defaults
    category: Evidence
    classification: intentional Pearl production posture
    rationale: Live Pearl base config omits this newly explicit YAML field; the coordinator code default supplies the same outstanding bootstrap custody bound.
  - path: auth.credential_bootstrap_token_ttl_s
    drift_kind: tracked_only
    tracked: 600
    owner: base_product_defaults
    category: Evidence
    classification: intentional Pearl production posture
    rationale: Live Pearl base config omits this newly explicit YAML field; the coordinator code default supplies the same short-lived bootstrap token TTL.
  - path: auth.credential_bootstrap_unconfirmed_max
    drift_kind: tracked_only
    tracked: 64
    owner: base_product_defaults
    category: Evidence
    classification: intentional Pearl production posture
    rationale: Live Pearl base config omits this newly explicit YAML field; the coordinator code default supplies the same unconfirmed bootstrap identity bound.
  - path: autotune.public_keys.streamvc-autotune-static-v5
    drift_kind: tracked_only
    tracked: "vpTgWfvvrnbc1QhdTAxULFisoDU7jQ4mB1yZIHIGjBA="
    owner: fleet_version_admission_policy
    category: Evidence
    classification: fleet/version-admission policy
    rationale: Static-feed trust admission is controlled by reviewed fleet/version policy; Pearl live has not yet admitted the v5 public key in base config.
  - path: pool.heartbeat_interval_s
    drift_kind: value_mismatch
    tracked: 30
    live: 1
    owner: pearl_production_overlay
    category: Evidence
    classification: intentional Pearl production posture
    rationale: Current Pearl runtime posture; PR C should migrate it field-scope into the overlay.
  - path: coordinator_advertised_version.latest_binary_version
    drift_kind: value_mismatch
    tracked: "1.8.66"
    live: "1.8.61"
    owner: fleet_version_admission_policy
    category: Evidence
    classification: fleet/version-admission policy
    rationale: Capability-gated recommendation policy drift is classified for operator review.
  - path: coordinator_advertised_version.required_binary_version
    drift_kind: tracked_only
    tracked: "1.8.33"
    owner: fleet_version_admission_policy
    category: Evidence
    classification: fleet/version-admission policy
    rationale: Hard admission floor exists in tracked source; absence live is classified until PR C.
  - path: referrals.campaign
    drift_kind: tracked_only
    tracked: ""
    owner: base_product_defaults
    category: Evidence
    classification: overlay-owned Pearl production setting
    rationale: The checked-in default is campaign-empty; Pearl's live referral campaign, when enabled, is owned by the production overlay.
  - path: referrals.challenge_ttl_s
    drift_kind: tracked_only
    tracked: 900
    owner: base_product_defaults
    category: Evidence
    classification: overlay-owned Pearl production setting
    rationale: The checked-in referral default is supplied by code defaults when omitted from live base; Pearl-specific campaign timing is overlay-owned.
  - path: referrals.current_key_id
    drift_kind: tracked_only
    tracked: ""
    owner: base_product_defaults
    category: Evidence
    classification: overlay-owned Pearl production setting
    rationale: The checked-in default is intentionally empty; Pearl's active key id is overlay-owned and must not be inferred from base YAML absence.
  - path: referrals.enable_join_links
    drift_kind: tracked_only
    tracked: false
    owner: base_product_defaults
    category: Evidence
    classification: overlay-owned Pearl production setting
    rationale: The checked-in public join-link gate stays default-off; Pearl's campaign gate posture is overlay-owned.
  - path: referrals.enable_public_validation
    drift_kind: tracked_only
    tracked: false
    owner: base_product_defaults
    category: Evidence
    classification: overlay-owned Pearl production setting
    rationale: The checked-in validation gate stays default-off; Pearl's campaign gate posture is overlay-owned.
  - path: referrals.enable_social_invite_bonus
    drift_kind: tracked_only
    tracked: false
    owner: base_product_defaults
    category: Evidence
    classification: overlay-owned Pearl production setting
    rationale: The checked-in social bonus gate stays default-off; Pearl's campaign gate posture is overlay-owned.
  - path: referrals.grandfather_before
    drift_kind: tracked_only
    tracked: ""
    owner: base_product_defaults
    category: Evidence
    classification: overlay-owned Pearl production setting
    rationale: The checked-in default is no grandfather cutoff; Pearl's campaign cutoff, when present, is overlay-owned.
  - path: referrals.hmac_keys
    drift_kind: tracked_only
    tracked: {}
    owner: pearl_operator_secrets
    category: Evidence
    classification: secrets/env-owned setting
    rationale: The checked-in base never carries referral HMAC material; Pearl secrets are env-owned and may be referenced by the overlay.
  - path: referrals.join_base_url
    drift_kind: tracked_only
    tracked: "https://malibu.tech/j"
    owner: base_product_defaults
    category: Evidence
    classification: overlay-owned Pearl production setting
    rationale: The checked-in referral join authority is the product default; Pearl campaign overlay may restate the same authority.
  - path: referrals.policy_version
    drift_kind: tracked_only
    tracked: "v1"
    owner: base_product_defaults
    category: Evidence
    classification: overlay-owned Pearl production setting
    rationale: The checked-in referral policy version is the product default; Pearl campaign overlay owns active campaign versioning.
  - path: referrals.provider_base_uses
    drift_kind: tracked_only
    tracked: 1
    owner: base_product_defaults
    category: Evidence
    classification: overlay-owned Pearl production setting
    rationale: The checked-in referral base-use count is supplied by code defaults when omitted from live base; Pearl campaign use limits are overlay-owned.
  - path: referrals.request_access_url
    drift_kind: tracked_only
    tracked: ""
    owner: base_product_defaults
    category: Evidence
    classification: overlay-owned Pearl production setting
    rationale: The checked-in default omits a request-access URL; Pearl campaign UX URL is overlay-owned when set.
  - path: referrals.require_for_registration
    drift_kind: tracked_only
    tracked: false
    owner: base_product_defaults
    category: Evidence
    classification: overlay-owned Pearl production setting
    rationale: The checked-in registration gate stays default-off; Pearl's campaign gate posture is overlay-owned.
  - path: referrals.social_bonus_uses
    drift_kind: tracked_only
    tracked: 2
    owner: base_product_defaults
    category: Evidence
    classification: overlay-owned Pearl production setting
    rationale: The checked-in social bonus count is supplied by code defaults when omitted from live base; Pearl campaign use limits are overlay-owned.
  - path: referrals.social_verification_dwell_s
    drift_kind: tracked_only
    tracked: 1800
    owner: base_product_defaults
    category: Evidence
    classification: overlay-owned Pearl production setting
    rationale: The checked-in dwell default is supplied by code defaults when omitted from live base; Pearl campaign timing is overlay-owned.
  - path: referrals.x_api_bearer_token
    drift_kind: tracked_only
    tracked: ""
    owner: pearl_operator_secrets
    category: Evidence
    classification: secrets/env-owned setting
    rationale: The checked-in base never carries the X API bearer credential; Pearl secrets are env-owned and may be referenced by the overlay.

