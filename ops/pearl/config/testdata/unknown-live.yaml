  warmup_gate_enabled: false
routing:
  request_timeout_s: 999
diagnostics:
  debug_label: sk-redaction-sentinel-not-for-output
auth:
  operator_key: env:inline-redaction-sentinel-not-for-output
  gateway_service_token: env:GATEWAY_SERVICE_TOKEN
