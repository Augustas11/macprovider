# SPEC-017 v0.1.8 — depguard import-graph lint (AC-16).
#
# Two distinct boundaries enforced (BUILD §D.2 + §D.3):
#
#   1. Request-path packages (internal/stats, internal/stats/store,
#      internal/stats/migrations) MUST NOT import internal/billing,
#      internal/explorer, internal/ws, or internal/auth (no
#      Bearer-parser allowlist symbol in Step 1 since handlers do
#      not exist yet; Step 3 will add a named allowlist entry
#      here when it lands the BearerToken helper).
#
#   2. Rollup package (internal/stats/rollup) MAY import
#      billing/session/pool read-only paths (the §4.2 carve-out)
#      but MUST NOT import internal/explorer (an operator-only
#      admin surface; SPEC AC-16 names it in the forbidden set)
#      or internal/ws, and MUST NOT import internal/stats or
#      internal/stats/store (the rollup is the writer side;
#      handlers are the reader side; they share only the DB).
#
# Additionally, os.Exit / log.Fatal / log.Fatalf are forbidden
# anywhere under internal/stats/* to preserve the §7.3
# recover-middleware guarantee (BUILD §D.3). The forbidigo
# linter catches the latter; depguard catches the former.

run:
  timeout: 5m

linters:
  default: none
  enable:
    - depguard
    - forbidigo

linters-settings:
  depguard:
    rules:
      stats-request-path:
        list-mode: lax
        files:
          - "**/internal/stats/*.go"
          - "**/internal/stats/store/**/*.go"
          - "**/internal/stats/migrations/**/*.go"
        deny:
          - pkg: github.com/augstar/macprovider-coordinator/internal/billing
            desc: SPEC-017 AC-16 — request-path packages must not import internal/billing
          - pkg: github.com/augstar/macprovider-coordinator/internal/explorer
            desc: SPEC-017 AC-16 — request-path packages must not import internal/explorer
          - pkg: github.com/augstar/macprovider-coordinator/internal/ws
            desc: SPEC-017 AC-16 — request-path packages must not import internal/ws
          - pkg: github.com/augstar/macprovider-coordinator/internal/auth
            desc: SPEC-017 AC-16 — request-path packages must not import internal/auth (Step 3 adds a named Bearer-parser allowlist; Step 1 forbids the whole package)
      stats-rollup:
        list-mode: lax
        files:
          - "**/internal/stats/rollup/**/*.go"
        deny:
          - pkg: github.com/augstar/macprovider-coordinator/internal/explorer
            desc: SPEC-017 AC-16 — rollup must not import internal/explorer (operator-only admin surface)
          - pkg: github.com/augstar/macprovider-coordinator/internal/ws
            desc: SPEC-017 AC-16 — rollup must not import internal/ws
          - pkg: github.com/augstar/macprovider-coordinator/internal/stats
            desc: SPEC-017 AC-16 — rollup is the writer side; handlers are the reader side; they share only the database
          - pkg: github.com/augstar/macprovider-coordinator/internal/stats/store
            desc: SPEC-017 AC-16 — rollup must not import the read-side DAO

  forbidigo:
    forbid:
      - pattern: 'os\.Exit'
        msg: "SPEC-017 §7.3 — internal/stats/* must not call os.Exit; propagate errors to cmd/coordinator/main.go"
      - pattern: 'log\.Fatal'
        msg: "SPEC-017 §7.3 — internal/stats/* must not call log.Fatal/log.Fatalf"
      - pattern: 'log\.Fatalf'
        msg: "SPEC-017 §7.3 — internal/stats/* must not call log.Fatalf"
    exclude_godoc_examples: false
    analyze-types: false

issues:
  exclude-rules:
    # forbidigo's os.Exit / log.Fatal rules only apply inside
    # internal/stats/*. Allow the existing patterns elsewhere
    # (cmd/coordinator/main.go uses os.Exit by design — it IS the
    # process-termination owner per §7.3).
    - path-except: "internal/stats/.*\\.go"
      linters:
        - forbidigo

  max-issues-per-linter: 0
  max-same-issues: 0
