# coordinator.malibu-emission-overlay.yaml — Session C4 Pearl overlay
#
# Mounts MALIBU accrual read API (writer_dsn) while keeping accrual ticks
# disabled until operator promotion. Merge with any existing Pearl overlay
# (e.g. OPoI canaries) before install — deploy script does this automatically.
#
# Promotion requires enabled:true plus one issuance mode. Keep epoch_enabled:false
# until the SPEC-021 v0.4 epoch policy engine ships; legacy bootstrap ticks require
# bootstrap_tick_enabled:true. Useful-work v0.2 rewards remain separately gated by
# useful_work_enabled. Rollback: set enabled:false or remove this overlay block.

malibu_emission:
  enabled: false
  bootstrap_tick_enabled: false
  epoch_enabled: false
  writer_dsn: env:MALIBU_EMISSION_WRITER_DSN
  tick_interval_seconds: 900
  useful_work_enabled: false
  useful_work_interval_seconds: 900
  provider_daily_cap_malibu: 25
  wallet_daily_cap_malibu: 100
  useful_work_malibu_per_1000_provider_credits: 1
  wallet_mirror_interval_seconds: 300
  unlock_eval_interval_seconds: 3600
  max_serializable_retries: 5
