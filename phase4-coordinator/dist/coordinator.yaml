      prompt_credits_per_mtok: 13500         # $0.0135/M (same small-dense lane as Llama 3.1 8B)
      prompt_cache_hit_credits_per_mtok: 3375 # $0.003375/M prefix-cache hit
      completion_credits_per_mtok: 27000     # $0.027/M
    qwen2.5-coder-32b-instruct:              # v3 expansion — M-Max/Ultra only per Entry 92 admission gate
      prompt_credits_per_mtok: 425000        # $0.425/M
      prompt_cache_hit_credits_per_mtok: 106250 # $0.10625/M prefix-cache hit
      completion_credits_per_mtok: 850000    # $0.850/M (RESEARCH_227 dev-coding premium, dense 32B UX painful on M-base)

# SPEC-015 / SPEC-022 settlement policy.
#
# `verified_model_settlement_mode: enforce` makes the coordinator require a
# valid route snapshot at dispatch and gates the verified-receipt -> billable
# credit upgrade on a settled=verified verdict. The alternative, `observe`
# (the code default), records snapshots/verdicts but admits credits without a
# verified settlement and silently skips on any route-snapshot prereq miss.
#
# Enforce is safe here ONLY because PR #833 (commit f9c5db19) removed the
# len(body)/4 prompt-token cap from the settlement evidence tuple. Before that
# fix, token-dense chat templates (Llama-3.2/3.1, gpt-oss) quarantined on
# `usage_mismatch`; after it, the live Pearl DB shows normal_done receipts at
# 100% verified across all providers/models (203/203 Llama-3.2-3B, 29/29
# Qwen3-8B, 28/28 Qwen3-Coder-30B) and 0 usage_mismatch network-wide, with a
# measured enforce-dispatch rejection risk of 1/267 successful requests (0.4%,
# a no-charge/refund path, though the buyer may see a transient HTTP 500). See the rollout runbook
# ops/runbooks/settlement-enforce-rollout.md.
#
# Instant rollback WITHOUT a redeploy: set
# `settlement: { verified_model_settlement_mode: observe }` in the Pearl
# overlay /etc/macprovider/coordinator.pearl-overlays.yaml (overlay keys win
# over this base) and restart the coordinator.
settlement:
  verified_model_settlement_mode: enforce

# Admission tier (SPEC-002 v1.1.2 § 7.1 amendment to F-2).
# Pinned providers are enumerated below in `providers:`. Provisional
# providers connect dynamically (curl-install path) up to these caps.
admission:
  provisional_admission_rate_per_hour: 10
  provisional_pool_max: 100
  provisional_quota_per_hour: 100
  provisional_tier_weight: 0.3

tier2:
  catalog_path: /opt/macprovider/autotune/current/tier2-catalog.json
  catalog_public_key: IVH2aAlTudARJSK3e7XGmcGjxAqwm6lReGiS-0U9aFQ
  require_hash_verified: true
  # SPEC-015 v0.3 §M.4 — absolute base URL the coordinator advertises
  # as `catalog_url` / `catalog_pubkey_url` in /poolz when a catalog
  # is effectively active. Empty → falls back to scheme + request Host.
  # Entry 191: physical snapshot-manifest providers are release-bound and
  # hash verification is enforced fail-closed.
  public_catalog_base_url: "https://coordinator.streamvc.live"

# Enumerated PINNED providers (SPEC-002 v1.0.4 Finding F-2: every pinned
# provider_id MUST be listed here). Pearl's owned Mac stays WS-tunneled by
# leaving endpoint_url empty; unlisted providers remain provisional and are
# admitted dynamically per `admission` config above.
providers:
  - provider_id: "mac"
    endpoint_url: ""
    display_name: "Pearl Mac provider"

# Auto-update recommendation surface (2026-07-03 — added post-#332 to unblock air5 v1.7.0 -> v1.7.9)
#
# S-H1 (2026-07-15): `latest_binary_version` is CAPABILITY-GATED server-side.
# It is emitted as `recommended_binary_version` (autoupdate target) ONLY to
# providers that declare a `compatibility_set_id` in their hello (v1.8.33+,
# whose CLI-owned updater performs full signed compatibility-set transactions).
# Pre-compatibility-set providers (<=1.8.32) never receive it — their default
# binary-only autoupdater would otherwise self-swap into a mixed install. The
# operator-assisted full installer is the ONLY sanctioned upgrade path for that
# legacy cohort (DECISION_CRITERIA Entry 161). Setting this value does not, and
# must not, re-arm the legacy binary-only updater.
#
# `required_binary_version` (issue #767) is the HARD admission floor: a hello
# below it is closed with 4004 version_unsupported. Prior to #767 it was set
# nowhere in prod, so seam 5's floor existed only in code.
#
# WHY 1.8.33 and not something higher: 1.8.33 is the first release that
# declares a `compatibility_set_id` in its hello — the boundary this file
# already documents above. Everything at or below 1.8.32 is the legacy
# pre-compatibility-set cohort that (a) receives no autoupdate
# recommendation by design, and (b) cannot satisfy the live Pearl overlay's
# `coordinator.compatibility_set.accepted_ids` gate because it sends no set
# id at all. So the floor fences nobody who is currently admissible; it makes
# the already-true rejection explicit and machine-readable instead of leaving
# a legacy build to fail later, opaquely, on catalog admission.
#
# It is deliberately pinned to the previous stable recommendation (1.8.81)
# until the signed 1.8.82 assets have been published and byte-identity
# verified, and remains below the
# #610 first-hop bridge build (1.8.48, which is additionally exempt from the
# floor by construction — see prepareProviderAdmission's firstHopOnly skip),
# so raising it is a separate, deliberate act. Raise it only in lockstep with
# a fleet-wide upgrade: a below-floor CLI carrying the #767 handler stops
# reconnecting and tells its operator to upgrade, and one without it
# reconnect-loops.
coordinator_advertised_version:
  latest_binary_version: "1.8.81"
  required_binary_version: "1.8.33"
