# /etc/nginx/sites-available/coordinator.streamvc.live
#
# Reverse-proxy fronting the Mac Provider coordinator on Pearl VPS.
# Buyer HTTP -> 127.0.0.1:8443
# Provider WS + admin + healthz -> 127.0.0.1:8444
#
# The Pearl VPS's existing nginx site (pearlrouter-observer) remains the
# default_server on port 80 for `_`. This site matches by server_name
# only, so it does NOT interfere with Pearl traffic.

# M1-4 / SECU-1: rate- and conn-limit /ws/provider identically to the api
# vhost's buyer routes (see nginx-api.streamvc.live.conf:10-11). Pre-fix,
# coordinator's /ws/provider was unrate-limited at nginx and the only
# backstop was a global 64-slot unauthenticated-conn semaphore in Go with
# no per-IP dimension; one host could starve all provider readmissions
# (full inference outage at N=3). 10 req/min/IP with burst=5; 5 concurrent
# unauthenticated WS conns/IP, matching api vhost.
#
# The `ws_provider_*` and `referral_*_rate` zones are declared in the
# api.streamvc.live vhost (nginx-api.streamvc.live.conf) and live in the http
# context — nginx makes them visible across every vhost on the same instance.
# The referral zones keep dashboard polling and social mutations from spending
# the scarce WebSocket handshake budget or starving fresh-invite validation.
# Re-declaring them here breaks `nginx -t` with
# "limit_conn_zone is already bound" (Pearl, 2026-06-11 deploy). The
# directives below REFERENCE the shared zones; they are not redeclared.
# If this coordinator vhost is ever deployed to a host where the api vhost is
# NOT present, declare every referenced `limit_req` and `limit_conn` zone in
# that host's nginx http context before enabling this site.

# Port 80: only used for ACME http-01 challenge and to redirect to https.
server {
    listen 80;
    listen [::]:80;
    server_name coordinator.streamvc.live;

    # ACME http-01 challenge (served via webroot for certbot certonly --webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Invite URLs are reusable credentials. Redirect to TLS without recording
    # the path or any query parameter in the nginx access log.
    location ^~ /j/ {
        access_log off;
        return 301 https://$host$request_uri;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Port 443: production TLS endpoint.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name coordinator.streamvc.live;

    # TLS — the deploy script (deploy-pearl-vps.sh step 6b) installs this
    # vhost only AFTER the cert exists at /etc/letsencrypt/live/<domain>/,
    # so these can ship uncommented. (Issue #244: previously commented +
    # uncommented via sed; if the sed step was skipped the deploy left
    # production HTTPS broken.)
    ssl_certificate /etc/letsencrypt/live/coordinator.streamvc.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coordinator.streamvc.live/privkey.pem;

    # Reasonable defaults.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Larger upload allowance — buyer requests can be long contexts (~50K tokens).
    client_max_body_size 8M;

    # SPEC-015 AC-15: receipt headers are capped at 4096 ASCII bytes.
    # Keep nginx request/response header buffers above that cap so the
    # gateway can forward X-MacProvider-Receipt without truncation.
    large_client_header_buffers 4 8k;
    proxy_buffer_size 8k;
    proxy_buffers 4 8k;

    # No timeout on the *connection* — SSE streams may run 300s.
    keepalive_timeout 360s;

    # ---------------------------------------------------------------------
    # /healthz — public, no auth, on coordinator's provider_port (8444).
    # Cheap probe target for Cloudflare/Pingdom/etc.
    # ---------------------------------------------------------------------
    location = /healthz {
        proxy_pass http://127.0.0.1:8444/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    # ---------------------------------------------------------------------
    # /ws/provider — WebSocket upgrade for Phase 3 binaries connecting in.
    # MUST proxy to provider_port (8444). Requires Upgrade/Connection
    # headers; nginx must NOT buffer.
    # ---------------------------------------------------------------------
    location = /ws/provider {
        # M1-4 / SECU-1: per-IP rate + concurrency caps. Matches the api
        # vhost block (nginx-api.streamvc.live.conf:124-134).
        limit_req zone=ws_provider_rate burst=5 nodelay;
        limit_conn ws_provider_conn 5;
        limit_req_status 429;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8444/ws/provider;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WS connections are long-lived (heartbeat every 30s); set read
        # timeout well above heartbeat interval. SPEC-002 disconnect_grace
        # is 30s, but we tolerate 5min of silence here (heartbeats keep
        # the connection alive on the WS layer regardless).
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # No buffering — WS frames must pass through promptly.
        proxy_buffering off;
    }

    # ---------------------------------------------------------------------
    # /v2/provider — SPEC-026 App-track WebSocket URL returned by
    # /v1/providers/register. Proxies to the existing coordinator
    # /ws/provider handler and keeps the same WS rate/concurrency posture.
    # ---------------------------------------------------------------------
    location = /v2/provider {
        limit_req zone=ws_provider_rate burst=5 nodelay;
        limit_conn ws_provider_conn 5;
        limit_req_status 429;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8444/ws/provider;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # ---------------------------------------------------------------------
    # /poolz, /admin/* — operator endpoints, auth-gated by coordinator.
    # Live on provider_port (8444) per SPEC-002 v1.0.4 § 7.4 (Finding F-3).
    # Bearer token check happens INSIDE the coordinator; nginx just proxies.
    # ---------------------------------------------------------------------
    location = /poolz {
        proxy_pass http://127.0.0.1:8444/poolz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 15s;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8444;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 30s;
    }

    # ---------------------------------------------------------------------
    # /v1/receipt-keys/<provider_id> — public buyer endpoint per SPEC-002
    # v1.5 candidate annotation + SPEC-015 §10.7. UNAUTHENTICATED. Lives on
    # buyer_port (8443), NOT operator port. Rate-limited inside the
    # coordinator (10 req/s per remote IP, 4 KiB max response, redacted to
    # exactly {provider_id, receipt_pubkey, receipt_pubkey_prev, fetched_at}).
    # MUST be declared BEFORE the catch-all `location /v1/` 404 block so the
    # location-prefix longest-match rule routes receipt-keys requests here.
    # ---------------------------------------------------------------------
    location /v1/receipt-keys/ {
        proxy_pass http://127.0.0.1:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
    }

    # ---------------------------------------------------------------------
    # /v1/pool/check — public provider visibility endpoint per SPEC-002.
    # Lives on the coordinator buyer mux (8443), not the provider/admin mux.
    # MUST be declared BEFORE the catch-all `location /v1/` 404 block so
    # installers and operator smoke tests can distinguish "not in pool" from
    # "nginx route missing".
    # ---------------------------------------------------------------------
    location = /v1/pool/check {
        proxy_pass http://127.0.0.1:8443/v1/pool/check$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    # ---------------------------------------------------------------------
    # /catalog/current, /catalog/<catalog_id>, and /catalog/pubkey —
    # public buyer endpoints
    # per SPEC-002 v1.6 candidate annotation + SPEC-015 v0.3 §M.4.
    # UNAUTHENTICATED. Lives on buyer_port (8443), NOT operator port.
    # Same posture as /v1/receipt-keys/: rate-limited inside the
    # coordinator (shared with receipt-keys, 10 req/s per remote IP),
    # Cache-Control: public, max-age=300 set by the handler. The catalog
    # file itself is a signed JSON blob produced by scripts/sign-catalog.go;
    # the pubkey response is a small JSON object
    # ({"pubkey":"<43-char base64url>","alg":"Ed25519"}). 404 when no
    # catalog is configured / the requested catalog_id is unknown.
    # MUST be declared BEFORE the catch-all `location /` 404 block.
    # ---------------------------------------------------------------------
    location /catalog/ {
        proxy_pass http://127.0.0.1:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
    }

    # ---------------------------------------------------------------------
    # /v1/rate-card — public read-only recommendation projection per
    # SPEC-023. Lives on the coordinator buyer mux (8443), not the
    # provider/admin mux. This exposes only recommendation economics
    # derived from the active rewards config and stats USD conversion.
    # MUST be declared BEFORE the catch-all `location /v1/ { return 404; }`.
    # ---------------------------------------------------------------------
    location = /v1/rate-card {
        proxy_pass http://127.0.0.1:8443/v1/rate-card$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    # ---------------------------------------------------------------------
    # /v1/demand-rank and /v1/autotune-candidates (+ .sig) — SPEC-023
    # signed recommendation feeds on the buyer mux (8443). Replaces the
    # former nginx /static/ alias to /opt/macprovider/static/. Deploy
    # installs literal signed bytes into /opt/macprovider/autotune/ and
    # the coordinator loads them at startup. Cache-Control: 5 min max-age
    # matches /v1/rate-card cadence.
    # MUST be declared BEFORE the catch-all `location /v1/ { return 404; }`.
    # ---------------------------------------------------------------------
    location = /v1/demand-rank {
        proxy_pass http://127.0.0.1:8443/v1/demand-rank$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }
    location = /v1/demand-rank.sig {
        proxy_pass http://127.0.0.1:8443/v1/demand-rank.sig$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }
    location = /v1/autotune-candidates {
        proxy_pass http://127.0.0.1:8443/v1/autotune-candidates$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }
    location = /v1/autotune-candidates.sig {
        proxy_pass http://127.0.0.1:8443/v1/autotune-candidates.sig$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    # ---------------------------------------------------------------------
    # /v1/providers/register — SPEC-026 App-track register endpoint.
    # Public, but disabled in the coordinator unless
    # onboarding.app_track_register_enabled=true. Lives on the buyer mux
    # (8443), not provider/admin mux. MUST be declared before the /v1/
    # catch-all so initial app onboarding can reach the coordinator while
    # normal buyer API traffic still enters through the gateway.
    # ---------------------------------------------------------------------
    location = /v1/providers/register {
        proxy_pass http://127.0.0.1:8443/v1/providers/register;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 10s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }

    # ---------------------------------------------------------------------
    # /v1/providers/hardware-evidence — provider-token authenticated autotune
    # hardware evidence queue. Lives on buyer_port (8443), not the provider
    # mux. Declared before the /v1/ catch-all so configured CLIs can submit
    # local evidence for out-of-band stats verification.
    # ---------------------------------------------------------------------
    location = /v1/providers/hardware-evidence {
        limit_req zone=ws_provider_rate burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8443/v1/providers/hardware-evidence;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 10s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        client_max_body_size 128k;
        add_header Cache-Control "no-store" always;
    }

    # ---------------------------------------------------------------------
    # /v1/provider/wallet — App-track wallet changes are intentionally
    # blocked until SPEC-027 defines non-bearer proof of ownership.
    # Proxies to the buyer mux so the coordinator returns the explicit
    # 501 wallet_change_requires_spec_027 body instead of the generic
    # /v1/ catch-all.
    # ---------------------------------------------------------------------
    location = /v1/provider/wallet {
        proxy_pass http://127.0.0.1:8443/v1/provider/wallet;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 10s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }

    # ---------------------------------------------------------------------
    # /v1/provider/malibu-accrual — MALIBU accrual read API (Session C3/C4).
    # Lives on buyer_port (8443). Provider bearer auth.
    # ---------------------------------------------------------------------
    location = /v1/provider/malibu-accrual {
        proxy_pass http://127.0.0.1:8443/v1/provider/malibu-accrual;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 10s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }

    # ---------------------------------------------------------------------
    # Referral admission and provider advocacy APIs. These are intentionally
    # narrow exceptions to the /v1/ deny-by-default rule below. All live on
    # the buyer mux (8443), are bounded at nginx and in-process, and must never
    # be cached. The provider routes forward only the Authorization header;
    # referral codes and X challenges stay in bounded request bodies.
    # ---------------------------------------------------------------------
    location = /v1/referrals/validate {
        limit_req zone=referral_validate_rate burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8443/v1/referrals/validate;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        client_max_body_size 2k;
        add_header Cache-Control "no-store" always;
    }

    location = /v1/provider/referrals {
        limit_req zone=referral_status_rate burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8443/v1/provider/referrals;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 10s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        client_max_body_size 2k;
        add_header Cache-Control "no-store" always;
    }

    location = /v1/provider/referrals/x/challenge {
        limit_req zone=referral_social_rate burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8443/v1/provider/referrals/x/challenge;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 10s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        client_max_body_size 2k;
        add_header Cache-Control "no-store" always;
    }

    location = /v1/provider/referrals/x/verify {
        limit_req zone=referral_social_rate burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8443/v1/provider/referrals/x/verify;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 10s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        client_max_body_size 4k;
        add_header Cache-Control "no-store" always;
    }

    # Durable invite landing links live on the buyer mux. The path contains a
    # referral credential, so neither nginx access logs nor caches may retain it.
    location ^~ /j/ {
        access_log off;
        proxy_pass http://127.0.0.1:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }

    # ---------------------------------------------------------------------
    # SPEC-017 v0.1.8 Step 4.B — /v1/stats/* allow-through. Public
    # Network Stats API endpoints, mounted on the coordinator's
    # provider port (8444) per main.go:525. The dedicated vhost
    # `stats.streamvc.live` serves the same endpoints under its
    # own server_name; this allow-through lets clients hit them
    # under coordinator.streamvc.live too without changing DNS.
    #
    # MUST be declared BEFORE the catch-all `location /v1/ { return
    # 404; }` block (longest-match wins for prefix locations).
    # Rate-limit zones, cache directives, and Authorization handling
    # are the SAME as the stats vhost — see nginx-stats.streamvc.live.conf
    # for the http-context declarations of $public_rl_key,
    # stats_overview/leaderboard/health zones, and stats_public
    # cache zone. Those declarations live at the http level so they
    # are visible to every vhost on the instance.
    # ---------------------------------------------------------------------
    location = /v1/stats/overview {
        limit_req zone=stats_overview burst=59 nodelay;
        limit_req_status 429;
        error_page 429 = @stats_rate_limited;

        include /etc/nginx/conf.d/stats-proxy-public.conf;

        proxy_pass http://127.0.0.1:8444;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 10s;

        proxy_cache              stats_public;
        proxy_cache_valid 200    30s;
        proxy_cache_use_stale    error timeout updating;
        proxy_cache_bypass       $http_authorization;
        proxy_cache_bypass       $arg_deploy_smoke;
        proxy_no_cache           $http_authorization;
        proxy_no_cache           $arg_deploy_smoke;
    }

    location = /v1/stats/leaderboard {
        limit_req zone=stats_leaderboard burst=59 nodelay;
        limit_req_status 429;
        error_page 429 = @stats_rate_limited;

        include /etc/nginx/conf.d/stats-proxy-partner.conf;

        proxy_pass http://127.0.0.1:8444;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 15s;

        proxy_cache              stats_public;
        proxy_cache_valid 200    30s;
        proxy_cache_use_stale    error timeout updating;
        proxy_cache_bypass       $http_authorization;
        proxy_cache_bypass       $arg_deploy_smoke;
        proxy_no_cache           $http_authorization;
        proxy_no_cache           $arg_deploy_smoke;
    }

    location ~ ^/v1/stats/provider/[^/]+$ {
        limit_req zone=stats_provider burst=59 nodelay;
        limit_req_status 429;
        error_page 429 = @stats_rate_limited;

        include /etc/nginx/conf.d/stats-proxy-partner.conf;

        proxy_pass http://127.0.0.1:8444;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 15s;

        proxy_cache_bypass       1;
        proxy_no_cache           1;
    }

    location = /v1/stats/health {
        limit_req zone=stats_health burst=59 nodelay;
        limit_req_status 429;
        error_page 429 = @stats_rate_limited;

        include /etc/nginx/conf.d/stats-proxy-public.conf;

        proxy_pass http://127.0.0.1:8444;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 10s;

        proxy_cache              stats_public;
        proxy_cache_valid 200    30s;
        proxy_cache_use_stale    error timeout updating;
        proxy_cache_bypass       $http_authorization;
        proxy_cache_bypass       $arg_deploy_smoke;
        proxy_no_cache           $http_authorization;
        proxy_no_cache           $arg_deploy_smoke;
    }

    # ---------------------------------------------------------------------
    # /v1/* is intentionally not exposed on the coordinator hostname.
    # Buyer API traffic must enter through the gateway so account auth,
    # quota enforcement, demo restrictions, and header allowlisting apply.
    # The referral exceptions above are the intentionally public admission and
    # provider-authenticated advocacy surfaces. The /v1/receipt-keys/ exception
    # above is per SPEC-015 v0.2 — the
    # verifier MUST be able to fetch trust-root pubkeys without operator
    # credentials. The /v1/stats/* exceptions above are per SPEC-017 v0.1.8.
    # ---------------------------------------------------------------------
    location /v1/ {
        return 404;
    }

    # ---------------------------------------------------------------------
    # /internal/* (sticky purge, routing-metadata probe) is gateway-only by
    # design. Bound to providerMux on port 8444, bearer-protected with the
    # operator key, and reached only via the loopback hop from the gateway
    # process. NEVER expose publicly: even with bearer auth the surface is
    # operator-internal and not buyer-safe.
    # Defense-in-depth: explicit 404 prevents accidental future exposure via
    # a wildcard `location /` change or a regex proxy_pass. Keep this block;
    # do NOT replace with a proxy_pass to 127.0.0.1:8444.
    # ---------------------------------------------------------------------
    location /internal/ {
        return 404;
    }

    # SPEC-017 v0.1.8 Step 4.B round-3 ARCH H1 fix — nginx-tier 429
    # for /v1/stats/* returns the locked §5.9 JSON envelope rather
    # than a bare nginx 429 body. Mirrors the same named location
    # in the stats vhost.
    location @stats_rate_limited {
        internal;
        default_type application/json;
        # Round-4 SECURITY M2: see nginx-stats.streamvc.live.conf
        # for the inheritance-trap rationale. Same snippet, same
        # location-merge behavior here.
        include /etc/nginx/conf.d/stats-security-headers.conf;
        include /etc/nginx/conf.d/cors-429.conf;
        add_header Cache-Control "no-store" always;
        return 429 '{"error":{"code":"rate_limited","message":"rate limited","retry_after_seconds":60}}';
    }

    # Everything else -> 404
    location / {
        return 404;
    }
}
