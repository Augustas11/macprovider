# Public /v1/stats/* proxy locations (overview, health).
#
# Emit exactly one Access-Control-Allow-Origin at the edge.
# The coordinator also sets ACAO in-process; duplicate values
# (e.g. upstream + edge add_header) break browser fetch entirely.
include /etc/nginx/conf.d/stats-security-headers.conf;
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header X-Stats-Rate-Limit;
add_header Access-Control-Allow-Origin "*" always;
