# SPEC-017 v0.1.8 Step 4.B — security-header snippet for the
# /v1/stats/* response surface.
#
# Round-4 SECURITY r2 M2 (per
# specs/SPEC-017-IMPL-STEP_4B-security-r2-audit.md) — any
# location-level `add_header` directive in nginx shadows the
# server-level `add_header` set, dropping inherited headers
# silently. See [[nginx-add-header-inheritance-trap]] in the
# operator's memory and the documented pattern in
# `frontdoor/console/dist/nginx-snippets/console-security-headers.conf`.
#
# Step 4.B's `@stats_rate_limited` named location declares
# `add_header Retry-After ...` and `add_header Cache-Control
# ...` to comply with the locked §5.9 envelope. Including THIS
# snippet at the same scope restores X-Content-Type-Options,
# X-Frame-Options, and Referrer-Policy so future server-level
# additions (CSP, HSTS) cannot regress silently. The `always`
# parameter applies them to all responses including 429.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options        "DENY"    always;
add_header Referrer-Policy        "no-referrer" always;
