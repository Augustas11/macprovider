# SPEC-017 v0.1.8 Step 4.B — shared http-context declarations.
#
# Included at the http {} context (via /etc/nginx/conf.d/stats-shared.conf
# or sites-enabled symlink ordering) so BOTH the stats vhost and the
# coordinator vhost can reference these names without each vhost
# re-declaring them (re-declaration is an nginx -t error class:
# "limit_req_zone <name> is already bound" / "duplicate proxy_cache_path").
#
# Round-3 CODE C1 (per specs/SPEC-017-IMPL-STEP_4B-code-r1-audit.md): the
# coordinator vhost references `stats_overview` / `stats_leaderboard` /
# `stats_health` zones plus `stats_public` cache. Before this snippet
# existed those declarations lived only in nginx-stats.streamvc.live.conf,
# so a deploy that installed only the coordinator vhost would have
# broken `nginx -t`. Moving the declarations into this shared snippet
# decouples the dependency.
#
# Operator install: copy to /etc/nginx/conf.d/ before either vhost is
# enabled (deploy-pearl-vps.sh installs this file along with both
# vhosts).

# Authorization-aware public-tier rate-limit keying. Empty key for
# Authorization-bearing requests → nginx skips counting (the locked
# §5.6 v0.1.8 keyed-traffic-bypasses-public-limiter contract).
map $http_authorization $public_rl_key {
    ""      $binary_remote_addr;
    default "";
}

# Per-endpoint zones — separate names so /overview, /leaderboard,
# /provider/<id>, and /health do NOT share quota.
limit_req_zone $public_rl_key zone=stats_overview:10m    rate=60r/m;
limit_req_zone $public_rl_key zone=stats_leaderboard:10m rate=60r/m;
limit_req_zone $public_rl_key zone=stats_provider:10m    rate=60r/m;
limit_req_zone $public_rl_key zone=stats_health:10m      rate=60r/m;

# Coordinator-owned public referral validation. This declaration lives in the
# same deploy-managed http-context snippet as the coordinator's other shared
# zones so the vhost has no dependency on a separately deployed gateway site.
limit_req_zone $binary_remote_addr zone=referral_validate_rate:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=referral_provider_rate:10m rate=60r/m;

# Cache for the public projection only. SECURITY r5 C1: paired
# `proxy_no_cache $http_authorization` + `proxy_cache_bypass
# $http_authorization` directives in every stats location keep the
# partner-key projection out of this cache.
proxy_cache_path /var/cache/nginx/stats levels=1:2 keys_zone=stats_public:10m
                 max_size=128m inactive=300s use_temp_path=off;

# Access-log format with Authorization explicitly absent. The default
# `combined` format would carry $http_authorization indirectly; this
# explicit form makes the audit-lane sweep cheap (single grep).
log_format stats_redacted '$remote_addr - - [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"-" "$http_user_agent" '
                          'rt=$request_time uct="$upstream_connect_time" '
                          'uht="$upstream_header_time" urt="$upstream_response_time"';
