# /etc/nginx/sites-available/stats.streamvc.live
#
# SPEC-017 v0.1.8 Step 4.B — public Network Stats API edge vhost.
#
# This vhost fronts the Mac Provider coordinator's
# /v1/stats/{overview,leaderboard,health} endpoints. Same binary
# also serves /v1/stats/* on coordinator.streamvc.live (see the
# /v1/stats/ allow-through block in nginx-coordinator.streamvc.live.conf).
# Both surfaces proxy to 127.0.0.1:8444 — the coordinator's
# provider port, where Step 3 mounts the in-process mux.
#
# SPEC §5.6 v0.1.8 rate-limit posture: hard 60 req/min per (IP,
# endpoint) tuple at the public tier. Per-endpoint zones are
# mandatory (v12 CODE r11 002) so /overview, /leaderboard, and
# /health do NOT share quota. Authorization-bearing requests bypass
# the public limiter at the edge (in-process limiter caps them);
# the partner-tier 600 rpm/key/endpoint and the auth-failure tier
# 300 rpm/IP/endpoint both run IN PROCESS per SPEC §5.4.7.
#
# 22-AC sweep reconciliation (2026-06-26): the public-tier
# `limit_req` directives carry `burst=59 nodelay` so an
# initially-empty leaky bucket admits the first 60 anonymous
# requests immediately (1 in-rate token + 59 burst capacity =
# 60) and 429s the 61st with `nodelay`. This matches AC-8's
# "60 succeed, 61st 429s" contract while preserving the §5.6
# "60 req/min" sustained rate — once the burst capacity is
# spent, refill is strict 1/sec (= 60/min). It does NOT amplify
# long-term throughput.
#
# SECURITY r5 C1 — partner-key projection (exact $ per provider)
# MUST never persist at the edge. We set BOTH `proxy_cache_bypass`
# (read-bypass) AND `proxy_no_cache` (write-suppression) on
# $http_authorization.

# Round-3 CODE C1 fix — the shared http-context declarations
# (`$public_rl_key` map, `stats_overview/leaderboard/health` zones,
# `stats_public` cache, `stats_redacted` log format) now live in
# `nginx-snippets/stats-shared.conf`, installed at
# `/etc/nginx/conf.d/stats-shared.conf` so both vhosts can
# reference them without redeclaration.

# Port 80: ACME challenge + redirect to https.
server {
    listen 80;
    listen [::]:80;
    server_name stats.streamvc.live;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Port 443: production TLS endpoint.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stats.streamvc.live;

    # TLS — the deploy script (deploy-pearl-vps.sh step 6b) installs this
    # vhost only AFTER the cert exists at /etc/letsencrypt/live/<domain>/,
    # so these can ship uncommented. (Issue #244 — see coordinator vhost
    # for the full rationale.)
    ssl_certificate /etc/letsencrypt/live/stats.streamvc.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stats.streamvc.live/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # SPEC-017 responses are JSON, capped well under 32 KiB even
    # at the 7-day leaderboard limit. The 8K buffers from the
    # coordinator vhost are more than enough.
    client_max_body_size       64k;
    large_client_header_buffers 4 8k;
    proxy_buffer_size           8k;
    proxy_buffers               4 8k;

    # Access-log: redacted format declared in the shared snippet.
    access_log /var/log/nginx/stats.streamvc.live-access.log stats_redacted;
    error_log  /var/log/nginx/stats.streamvc.live-error.log  warn;

    # Round-3 ARCH H1 fix — nginx-tier 429 returns the locked §5.9
    # JSON envelope + Retry-After header, not the bare nginx HTML.
    # All stats locations route 429 through this named location via
    # `error_page 429 = @stats_rate_limited;`.
    #
    # The body matches the coordinator's in-process limiter output
    # (Step 3 `writeError` → codeRateLimited) so clients see one
    # consistent shape regardless of which tier fired the 429.
    location @stats_rate_limited {
        internal;
        default_type application/json;
        # Round-4 SECURITY M2: include the security-headers snippet
        # BEFORE the response-specific add_headers below; nginx
        # merges add_header directives WITHIN one location, so
        # both sets land on the 429 response. Without the snippet
        # the location-level add_headers below would shadow any
        # future server-level security headers (X-Content-Type-
        # Options, HSTS) per [[nginx-add-header-inheritance-trap]].
        include /etc/nginx/conf.d/stats-security-headers.conf;
        add_header Retry-After "60" always;
        add_header Cache-Control "no-store" always;
        return 429 '{"error":{"code":"rate_limited","message":"rate limited","retry_after_seconds":60}}';
    }

    # ---------------------------------------------------------------------
    # /v1/stats/overview — locked SPEC §5.1 snapshot + 30-min timeseries.
    # ---------------------------------------------------------------------
    location = /v1/stats/overview {
        limit_req zone=stats_overview burst=59 nodelay;
        limit_req_status 429;
        error_page 429 = @stats_rate_limited;

        proxy_pass http://127.0.0.1:8444;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 10s;

        proxy_cache              stats_public;
        proxy_cache_valid 200    30s;
        proxy_cache_use_stale    error timeout updating;
        # SECURITY r5 C1: both directives are MANDATORY. The first
        # makes nginx SKIP cache reads when Authorization is
        # present; the second SUPPRESSES cache writes for the same
        # responses. proxy_cache_bypass alone would still WRITE.
        proxy_cache_bypass       $http_authorization;
        proxy_no_cache           $http_authorization;
    }

    # ---------------------------------------------------------------------
    # /v1/stats/leaderboard — locked SPEC §5.2; public vs partner-key
    # projection differs (Step 3 handler emits per request).
    # ---------------------------------------------------------------------
    location = /v1/stats/leaderboard {
        limit_req zone=stats_leaderboard burst=59 nodelay;
        limit_req_status 429;
        error_page 429 = @stats_rate_limited;

        proxy_pass http://127.0.0.1:8444;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 15s;

        proxy_cache              stats_public;
        proxy_cache_valid 200    30s;
        proxy_cache_use_stale    error timeout updating;
        proxy_cache_bypass       $http_authorization;
        proxy_no_cache           $http_authorization;
    }

    # ---------------------------------------------------------------------
    # /v1/stats/health — locked SPEC §5.3 component map.
    # ---------------------------------------------------------------------
    location = /v1/stats/health {
        limit_req zone=stats_health burst=59 nodelay;
        limit_req_status 429;
        error_page 429 = @stats_rate_limited;

        proxy_pass http://127.0.0.1:8444;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 10s;

        proxy_cache              stats_public;
        proxy_cache_valid 200    30s;
        proxy_cache_use_stale    error timeout updating;
        proxy_cache_bypass       $http_authorization;
        proxy_no_cache           $http_authorization;
    }

    # Anything else under /v1/stats/* → 404 from nginx so the
    # coordinator never sees unknown subpaths. Step 3 already
    # 404s these; the explicit edge block keeps the log surface
    # small.
    location /v1/stats/ {
        return 404;
    }

    # Everything else → 404 (this vhost only serves the three
    # locked SPEC endpoints).
    location / {
        return 404;
    }
}
