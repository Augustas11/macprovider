# /etc/nginx/sites-available/stats.streamvc.live
#
# SPEC-017 v0.1.8 Step 4.B — public Network Stats API edge vhost.
#
# This vhost fronts the Mac Provider coordinator's
# /v1/stats/{overview,leaderboard,health} endpoints. Same binary
# also serves /v1/stats/* on coordinator.streamvc.live (see the
# /v1/stats/ allow-through block in nginx-coordinator.streamvc.live.conf).
# Both surfaces proxy to 127.0.0.1:8444 — the coordinator's
# provider port, where Step 3 mounts the in-process mux.
#
# SPEC §5.6 v0.1.8 rate-limit posture: hard 60 req/min per (IP,
# endpoint) tuple at the public tier, NO burst. Per-endpoint zones
# are mandatory (v12 CODE r11 002) so /overview, /leaderboard, and
# /health do NOT share quota. Authorization-bearing requests bypass
# the public limiter at the edge (in-process limiter caps them);
# the partner-tier 600 rpm/key/endpoint and the auth-failure tier
# 300 rpm/IP/endpoint both run IN PROCESS per SPEC §5.4.7.
#
# SECURITY r5 C1 — partner-key projection (exact $ per provider)
# MUST never persist at the edge. We set BOTH `proxy_cache_bypass`
# (read-bypass) AND `proxy_no_cache` (write-suppression) on
# $http_authorization.

# ---------------------------------------------------------------------
# http-context declarations.
#
# Per-endpoint limit_req_zone declarations — separate zone names so
# the 60-rpm quotas do NOT cross-contaminate (CODE r11 002).
#
# Shape (a) — Authorization-aware keying via $public_rl_key (the
# map below). When the request carries ANY Authorization header
# (valid or garbage), $public_rl_key evaluates to the empty string
# and the limit_req module SKIPS the request entirely (nginx
# documents: "if the key value is empty, the request is not
# counted"). Valid partner-key traffic therefore flows through the
# edge un-throttled at the public tier and is debited only by the
# in-process partner-tier limiter.
# ---------------------------------------------------------------------
map $http_authorization $public_rl_key {
    ""      $binary_remote_addr;
    default "";
}

limit_req_zone $public_rl_key zone=stats_overview:10m    rate=60r/m;
limit_req_zone $public_rl_key zone=stats_leaderboard:10m rate=60r/m;
limit_req_zone $public_rl_key zone=stats_health:10m      rate=60r/m;

# proxy_cache_path — public projections ONLY. The Authorization-
# present requests are explicitly excluded via proxy_no_cache +
# proxy_cache_bypass below.
#
# inactive=300s matches the SPEC §5.8 staleness for the overview
# (any cached entry older than 300s is irrelevant; the snapshot
# generated_at is the truth surface).
proxy_cache_path /var/cache/nginx/stats levels=1:2 keys_zone=stats_public:10m
                 max_size=128m inactive=300s use_temp_path=off;

# Access-log redaction — explicit log_format that does NOT
# reference $http_authorization. Operator-permitted fields only
# (remote_addr, request_line minus the auth header, status,
# bytes, referer, user_agent). The default `combined` format
# would include Authorization indirectly via $http_referer in
# some misconfigurations; we ship an explicit format so the
# audit lane can scan a single log line definition.
log_format stats_redacted '$remote_addr - - [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"-" "$http_user_agent" '
                          'rt=$request_time uct="$upstream_connect_time" '
                          'uht="$upstream_header_time" urt="$upstream_response_time"';

# Port 80: ACME challenge + redirect to https.
server {
    listen 80;
    listen [::]:80;
    server_name stats.streamvc.live;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Port 443: production TLS endpoint.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stats.streamvc.live;

    # TLS — certbot will fill these in after first run.
    # ssl_certificate     /etc/letsencrypt/live/stats.streamvc.live/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/stats.streamvc.live/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # SPEC-017 responses are JSON, capped well under 32 KiB even
    # at the 7-day leaderboard limit. The 8K buffers from the
    # coordinator vhost are more than enough.
    client_max_body_size       64k;
    large_client_header_buffers 4 8k;
    proxy_buffer_size           8k;
    proxy_buffers               4 8k;

    # Access-log: redacted format declared above.
    access_log /var/log/nginx/stats.streamvc.live-access.log stats_redacted;
    error_log  /var/log/nginx/stats.streamvc.live-error.log  warn;

    # ---------------------------------------------------------------------
    # /v1/stats/overview — locked SPEC §5.1 snapshot + 30-min timeseries.
    # ---------------------------------------------------------------------
    location = /v1/stats/overview {
        limit_req zone=stats_overview nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8444;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 10s;

        proxy_cache              stats_public;
        proxy_cache_valid 200    30s;
        proxy_cache_use_stale    error timeout updating;
        # SECURITY r5 C1: both directives are MANDATORY. The first
        # makes nginx SKIP cache reads when Authorization is
        # present; the second SUPPRESSES cache writes for the same
        # responses. proxy_cache_bypass alone would still WRITE.
        proxy_cache_bypass       $http_authorization;
        proxy_no_cache           $http_authorization;
    }

    # ---------------------------------------------------------------------
    # /v1/stats/leaderboard — locked SPEC §5.2; public vs partner-key
    # projection differs (Step 3 handler emits per request).
    # ---------------------------------------------------------------------
    location = /v1/stats/leaderboard {
        limit_req zone=stats_leaderboard nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8444;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 15s;

        proxy_cache              stats_public;
        proxy_cache_valid 200    30s;
        proxy_cache_use_stale    error timeout updating;
        proxy_cache_bypass       $http_authorization;
        proxy_no_cache           $http_authorization;
    }

    # ---------------------------------------------------------------------
    # /v1/stats/health — locked SPEC §5.3 component map.
    # ---------------------------------------------------------------------
    location = /v1/stats/health {
        limit_req zone=stats_health nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8444;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 10s;

        proxy_cache              stats_public;
        proxy_cache_valid 200    30s;
        proxy_cache_use_stale    error timeout updating;
        proxy_cache_bypass       $http_authorization;
        proxy_no_cache           $http_authorization;
    }

    # Anything else under /v1/stats/* → 404 from nginx so the
    # coordinator never sees unknown subpaths. Step 3 already
    # 404s these; the explicit edge block keeps the log surface
    # small.
    location /v1/stats/ {
        return 404;
    }

    # Everything else → 404 (this vhost only serves the three
    # locked SPEC endpoints).
    location / {
        return 404;
    }
}
