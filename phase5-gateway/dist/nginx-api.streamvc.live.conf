# /etc/nginx/sites-available/api.streamvc.live
#
# Reverse proxy for the SPEC-006 buyer API gateway on Pearl VPS.
# Gateway:     127.0.0.1:9443
# Coordinator remains private to gateway/coordinator host networking.
#
# This site deliberately does not expose coordinator /poolz, /healthz, or
# /ws/provider on api.streamvc.live.

server {
    listen 80;
    listen [::]:80;
    server_name api.streamvc.live;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.streamvc.live;

    # TLS is managed by certbot on Pearl.
    # ssl_certificate /etc/letsencrypt/live/api.streamvc.live/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.streamvc.live/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 8M;
    keepalive_timeout 360s;

    location = /v1/pool/check {
        return 404;
    }

    # OpenAI-compatible buyer API plus public status, all mediated by gateway.
    location /v1/ {
        proxy_pass http://127.0.0.1:9443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Demo-Token $http_x_demo_token;
        proxy_set_header X-Request-ID $http_x_request_id;

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        chunked_transfer_encoding on;
    }

    # Signup, demo-token issuance, and account key actions.
    location /auth/ {
        proxy_pass http://127.0.0.1:9443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    location = /account {
        proxy_pass http://127.0.0.1:9443/account;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        return 404;
    }

    location = /poolz {
        return 404;
    }

    location = /healthz {
        return 404;
    }

    location = /ws/provider {
        return 404;
    }

    location / {
        return 404;
    }
}
