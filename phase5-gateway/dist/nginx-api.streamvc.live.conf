# /etc/nginx/sites-available/api.streamvc.live
#
# Reverse proxy for the SPEC-006 buyer API gateway on Pearl VPS.
# Gateway:     127.0.0.1:9443
# Coordinator remains private to gateway/coordinator host networking except
# for the PG-2 guarded provider WebSocket upgrade route below.
#
# This site deliberately does not expose coordinator /poolz on api.streamvc.live.

limit_req_zone $binary_remote_addr zone=ws_provider_rate:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=ws_provider_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name api.streamvc.live;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.streamvc.live;

    # TLS is managed by certbot on Pearl.
    # ssl_certificate /etc/letsencrypt/live/api.streamvc.live/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.streamvc.live/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    client_max_body_size 8M;
    keepalive_timeout 360s;

    location = /v1/pool/check {
        default_type application/json;
        return 404 '{"error":{"message":"Not Found","type":"invalid_request_error","code":"not_found"}}';
    }

    # OpenAI-compatible buyer API plus public status, all mediated by gateway.
    location /v1/ {
        # SPEC-004/SPEC-006 defense in depth: buyer-facing nginx must not
        # pass any client-supplied coordinator-internal affinity headers.
        # The gateway also strips and audit-logs these before authentication.
        proxy_set_header X-MacProvider-Internal-Conv "";
        proxy_set_header X-MacProvider-Internal-Source "";
        proxy_pass http://127.0.0.1:9443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Demo-Token $http_x_demo_token;
        proxy_set_header X-Request-ID $http_x_request_id;

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        chunked_transfer_encoding on;
    }

    # Signup, demo-token issuance, and account key actions.
    location /auth/ {
        proxy_pass http://127.0.0.1:9443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    location = /account {
        proxy_pass http://127.0.0.1:9443/account;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /docs {
        proxy_pass http://127.0.0.1:9443/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        default_type application/json;
        return 404 '{"error":{"message":"Not Found","type":"invalid_request_error","code":"not_found"}}';
    }

    location = /poolz {
        default_type application/json;
        return 404 '{"error":{"message":"Not Found","type":"invalid_request_error","code":"not_found"}}';
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:9443/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /ws/provider {
        limit_req zone=ws_provider_rate burst=5 nodelay;
        limit_conn ws_provider_conn 5;
        proxy_pass http://127.0.0.1:8444;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 86400;
    }

    location / {
        default_type application/json;
        return 404 '{"error":{"message":"Not Found","type":"invalid_request_error","code":"not_found"}}';
    }
}
