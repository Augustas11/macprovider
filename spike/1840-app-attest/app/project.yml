# XcodeGen spec for the App Attest spike. The provisioning profile is not
# available at compile time, so the app is built unsigned and signed later by
# scripts/build-and-sign.sh. Bundle id override: SPIKE_BUNDLE_ID.
name: MalibuAttestSpike
options:
  bundleIdPrefix: tech.malibu
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SPIKE_BUNDLE_ID: tech.malibu.app
    PRODUCT_BUNDLE_IDENTIFIER: $(SPIKE_BUNDLE_ID)
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  MalibuAttestSpike:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: MalibuAttestSpike
        excludes:
          - Info.plist
    info:
      path: MalibuAttestSpike/Info.plist
    dependencies:
      - sdk: AppKit.framework
      - sdk: Security.framework
      - sdk: DeviceCheck.framework
      - sdk: CryptoKit.framework
    settings:
      base:
        PRODUCT_NAME: MalibuAttestSpike
        PRODUCT_BUNDLE_IDENTIFIER: $(SPIKE_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MalibuAttestSpike/Info.plist
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        ENABLE_HARDENED_RUNTIME: YES
schemes:
  MalibuAttestSpike:
    build:
      targets:
        MalibuAttestSpike: all
    run:
      config: Debug
    archive:
      config: Release
