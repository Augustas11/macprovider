# "Fake Pearl" VM for the #2084 shard group (SPEC-051) acceptance harness.
# Same image and shape as test/e2e-1690/lima-macprovider-1690.yaml (x86_64
# under qemu, so the linux-amd64 coordinator/gateway run as on Pearl).
# Everything is BUILT inside this VM; the Mac host runs limactl/ssh and the
# real Swift providers of scenario R (they reach the VM through the forwards
# below, bound to the host loopback only).
vmType: qemu
arch: x86_64
cpus: 4
memory: 8GiB
disk: 30GiB
images:
- location: "https://cloud-images.ubuntu.com/releases/resolute/release-20260720/ubuntu-26.04-server-cloudimg-amd64.img"
  arch: "x86_64"
  digest: "sha256:117816726abbdefc5ef3e38902e81a76f1c76c3610e709999d0885f9d5d9b477"
mounts: []
containerd:
  system: false
  user: false
param:
  internal_netplanOptional: "true"
portForwards:
# nginx TLS (api.malibu.tech / coordinator.malibu.tech stand-ins).
- guestPort: 443
  hostIP: 127.0.0.1
  hostPort: 28443
# Coordinator provider + admin listener (real Swift providers dial it).
- guestPort: 8444
  hostIP: 127.0.0.1
  hostPort: 28444
# Gateway (buyer requests from the host for scenario R).
- guestPort: 9443
  hostIP: 127.0.0.1
  hostPort: 29443
- guestPortRange: [1, 65535]
  ignore: true
