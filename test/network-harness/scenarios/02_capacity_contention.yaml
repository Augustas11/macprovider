# 02_capacity_contention.yaml — single model, 10 concurrent buyers,
# burst pattern. Stresses provider capacity beyond SPEC-001 FR-25's
# default max_concurrency=1 per provider.
#
# What we want to learn (phase A, descriptive — recorded only):
#  - Does the coordinator queue requests, fail-fast with 503
#    no_provider_available (per server.go:3183), or reject with
#    preflight_rejected 503 (per server.go:3209)?
#  - If multiple providers serve the same model, does load fan out?
#  - What's the latency tail when SlotsFree saturates?
#  - Are 5xx responses billing-settled (I2 catches orphans)?
#
# What gets asserted (the 4 hard invariants):
#  - I1 SKIPPED on live runs.
#  - I2 runs — critical here, since most expected failures are 503.
#  - I3, I4 run.
#
# Cost estimate (10 requests x 32 max_tokens, some will 5xx):
#  Order of cents.
name: capacity_contention
description: |
  10 buyers fire simultaneously at t=0. Forces the coordinator's
  capacity-exhaustion path to surface. Phase B will codify whether the
  observed behavior (queue / fail-fast / preflight reject) is the
  beta contract.

expected_shape: |
  Phase A note (descriptive, not asserted):
   - Some subset of requests will succeed (those that fit in available slots).
   - Others will fail with one of the SPEC-002 v1.4.1 FR-B1 503 codes:
     no_provider_available | preflight_rejected | provisional_quota_exceeded.
   - error_taxonomy should reveal which code dominates.
   - I2 will fail-loud if any 5xx response lacks a request-id echo.
   - PHASE B TRIAGE: which code IS the contract? Today the code path
     can hit 3 different 503s depending on race ordering; the contract
     should pick one or document the precedence.

target:
  gateway_url: https://api.streamvc.live
  coordinator_url: https://coordinator.streamvc.live
  buyer_token: ${BUYER_TOKEN}
  coordinator_db_ssh: ${PEARL_SSH}:/var/lib/macprovider-coordinator/coordinator.db
  gateway_db_ssh: ${PEARL_SSH}:/var/lib/macprovider-gateway/gateway.db

buyers:
  count: 10
  stream: false
  pattern: burst
  requests_per_buyer: 1

duration: 120s
request_timeout: 60s
silent_hang_threshold: 30s

prompts:
  - model: llama-3.2-3b-instruct-4bit
    user: "Reply with exactly the word: contend."
    max_tokens: 32
