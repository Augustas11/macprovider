# 04_wrong_model.yaml — buyer requests a model nobody serves. Negative
# path: verifies the network fails cleanly with a defined error code and
# does NOT charge the buyer for tokens never delivered.
#
# What we want to learn (phase A, descriptive — recorded only):
#  - Per SPEC-002 v1.4.1 FR-B1, no_provider_available 503 is the expected
#    code when no provider matches the model filter.
#  - Does the gateway surface that as 503 to the buyer, or coerce to 4xx?
#  - Is the request settled in usage_events with 0 tokens (no charge)
#    or omitted entirely?
#  - PHASE B TRIAGE: the contract should pin whether a no-match is a
#    503 (server-side capacity issue) or a 404 (client asked for nothing
#    that exists). Today it's 503; that's defensible but worth naming.
#
# What gets asserted (the 4 hard invariants):
#  - I1 SKIPPED on live runs.
#  - I2 is the load-bearing check here: a 5xx with no settlement entry
#    is a billing-bypass risk.
#  - I3 runs (no tokens should be charged).
#  - I4 N/A (non-streaming).
#
# Cost estimate (3 requests, all expected to fail before token generation):
#  Effectively $0.
name: wrong_model
description: |
  3 buyers each fire one request for a model id no provider advertises.
  Validates the negative path: clean error, no charge, no orphan settlement.

expected_shape: |
  Phase A note (descriptive, not asserted):
   - All 3 requests should return 5xx (most likely 503 no_provider_available).
   - All 3 should appear in error_taxonomy under a single code.
   - Zero tokens billed.
   - I2 fails if the gateway returns 5xx without echoing a request id.

target:
  gateway_url: https://api.streamvc.live
  coordinator_url: https://coordinator.streamvc.live
  buyer_token: ${BUYER_TOKEN}
  coordinator_db_ssh: ${PEARL_SSH}:/var/lib/macprovider-coordinator/coordinator.db
  gateway_db_ssh: ${PEARL_SSH}:/var/lib/macprovider-gateway/gateway.db

buyers:
  count: 3
  stream: false
  pattern: constant
  requests_per_buyer: 1

duration: 60s
request_timeout: 30s
silent_hang_threshold: 30s

prompts:
  - model: nonexistent-model-9000-test-only
    user: "This should never reach a provider."
    max_tokens: 16
