# 09_streaming_ttft_distribution.yaml — benchmark, phase B.
#
# Goal: characterize the TTFT distribution at high sample count.
# 100 short streaming requests with a 500ms gap to keep providers
# warm but avoid concurrency contention. This is the canonical
# "what does TTFT look like at scale" reference for B1 + B3.
#
# Cost estimate (100 × 8 max_tokens): negligible.
name: streaming_ttft_distribution
description: |
  100 sequential short streaming requests (max_tokens=8), 500ms gap.
  Characterizes the TTFT histogram; enough samples for stable
  percentiles. Benchmark — B1, B3.

expected_shape: |
  Phase B benchmark:
   - 100 requests, all 200.
   - TTFT p50 ≤ 800ms target.
   - p99/p50 ≤ 3.0 target.
   - Should land cleanly on one model so the latency signal isn't
     confounded by model-switch overhead.

target:
  gateway_url: https://api.streamvc.live
  coordinator_url: https://coordinator.streamvc.live
  buyer_token: ${BUYER_TOKEN}
  coordinator_db_ssh: pearl:/var/lib/macprovider/coordinator.db
  gateway_db_ssh: pearl:/var/lib/macprovider/gateway.db
  db_sudo_user: macprovider

buyers:
  count: 1
  stream: true
  pattern: interval
  interval_ms: 500
  requests_per_buyer: 100

duration: 180s
request_timeout: 30s
silent_hang_threshold: 15s

benchmark:
  enabled: true
  invariants: [B1, B3]

prompts:
  - model: mlx-community/Qwen3-32B-4bit
    user: "Say: ready."
    max_tokens: 8
