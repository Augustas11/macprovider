name: sku_earn_viability
mode: sku-econ
description: |
  Simulates autotune --recommend across the full supported hardware matrix
  against the live coordinator rate card. Locks the fresh-install ->
  donor-only regression class into a hard SKU-economics gate.

expected_shape: |
  SKU-economics gate (v4 per-token pivot):
   - Every tier row in hardware_matrix runs autotune recommend-simulate
     against the live /v1/rate-card.
   - earn_viability.json must show >=1 eligible recommendation for
     at_least_one_eligible_row tiers and eligible=0 for donor_only_by_ram tiers.

target:
  coordinator_url: https://coordinator.malibu.tech
  cli_bin: ../../phase3-binary/.build/release/macprovider-cli

hardware_matrix:
  # SPEC-023 §4.1 (#1483): 8 GB stays on the Llama 3.2 3B onboarding SKU;
  # 16 GB must recommend Llama 3.1 8B (the RAM-class row), not fall back to 3B.
  - {label: m1-8gb,   chip: "Apple M1",       memoryGB: 8,  bandwidthTier: C, expected: at_least_one_eligible_row, expected_recommended_model: "meta-llama/llama-3.2-3b-instruct"}
  - {label: m1-16gb,  chip: "Apple M1",       memoryGB: 16, bandwidthTier: C, expected: at_least_one_eligible_row, expected_recommended_model: "meta-llama/llama-3.1-8b-instruct"}
  - {label: m2-16gb,  chip: "Apple M2",       memoryGB: 16, bandwidthTier: C, expected: at_least_one_eligible_row, expected_recommended_model: "meta-llama/llama-3.1-8b-instruct"}
  - {label: m4-16gb,  chip: "Apple M4",       memoryGB: 16, bandwidthTier: C, expected: at_least_one_eligible_row, expected_recommended_model: "meta-llama/llama-3.1-8b-instruct"}
  - {label: m4-32gb,  chip: "Apple M4",       memoryGB: 32, bandwidthTier: C, expected: at_least_one_eligible_row}
  - {label: m4-64gb,  chip: "Apple M4",       memoryGB: 64, bandwidthTier: C, expected: at_least_one_eligible_row}
  - {label: m1-pro-16gb, chip: "Apple M1 Pro", memoryGB: 16, bandwidthTier: B, expected: at_least_one_eligible_row, expected_recommended_model: "meta-llama/llama-3.1-8b-instruct"}
  - {label: m3-max-36gb, chip: "Apple M3 Max", memoryGB: 36, bandwidthTier: A, expected: at_least_one_eligible_row}
  - {label: m3-ultra-96gb, chip: "Apple M3 Ultra", memoryGB: 96, bandwidthTier: S, expected: at_least_one_eligible_row}

invariants: [I5]

benchmark_synthesis:
  mode: warm_cache_synthetic
  tps_multiplier_of_gate: 1.10
  ttft_fraction_of_ceiling: 0.85

artifacts:
  - recommend_per_tier.jsonl
  - rate_card_snapshot.json
  - earn_viability.json
