# 16_sticky_cache_reuse.yaml — benchmark, phase C (regression gate).
#
# Guards the sticky-routing + KV-cache-reuse win that is already measured
# and banked (#376: ~64% turn-2 prompt-cache reuse on a ~3.9k-token shared
# prefix, live 2026-07-09). Nothing else currently fails when a routing
# change, coord config flip, or provider-side prefix-cache regression
# silently takes that win back — this scenario + invariants B8/B9 are that
# guard. It locks in the cache-reuse win the way B7 locks in the cold/warm
# ratio (RESEARCH_236, P4).
#
# Mechanism (mirrors test/e2e/canary-buyer/probe.mjs): each buyer fires a
# sequence of non-streaming requests under a per-buyer sticky conversation
# tag, so every turn routes back to the SAME provider. The harness
# prepends a per-buyer, per-run deterministic ~2.7k-token "reference facts"
# prefix (cache_prefix_lines) to each request. request_index 0 is the cold
# first-touch that WARMS the provider's prefix cache (tagged "uncached");
# request_index >= 1 are the warm turns that should REUSE it (tagged
# "cached"). On the warm turns the harness reads usage.cached_prompt_tokens
# / usage.prompt_tokens.
#
# Hard rules honoured (RESEARCH_236):
#  1. Large prefix (~2.7k tokens) — a small prefix makes turn-2
#     cached_prompt_tokens always 0 and the metric meaningless. Enforced by
#     the MinCachePrefixLines floor in the schema.
#  2. stream: false — the terminal usage frame is reliably present
#     (streaming usage can drop for large prompts, #511).
#  3. B8 SKIPs (never FAILs) when the gateway omits usage.
#
# Requires sticky routing ON on both sides (verified live 2026-07-22:
# gateway routing.sticky_enabled=true + key_hash_secret set; coordinator
# routing.sticky_enabled=true; /v1/models tier1_disclosure.sticky_affinity
# .enabled=true, ttl 1800s). If sticky is off, warm turns scatter to a
# cold provider and B8 reports collapsed reuse.
#
# Cost estimate (8 requests x 12 max_tokens, ~2.7k prompt tokens each):
# order of cents. Light and prod-safe — no sustained load.
name: sticky_cache_reuse
description: |
  1 buyer x 8 sequential non-streaming sticky turns sharing a large
  ~2.7k-token prefix. Measures turn-2+ KV-cache reuse
  (cached_prompt_tokens / prompt_tokens) and the cached-vs-uncached TTFT
  advantage. Phase-C regression gate for the #376 reuse win.

expected_shape: |
  Phase C benchmark:
   - 8 total requests (1 buyer x 8 turns).
   - Per buyer: request_index 0 is the cold uncached first-touch;
     request_index 1..7 are warm cached turns on the same sticky
     provider.
   - B8 scores median (cached_prompt_tokens / prompt_tokens) across the
     warm turns; floor is provisional, calibrated from the prod baseline.
   - B9 scores cached_turn_ttft_p50 / uncached_turn_ttft_p50; a warm turn
     should start faster than the cold first-touch.
   - With sticky OFF: warm turns route to a cold provider, reuse collapses
     to ~0, B8 FAILs.

target:
  gateway_url: https://api.streamvc.live
  coordinator_url: https://coordinator.streamvc.live
  buyer_token: ${BUYER_TOKEN}
  coordinator_db_ssh: pearl:/var/lib/macprovider/coordinator.db
  gateway_db_ssh: pearl:/var/lib/macprovider/gateway.db
  db_sudo_user: macprovider

# count: 1 — the live pool serves each model from a SINGLE provider
# with a SINGLE slot (2026-07-22), so concurrent buyers contend and 503.
# A single sequential buyer keeps every turn on the one warm provider,
# which is exactly what the reuse measurement needs.
buyers:
  count: 1
  stream: false
  pattern: sticky_cache
  interval_ms: 1500
  requests_per_buyer: 8
  # SPEC-004 Pillar A: per-buyer conversation tag → all of a buyer's turns
  # route to one provider so the warm turns reuse its prefix cache.
  sticky_conversation_key: "harness-scenario-16-buyer-%d"
  # ~30 tokens/line * 90 = ~2.7k tokens — over the provider's prefix-cache
  # granularity yet safely under the live providers' max_context_tokens
  # (4000 as of 2026-07-22), so the request is not rejected with
  # context_exceeds_capacity. probe.mjs used ~3.9k against a
  # larger-context provider; size this to the target pool's cap.
  cache_prefix_lines: 90

duration: 300s
request_timeout: 60s
silent_hang_threshold: 30s

benchmark:
  enabled: true
  invariants: [B1, B8, B9]

prompts:
  - model: mlx-community/Qwen3-Coder-30B-A3B-Instruct-4bit
    user: "Using the reference facts above, reply with exactly one word: pong."
    max_tokens: 12
