# smoke.yaml — minimal scenario: 1 buyer, 3 sequential non-streaming
# prompts against a local stack. Used to validate the harness itself
# (parser, buyer client, artifact bundle, invariant evaluator) before
# any real network-behavior scenario is wired up.
#
# To run:
#   1. Start coordinator + gateway locally (e.g. via test/integration
#      helpers or `make dev-stack`).
#   2. Note the buyer-token printed by the gateway during startup.
#   3. ./harness run scenarios/smoke.yaml --out artifacts/smoke-$(date -u +%Y%m%dT%H%M%S)
#
# All 4 hard invariants are expected to PASS on a healthy local stack.
# A failure here means the harness or the stack is misconfigured —
# investigate before running real scenarios.
name: smoke
description: |
  Sanity scenario: one buyer fires three sequential non-streaming chat
  completions. Validates the harness pipeline end-to-end without
  exercising concurrency, streaming, or failover.

expected_shape: |
  Phase A note (descriptive, not asserted):
   - All 3 requests should return HTTP 200.
   - One provider should appear in route_distribution.
   - Token counts should reconcile cleanly across coordinator and gateway.
   - No silent hangs, no orphan 5xx.

target:
  gateway_url: http://127.0.0.1:8080
  coordinator_url: http://127.0.0.1:8081
  # Adjust these to wherever the local stack writes its DBs. Comment
  # both out to skip I1 (reconciliation).
  coordinator_db_path: /tmp/macprovider-coordinator.db
  gateway_db_path: /tmp/macprovider-gateway.db
  buyer_token: REPLACE_ME_WITH_LOCAL_BUYER_TOKEN

buyers:
  count: 1
  stream: false
  pattern: constant
  requests_per_buyer: 3

duration: 60s
request_timeout: 30s
silent_hang_threshold: 30s

prompts:
  - model: llama-3.1-8b-instruct
    user: "Say hello in one short sentence."
    max_tokens: 32
  - model: llama-3.1-8b-instruct
    user: "What is 2+2? Answer in one word."
    max_tokens: 16
  - model: llama-3.1-8b-instruct
    user: "Name one ocean."
    max_tokens: 16
