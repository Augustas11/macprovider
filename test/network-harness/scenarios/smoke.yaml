# smoke.yaml — basic live sanity scenario against api.streamvc.live.
# One buyer, three sequential non-streaming prompts, conservative
# max_tokens so a run costs cents, not dollars.
#
# Run:
#   export BUYER_TOKEN="..."           # buyer bearer token
#   ./harness run scenarios/smoke.yaml --out artifacts/smoke-$(date -u +%Y%m%dT%H%M%S)
#
# What this scenario validates:
#   - The harness itself: parser, buyer client, artifact bundle, invariant evaluator.
#   - That a single buyer can reach the live gateway, get routed to a provider,
#     and receive a complete response.
#
# What gets recorded (phase A, descriptive):
#   - HTTP status codes
#   - Route attribution (X-Provider-Id if exposed)
#   - TTFT and total latency
#
# What gets asserted (the 4 hard invariants):
#   - I1 SKIPPED on live runs (no read access to Pearl SQLite DBs).
#   - I2, I3, I4 all run.
name: smoke
description: |
  Live sanity scenario: one buyer fires three sequential non-streaming
  chat completions against api.streamvc.live. Confirms harness pipeline
  end-to-end without exercising concurrency, streaming, or failover.

expected_shape: |
  Phase A note (descriptive, not asserted):
   - All 3 requests should return HTTP 200.
   - At least one provider should appear in route_distribution if the
     gateway exposes provider attribution headers.
   - No silent hangs, no orphan 5xx.
   - I1 will be marked SKIPPED (DB paths intentionally unset for live).

target:
  gateway_url: https://api.streamvc.live
  coordinator_url: https://coordinator.streamvc.live
  buyer_token: ${BUYER_TOKEN}
  # Live ledger reconciliation: harness SCPs a VACUUM INTO snapshot of
  # each SQLite file from Pearl before reconcile. Set PEARL_SSH to the
  # ssh target (e.g. PEARL_SSH=root@pearl-vps.streamvc.live). Adjust the
  # paths if the production install layout differs.
  coordinator_db_ssh: ${PEARL_SSH}:/var/lib/macprovider-coordinator/coordinator.db
  gateway_db_ssh: ${PEARL_SSH}:/var/lib/macprovider-gateway/gateway.db

buyers:
  count: 1
  stream: false
  pattern: constant
  requests_per_buyer: 3

duration: 120s
request_timeout: 60s
silent_hang_threshold: 30s

prompts:
  - model: llama-3.2-3b-instruct-4bit
    user: "Say hello in one short sentence."
    max_tokens: 32
  - model: llama-3.2-3b-instruct-4bit
    user: "What is 2+2? Answer in one word."
    max_tokens: 16
  - model: llama-3.2-3b-instruct-4bit
    user: "Name one ocean."
    max_tokens: 16
