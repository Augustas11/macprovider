# smoke.yaml — basic live sanity scenario against api.malibu.tech.
# One buyer, three sequential non-streaming prompts, conservative
# max_tokens so a run costs cents, not dollars.
#
# What this scenario validates:
#   - The harness itself: parser, buyer client, artifact bundle, invariant evaluator.
#   - That a single buyer can reach the live gateway, get routed to a provider,
#     and receive a complete response.
#
# What gets asserted (the 4 hard invariants):
#   - I1 runs — pulls VACUUM INTO snapshot from Pearl via ssh pearl alias.
#   - I2 runs — 5xx-must-have-request-id.
#   - I3 structural check.
#   - I4 silent-hang check.
name: smoke
description: |
  Live sanity scenario: one buyer fires three sequential non-streaming
  chat completions against api.malibu.tech. Confirms harness pipeline
  end-to-end against the live network.

expected_shape: |
  Phase A note (descriptive, not asserted):
   - All 3 requests should return HTTP 200.
   - At least one provider should appear in route_distribution if the
     gateway exposes provider attribution headers.
   - I1 should reconcile cleanly (3 requests on both sides, matching tokens).
   - No silent hangs, no orphan 5xx.

target:
  gateway_url: https://api.malibu.tech
  coordinator_url: https://coordinator.malibu.tech
  buyer_token: ${BUYER_TOKEN}
  # Pearl SSH alias from ~/.ssh/config. DB files belong to the
  # `macprovider` service user; db_sudo_user wraps sqlite3 in sudo -u.
  coordinator_db_ssh: pearl:/var/lib/macprovider/coordinator.db
  gateway_db_ssh: pearl:/var/lib/macprovider/gateway.db
  db_sudo_user: macprovider

buyers:
  count: 1
  stream: false
  pattern: constant
  requests_per_buyer: 3

duration: 180s
request_timeout: 90s
silent_hang_threshold: 30s

prompts:
  # mlx-community/Qwen3-32B-4bit is the hash-verified
  # model currently served by the non-local provider. Stable choice.
  - model: mlx-community/Qwen3-32B-4bit
    user: "Say hello in one short sentence."
    max_tokens: 32
  - model: mlx-community/Qwen3-32B-4bit
    user: "What is 2+2? Answer in one word."
    max_tokens: 16
  - model: mlx-community/Qwen3-32B-4bit
    user: "Name one ocean."
    max_tokens: 16
